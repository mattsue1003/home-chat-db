在哪裡？廟埕嗎？"}, {"q": "拜拜的時候要準備什麼供品？阿嬤可以教我嗎？", "kind": "請教", "ans": [{"a": "拜神明要三牲，雞、豬肉、魚，水果不能拿番石榴，還有釋迦也不拿。拜祖先要煮飯菜。", "r": "原來水果也有講究！阿嬤懂好多，我要記下來。為什麼番石榴不能拜呢？"}, {"a": "我們佛堂只拜素的，鮮花、水果、清茶就好。", "r": "清清淨淨的，好莊重。阿姨在佛堂裡最喜歡做什麼？誦經嗎？"}, {"a": "很麻煩，現在我都不弄了。", "r": "以前做那麼多年，真的辛苦了。現在換年輕人來接手了嗎？"}], "more": "那中元普渡的時候，阿嬤家擺幾桌？"}, {"q": "阿公覺得，拜拜或是信仰，對您的人生有幫助嗎？", "kind": "開放", "ans": [{"a": "有喔，我年輕時跑船，每次出海都去拜媽祖，她保佑我平安回來好幾次。", "r": "媽祖一路保佑阿公平安。跑船的時候，最驚險的是哪一次？"}, {"a": "禱告讓我心比較定，先生走的時候，是教會的姊妹陪我走過來。", "r": "有人陪著一起走，真的很重要。阿姨現在還會想她們嗎？"}, {"a": "拜了也沒用，該來的還是會來。", "r": "人生遇到的事，有時真的很難。阿公一路走過來，靠的是什麼撐下去？"}], "more": "那您現在心裡有沒有什麼想要祈求的？"}], "care": "信仰很個人，居服員不要推銷自己的宗教，也不要評論長輩的信仰對錯。談到生死、病痛或喪偶時，長輩可能會說「神明不保佑」等負面話語，先接住失望與難過，不爭辯。", "next": "放一段鑼鼓或聖歌，請長輩跟著拍手打節奏；或請他教你雙手合十、拜拜的手勢。"}, {"id": "era-04", "cat": "節慶與時代記憶", "title": "全村圍著看電視", "sub": "黑白電視、史艷文到楊麗花", "lv": 2, "opener": "伯伯，我小時候家裡電視只有幾台，轉來轉去都要用手扭。聽說伯伯那時候電視更稀奇，整條巷子只有一台，是真的嗎？", "props": "一張黑白電視機（木頭外殼、有門、有轉台旋鈕）的照片、一尊布袋戲偶或照片、播〈醉彌勒〉或歌仔戲〈七字調〉一小段", "know": ["台灣第一家電視台台視在 1962 年 10 月 10 日開播；中視 1969 年開播，華視 1971 年開播，這就是所謂的「老三台」。", "早期是黑白電視，很貴，一台抵得上好幾個月薪水，很多是木頭外殼、有拉門，還要在屋頂裝天線；有電視的人家，晚上鄰居都會擠來看。", "1970 年黃俊雄布袋戲《雲州大儒俠》在台視播出，主角史艷文轟動全台，收視率極高，1974 年被政府下令停播。", "楊麗花是電視歌仔戲代表人物，擅長反串小生，在台視演出多年，很多阿嬤是她的戲迷。", "台灣第一部電視連續劇是 1969 年中視的《晶晶》；後來像 1974 年華視《包青天》、1983 年台視《星星知我心》都是全家守在電視前看的戲。"], "qs": [{"q": "伯伯家第一台電視是什麼時候買的？還是去別人家看？", "kind": "回想", "ans": [{"a": "我是去村長家看的，他家第一個有電視，晚上門口擠滿人，連窗戶外面都站人。", "r": "連窗戶外都站人，那個場面好熱鬧！村長會不會趕人？"}, {"a": "我們家是分期付款買的，木頭箱子，還有兩扇門，不看的時候要關起來，怕灰塵。", "r": "電視還有門！那時候真的是寶貝。是誰負責開門關門？"}, {"a": "電視喔，我不記得了。", "r": "沒關係，伯伯看看這張照片，這種電視有沒有看過？上面有兩個轉的鈕。"}], "more": "那時候電視收不清楚，是不是要爬上屋頂轉天線？"}, {"q": "史艷文那個布袋戲，伯伯有沒有看過？", "kind": "是非", "ans": [{"a": "當然有！史艷文、藏鏡人，一到中午大家都跑回家看，連田裡的工作都放下。", "r": "連田裡的工作都放下，好誇張！伯伯比較喜歡史艷文，還是藏鏡人？"}, {"a": "我小孩在看，我沒在看，那是小孩子的東西。", "r": "那伯伯的孩子看完，會不會學裡面的台詞？"}, {"a": "沒看過，我們那時候在山上，沒有電視。", "r": "山上沒有電視，那晚上大家都怎麼打發時間？聊天還是聽收音機？"}], "more": "那時候有沒有誰會學布袋戲的口白？"}, {"q": "阿嬤喜歡看歌仔戲嗎？楊麗花演的戲有沒有看？", "kind": "選擇", "ans": [{"a": "楊麗花喔！她扮小生好帥，比男人還帥，我每集都看，看到哭。", "r": "看到哭，阿嬤一定很入戲！最讓您哭的是哪一段？"}, {"a": "我比較喜歡在廟口看真人演的，電視沒有那個味道。", "r": "現場看比較有感情，對不對。阿嬤那時候都坐第幾排？"}, {"a": "聽不懂，我是講客家話的。", "r": "原來阿嬤是客家人。那客家有採茶戲，阿嬤有看過嗎？"}], "more": "那阿嬤會不會唱一兩句歌仔戲？"}, {"q": "以前全家一起看的連續劇，伯伯還記得哪一齣嗎？", "kind": "回想", "ans": [{"a": "包青天！開封有個包青天，鐵面無私辨忠奸，那時候每天晚上都等著看。", "r": "伯伯一唱我就想起來了！您最喜歡看包青天斷什麼案子？"}, {"a": "星星知我心，那個媽媽生病把小孩送人，我看一次哭一次。", "r": "那齣真的很催淚，好多人都哭。阿姨看的時候，是想到自己的孩子嗎？"}, {"a": "忘了，都忘了。", "r": "名字忘了沒關係。那伯伯喜歡看哭哭的，還是打打殺殺的？"}], "more": "那時候看電視，誰負責轉台？"}, {"q": "那時候晚上看電視，大家會一起吃什麼、做什麼？", "kind": "開放", "ans": [{"a": "鄰居都帶自己的小板凳來，邊看邊嗑瓜子，看完還在門口聊天，聊劇情聊到很晚。", "r": "看完還要聊劇情，好像大家都是一家人。那時候鄰居感情很好吧？"}, {"a": "我在旁邊做家庭代工，一邊看一邊剪線頭、黏紙袋。", "r": "阿嬤邊看電視邊賺錢，好勤勞！那時候做的是什麼代工？"}, {"a": "沒什麼，就看一看就去睡了。", "r": "簡單看一下就休息，生活很規律。伯伯那時候大概幾點睡？"}], "more": "電視收播的時候，是不是會唱國歌？"}, {"q": "伯伯可以教我，那時候電視要怎麼開、怎麼轉台嗎？", "kind": "請教", "ans": [{"a": "先把門打開，按鈕拉出來，要等一下才會亮，轉台是用那個大鈕卡卡卡轉，收不好就拍兩下。", "r": "拍兩下就好了，這招好經典！伯伯拍了幾次電視？"}, {"a": "要先去屋頂轉天線，我在上面轉，太太在下面喊好了沒好了沒。", "r": "一個在屋頂一個在下面喊，好有默契！最後有沒有轉清楚？"}, {"a": "我不會，都是兒子在弄。", "r": "那伯伯就負責坐好位子看就好了。您最喜歡坐在電視的哪一邊？"}], "more": "那後來第一次看到彩色電視，是什麼感覺？"}], "care": "有些長輩家境較差、沒有電視，可能只能站在別人家窗外看，回想時會有自卑或心酸；山區、原住民部落或離島長輩可能很晚才有電視。不要假設每個人都看過，順著他說的經驗聊。", "next": "放一段〈包青天〉主題曲或歌仔戲，請長輩跟著哼；或請他用手比一比轉台的動作。"}, {"id": "era-05", "cat": "節慶與時代記憶", "title": "收音機裡的老歌", "sub": "廣播劇、鄧麗君到洪一峰文夏", "lv": 1, "opener": "阿姨，我今天早上在車上聽到鄧麗君的〈月亮代表我的心〉，跟著哼了一路。阿姨以前喜歡聽誰的歌？我們一起聽聽看好不好？", "props": "手機播〈月亮代表我的心〉、〈我是一片雲〉、〈媽媽請你也保重〉、〈舊情綿綿〉其中一首；一台老收音機照片", "know": ["1950–60 年代收音機是家裡最重要的娛樂，後來有小型電晶體收音機可以帶著走；中廣等電台播廣播劇、說書、歌唱節目，大家準時守在收音機前。", "台語歌：文夏（1928–2022）唱紅〈媽媽請你也保重〉〈黃昏的故鄉〉；洪一峰（1927–2010）有〈舊情綿綿〉〈思慕的人〉〈山頂的黑狗兄〉。", "國語歌：鄧麗君（1953–1995）〈月亮代表我的心〉〈小城故事〉；鳳飛飛（1953–2012）〈我是一片雲〉〈掌聲響起〉，愛戴帽子，人稱帽子歌后。", "1963 年邵氏黃梅調電影《梁山伯與祝英台》在台灣大轟動，凌波反串梁山伯，同年來台時萬人空巷；很多人會唱「遠山含笑」一段。", "那卡西是走唱樂隊，常見於北投溫泉旅館、酒家、喜宴，一兩個人帶手風琴、吉他、電子琴伴唱。"], "qs": [{"q": "阿姨，這首歌好不好聽？您聽過嗎？", "kind": "是非", "ans": [{"a": "這是鄧麗君！我最喜歡她了，聲音甜甜的，她走的時候我難過好久。", "r": "阿姨跟鄧麗君好有感情。她走的時候，您那時候在做什麼？"}, {"a": "好聽，好聽。（跟著哼）", "r": "阿姨哼得好好聽，我們再聽一次，一起唱好不好？"}, {"a": "聽不清楚，太小聲。", "r": "我調大聲一點，我們坐近一點聽。這樣有沒有比較清楚？"}], "more": "那阿姨會唱哪一句？"}, {"q": "以前家裡有收音機嗎？都放在哪裡？", "kind": "回想", "ans": [{"a": "有一台很大的，放在客廳櫃子上，蓋一條手帕，我爸爸不准小孩亂轉。", "r": "還蓋手帕，好愛惜。爸爸最愛聽什麼節目？"}, {"a": "我們家沒有，都去隔壁聽，後來我自己買了一台小的，掛在腰上去田裡。", "r": "掛在腰上邊做事邊聽，好聰明！那時候田裡都聽什麼？"}, {"a": "不知道。", "r": "沒關係。阿嬤看看這張照片，收音機長這樣，有沒有好像看過？"}], "more": "那時候有沒有聽過廣播劇或說書？"}, {"q": "阿公喜歡聽台語歌還是國語歌？文夏、洪一峰的歌有聽過嗎？", "kind": "選擇", "ans": [{"a": "台語歌啦，洪一峰的〈舊情綿綿〉，我年輕時在工地常常唱。", "r": "在工地唱歌，工作都比較有力氣。阿公可以唱一句給我聽嗎？"}, {"a": "我們老家那邊聽的是京戲，台語歌我聽不懂。", "r": "伯伯喜歡京戲呀！最喜歡哪一齣？您可以教我唱一句嗎？"}, {"a": "什麼歌都一樣，我不愛唱歌。", "r": "那伯伯年輕時候休息都做什麼？聽人家講古嗎？"}], "more": "那首歌讓阿公想起哪一段日子？"}, {"q": "梁山伯與祝英台那部黃梅調電影，阿姨有沒有看過？", "kind": "回想", "ans": [{"a": "有！凌波演梁兄哥，我去戲院看了好幾次，每次十八相送都哭。", "r": "看好幾次還每次哭，阿姨好入戲！是跟誰一起去看的？"}, {"a": "我會唱一點，遠山含笑……春水綠波……", "r": "阿姨唱得好有味道！我們一起再唱一次好不好？"}, {"a": "沒看過，那時候哪有錢看電影。", "r": "那時候賺錢不容易，看電影很奢侈。阿姨那時候都在忙什麼？"}], "more": "那時候的戲院在哪裡？買票要排隊嗎？"}, {"q": "鳳飛飛戴帽子唱歌，阿嬤覺得她好看嗎？", "kind": "感受", "ans": [{"a": "好看！她笑起來好親切，像鄰居的女兒，〈我是一片雲〉我都會唱。", "r": "像鄰居女兒，這個形容好貼切！阿嬤唱一句〈我是一片雲〉給我聽好嗎？"}, {"a": "我比較喜歡鄧麗君。", "r": "阿嬤是鄧麗君迷！那您最喜歡她哪一首？"}, {"a": "鳳飛飛是誰？", "r": "她是一個很愛戴帽子的女歌手。我放一首她的歌，阿嬤聽聽看熟不熟。"}], "more": "那阿嬤年輕時候，也會戴帽子出門嗎？"}, {"q": "以前喜宴或聚會，有沒有那卡西來走唱？阿公有上去唱過嗎？", "kind": "開放", "ans": [{"a": "有啊，我在北投吃過，拿麥克風唱〈媽媽請你也保重〉，旁邊拉手風琴，大家拍手。", "r": "阿公是麥克風高手！唱這首的時候，有沒有想到自己的媽媽？"}, {"a": "那是男人去喝酒的地方，我才不去。", "r": "阿嬤很有原則。那您自己最喜歡在哪裡唱歌？洗衣服的時候嗎？"}, {"a": "唱歌喔，以前會，現在聲音沒了。", "r": "聲音變了沒關係，心裡記得就好。我們用哼的，阿公跟著我哼好不好？"}], "more": "那阿公年輕時候的拿手歌是哪一首？"}], "care": "老歌常常牽起初戀、亡夫亡妻、離鄉或當兵的記憶，有的長輩會突然掉淚，這通常是好的情緒釋放，陪著就好，不用急著關掉音樂。注意音量，有聽損的長輩坐近一點、放慢節奏，不勉強他唱。", "next": "一起合唱一首長輩點的老歌，邊唱邊拍手或拍膝蓋打節拍。"}, {"id": "era-06", "cat": "節慶與時代記憶", "title": "走路坐車去遠方", "sub": "腳踏車、三輪車、火車到第一次出國", "lv": 3, "opener": "阿公，我今天騎機車來，路上好塞喔。聽說阿公年輕時候去哪裡都靠兩隻腳，或騎腳踏車，是不是啊？", "props": "一張老式黑色腳踏車（後面有貨架）的照片、一張紙卡火車票照片、一張台灣地圖、播〈台北上午零時〉或火車汽笛聲", "know": ["1950–60 年代很多人上學走路一兩個小時，鄉下常赤腳；腳踏車很貴，是大件財產，粗重的黑色鐵馬後面有貨架，可以載貨、載人。", "三輪車是 1950–60 年代城市主要的叫車方式，後來被計程車取代，台北從 1960 年代末開始逐步淘汰三輪車。", "公路局（台灣省公路局）經營長途客運，1950 年代末有「金馬號」，車上有車掌小姐剪票；1978 年中山高速公路全線通車。", "火車有普通車、平快車、對號快車；1966 年光華號柴油特快通車，1970 年有莒光號，1978 年有自強號；早期是硬紙卡車票，要剪票。", "1979 年政府開放國人出國觀光，之前出國要有公務、留學、經商等理由；1987 年開放赴大陸探親，很多外省伯伯那時第一次回老家。"], "qs": [{"q": "阿公小時候上學，是走路還是騎腳踏車？", "kind": "選擇", "ans": [{"a": "走路啊，走一個多小時，赤腳走，鞋子捨不得穿，到學校前才穿上。", "r": "到學校才穿鞋，好捨不得！一路上都會跟誰一起走？"}, {"a": "我是騎我哥哥的腳踏車，太高了腳踩不到，要斜斜伸進三角架裡面騎。", "r": "斜著騎三角架，好厲害的技術！摔過車嗎？"}, {"a": "我沒有讀書，從小就要去放牛。", "r": "那麼小就要幫忙家裡，阿公很早就懂事了。牛是誰家的？您都帶牠去哪裡吃草？"}], "more": "下雨天的時候怎麼辦？"}, {"q": "家裡第一台腳踏車，是做什麼用的？", "kind": "回想", "ans": [{"a": "那台鐵馬好重，我爸騎去市場載菜，後面可以載兩大籃，前面還能坐一個小孩。", "r": "一台車載菜又載小孩，好能幹的鐵馬！前面坐的是阿公嗎？"}, {"a": "我是騎腳踏車去賣冰棒，後面綁一個木箱，一邊搖鈴一邊喊。", "r": "賣枝仔冰！阿公一天可以賣幾枝？是怎麼喊的，可以喊給我聽嗎？"}, {"a": "沒有腳踏車，那太貴了。", "r": "那時候腳踏車真的是大件東西。那阿公第一次騎腳踏車，是借誰的？"}], "more": "那時候腳踏車壞了，要去哪裡修？"}, {"q": "阿嬤有沒有坐過三輪車？什麼時候會坐？", "kind": "是非", "ans": [{"a": "有，我出嫁那天就是坐三輪車，上面綁紅布，一路坐到婆家。", "r": "坐三輪車出嫁，好浪漫！那天阿嬤穿什麼衣服？心裡是緊張還是高興？"}, {"a": "很少坐，那要花錢，我們都用走的。", "r": "能走就走，阿嬤很節省。那時候走最遠的一次是去哪裡？"}, {"a": "我先生以前就是踩三輪車的，很辛苦，夏天曬得黑黑的。", "r": "先生每天踩那麼重的車，真的很辛苦。阿嬤在家都準備什麼給他吃？"}], "more": "那時候坐一趟大概要多少錢？"}, {"q": "阿公第一次坐火車是去哪裡？可以跟我說說那時候的火車嗎？", "kind": "開放", "ans": [{"a": "去台北做工，坐平快車，坐一整天，車上很擠，有人坐在走道上，還有賣便當、賣茶的。", "r": "一整天的車，好遠！一個人去台北，阿公那時候幾歲？會不會怕？"}, {"a": "我是當兵的時候坐的，整車都是阿兵哥，一路唱歌。", "r": "整車阿兵哥唱歌，好熱鬧。阿公在哪裡當兵？"}, {"a": "火車喔，有坐過吧，忘了去哪裡。", "r": "忘了地方沒關係。阿公喜歡坐靠窗的位子，還是靠走道的？"}], "more": "那時候火車上的鐵路便當，阿公有買過嗎？"}, {"q": "阿公可以教我，那時候坐公路局要怎麼買票、怎麼上車嗎？", "kind": "請教", "ans": [{"a": "去車站窗口買票，車上有車掌小姐，穿制服，幫你剪票，還會喊下一站。", "r": "車掌小姐，好多長輩都記得！阿公還記得她們怎麼喊站名嗎？"}, {"a": "鄉下沒有車站，站在路邊招手，司機就會停。", "r": "原來路邊招手就可以，好有人情味。那班車一天有幾班？"}, {"a": "不知道，我都跟著別人走。", "r": "跟著大家一起比較放心。那阿公最常坐車去哪裡？去看醫生還是去市場？"}], "more": "那時候車子會不會很晃？有沒有人暈車？"}, {"q": "阿公第一次坐飛機或出國，是什麼時候？那時候心情怎麼樣？", "kind": "感受", "ans": [{"a": "開放探親那年我回老家，坐飛機轉香港，四十年沒見到我娘，一下飛機就哭了。", "r": "四十年才見到媽媽，那一刻一定說不出話來。伯伯願意跟我說說那次見面的樣子嗎？"}, {"a": "跟團去日本，第一次坐飛機，耳朵好痛，飛機餐我全部吃光光。", "r": "飛機餐全部吃光，阿嬤好捧場！日本最讓您印象深刻的是哪裡？"}, {"a": "我一輩子沒坐過飛機，也不想坐。", "r": "腳踏實地最安心。那阿公這輩子去過最遠的地方是哪裡？"}], "more": "如果現在可以去一個地方，阿公最想去哪裡？"}], "care": "交通話題可能牽動離鄉打拚、當兵、逃難來台（外省長輩）、新住民婆婆遠嫁來台的心情，也可能想起交通事故或已經過世的家人。現在行動不便的長輩可能會感嘆「現在哪裡都去不了」，先接住失落，再聊聊現在還能去的地方或想去的地方。", "next": "攤開台灣地圖，請長輩指出老家、工作過、旅行過的地方，用貼紙標起來畫成「人生路線圖」。"}, {"id": "now-01", "cat": "當下生活與興趣", "title": "今天天氣好不好", "sub": "窗外、穿衣、節氣和今天吃什麼", "lv": 1, "opener": "阿嬤，我今天騎車過來，風吹得有點涼耶，我還多加了一件外套。我們來看看窗外，今天是出太陽還是陰陰的？", "props": "打開窗簾或窗戶一起看天空、讓長輩摸摸外面的空氣；一件薄外套和一件厚外套讓他選；一顆當季水果（冬天橘子、夏天西瓜照片）；可以播〈四季紅〉或〈雨夜花〉", "know": ["立冬在每年 11 月 7 或 8 日左右，台灣習俗叫「補冬」，會吃麻油雞、薑母鴨、羊肉爐，長輩常說「冬令進補，春天打虎」。", "冬至約在 12 月 21 或 22 日，家家搓湯圓，以前會把湯圓黏在門上或家具上敬神，說是吃了湯圓就多一歲。", "台灣秋冬吹東北季風，北部和東北部容易濕冷下雨，南部比較乾燥晴朗；長輩說「九降風」是新竹一帶秋天的強風，適合曬柿餅、米粉。", "清明前後雨多，端午前天氣還不穩，所以有「未吃五日節粽，破裘毋甘放」的說法，意思是端午前冬衣先別收。", "夏天午後常有雷陣雨，古早人叫「西北雨」，來得快去得也快，以前種田的人看天色就知道要不要趕快收稻穀。"], "qs": [{"q": "阿嬤，你看外面，今天是出太陽，還是陰陰的？", "kind": "選擇", "ans": [{"a": "有日頭啦，亮亮的，很好。", "r": "對耶，陽光照進來暖暖的，阿嬤看起來心情也很好。我們等一下要不要去窗邊曬一下手？"}, {"a": "不知道啦，我沒有看。", "r": "沒關係，我們現在一起看。你看那邊，天空是白白的還是藍藍的？"}, {"a": "陰陰的，好像要下雨，以前這種天要趕快收衫，不然曬不乾，我都一大早就把竹竿撐出去，看天色不對就喊孩子幫忙收。", "r": "哇，阿嬤以前看天色就知道要收衣服，好厲害。那時候孩子都會來幫忙嗎？"}], "more": "你喜歡出太陽的天，還是下雨的天？"}, {"q": "你摸摸看我的手，外面冷不冷？", "kind": "感受", "ans": [{"a": "冰冰的，你穿太少了啦！", "r": "被阿嬤發現了，我真的穿太少。阿嬤好會照顧人，你自己今天穿得夠暖嗎？"}, {"a": "還好啦。", "r": "還好就好，代表阿嬤身體暖暖的。那我們這件外套先放旁邊，冷了再穿好不好？"}, {"a": "我不要摸。", "r": "好，不摸不要緊。那阿嬤自己感覺，現在房間裡會冷還是會熱？"}], "more": "這種天氣，阿嬤以前會穿什麼衣服？"}, {"q": "今天要穿薄的這件，還是厚的這件？", "kind": "選擇", "ans": [{"a": "厚的，老人怕冷。", "r": "好，那我們穿厚的，暖暖的最舒服。來，手先伸這邊。"}, {"a": "都不要，我這件就好。", "r": "好，阿嬤自己最知道舒不舒服。如果等一下覺得冷，跟我說，我幫你拿。"}, {"a": "以前哪有這麼多衣服，冬天就是一件棉襖穿到底，裡面塞報紙也有，我媽媽會用舊衣服改，袖子短了就接一段。", "r": "原來以前是這樣過冬的，媽媽好巧手。棉襖穿起來是不是很重，但很暖？"}], "more": "冬天最冷的時候，阿嬤以前都怎麼取暖？"}, {"q": "現在快冬天了，以前冬天你們家會煮什麼來補一補？", "kind": "回想", "ans": [{"a": "麻油雞啊，酒放很多，整間厝都香。", "r": "光聽就聞到味道了。阿嬤的麻油雞是先炒薑嗎？薑要炒到怎樣？"}, {"a": "沒有啦，那時候窮，哪有在補。", "r": "那時候日子不好過，能吃飽就很不簡單了。那冬天比較常吃什麼熱熱的東西？"}, {"a": "我們北方人冬天吃餃子，大白菜一顆一顆堆在外面，凍得硬梆梆的。", "r": "伯伯是北方來的，冬天比台灣冷很多吧。大白菜放外面就不會壞，好聰明。餃子你都包什麼餡？"}], "more": "冬至的湯圓，阿嬤喜歡吃紅的還是白的？包餡的還是沒包的？"}, {"q": "阿嬤，今天中午你想吃熱湯，還是吃乾的？", "kind": "選擇", "ans": [{"a": "熱湯啦，喝了肚子暖。", "r": "好，天氣涼喝湯最好。阿嬤喜歡什麼湯？青菜湯還是排骨湯？"}, {"a": "吃不下，不想吃。", "r": "沒胃口喔，不勉強。那我們先喝一口溫溫的水，等一下肚子餓了再說好嗎？"}, {"a": "隨便啦，你煮什麼我就吃什麼。", "r": "阿嬤好好照顧喔。那我煮一個你喜歡的，等一下你嚐嚐看鹹淡，當我的評審。"}], "more": "這個季節，阿嬤覺得什麼菜最好吃？"}, {"q": "你教我，看天色怎麼知道等一下會不會下雨？", "kind": "請教", "ans": [{"a": "山頭戴帽就要落雨，雲壓很低，螞蟻在搬家，那就快了。", "r": "哇，阿嬤這個比氣象報告還準。螞蟻搬家我真的沒注意過，下次我也來看看。"}, {"a": "我哪知道，看電視就好了。", "r": "對，現在看電視就知道了，阿嬤很跟得上時代。那你平常看哪一台的氣象？"}, {"a": "以前在海邊，看海的顏色、風從哪邊來，阿爸就知道今天能不能出海。", "r": "阿嬤是海邊長大的，阿爸好有經驗。那不能出海的日子，家裡都在做什麼？"}], "more": "那天氣好的時候，阿嬤最喜歡去哪裡走走？"}], "care": "天氣話題通常很安全，但颱風、水災可能勾起房子被淹、親人受困的回憶；長輩若說起颱風夜的害怕，先說「那一定很可怕，還好你們撐過來了」，再慢慢帶回今天的窗外。中重度失智的長輩可能說錯季節或時間，不需要糾正，順著他的感覺聊就好。", "next": "一起把窗簾拉開曬手心三分鐘，或請長輩幫忙挑今天要穿的衣服、一起剝一顆橘子聞聞味道。"}, {"id": "now-02", "cat": "當下生活與興趣", "title": "今天精神好不好", "sub": "聊聊精神、痠痛和睡得好不好", "lv": 1, "opener": "伯伯，我昨天晚上看電視看太晚，今天一直打哈欠，好想睡喔。你昨晚睡得怎麼樣？", "props": "一條溫毛巾讓長輩敷手；一罐家裡常用的綠油精或萬金油聞味道（只聞，不擅自擦藥）；1 到 5 張笑臉圖卡讓長輩指「今天精神幾分」；可輕聲播〈搖嬰仔歌〉", "know": ["老化後睡眠變淺、比較早醒、半夜起來上廁所都很常見，很多長輩晚上八九點就睡、清晨四五點起床。", "失智長輩常有「日落症候群」，傍晚到天黑時比較容易焦躁、想回家、坐不住，這時陪伴說話、開燈、放慢節奏會有幫助。", "長輩常用撒隆巴斯、綠油精、萬金油、白花油，隨身帶在口袋，聞到這些味道就有安全感。", "失智或表達困難的長輩，身體不舒服時可能說不清楚，而是用皺眉、摸某個部位、拒絕起身、突然生氣來表現。", "居服員不做診斷也不給藥，遇到跌倒、發燒、突然說話不清、嘴歪、一側手腳沒力、持續不吃不喝、大小便明顯改變，要照機構流程立刻回報督導與家屬。"], "qs": [{"q": "伯伯，你今天精神好不好？這裡有五個笑臉，你指一個給我看。", "kind": "選擇", "ans": [{"a": "這個，笑最大的，今天很好！", "r": "哇，五分滿分，看到你精神好我也開心起來了。今天是什麼讓你這麼有精神？"}, {"a": "不要指，沒什麼好不好的。", "r": "好，不用指也可以。我看伯伯今天坐得很挺，應該還不錯喔。"}, {"a": "中間這個啦，普通，老了就是這樣，早上起來骨頭都硬硬的，要動一下才會開。", "r": "早上骨頭硬硬的，要慢慢動才會開，伯伯好了解自己的身體。那我們等一下慢慢起來，不要急。"}], "more": "一天裡面，伯伯覺得什麼時候精神最好？"}, {"q": "昨天晚上睡得好不好？", "kind": "是非", "ans": [{"a": "很好啊，一覺到天亮。", "r": "一覺到天亮，真的很難得，難怪今天氣色好。伯伯是幾點就去睡？"}, {"a": "不記得了。", "r": "沒關係，記不得也正常。那你現在覺得眼睛重重的想睡，還是很清醒？"}, {"a": "沒睡好，一直起來尿尿，又想東想西，翻來翻去到天亮。", "r": "一直醒來又想東想西，一定很累。伯伯都在想些什麼呢？說出來會比較輕鬆。"}], "more": "伯伯睡覺喜歡蓋厚棉被，還是薄薄的？"}, {"q": "你今天身上有沒有哪裡痠痠的、不舒服？", "kind": "是非", "ans": [{"a": "腳啦，膝蓋這裡，走路就卡卡的。", "r": "膝蓋卡卡的，走路會辛苦吧。我會跟家人和督導說一聲。現在坐著有比較舒服嗎？"}, {"a": "沒有，都很好。", "r": "都很好就太好了。如果等一下哪裡不舒服，隨時跟我說喔。"}, {"a": "全身都痛啦，老了沒用了。", "r": "全身都痛，聽了好心疼。你不是沒用，你撐過這麼多年很厲害。現在最痛的是哪一個地方，指給我看好嗎？"}], "more": "痠的時候，伯伯以前都用什麼方法讓自己舒服一點？"}, {"q": "以前做事做到腰痠背痛，你都怎麼讓自己舒服一點？", "kind": "回想", "ans": [{"a": "貼撒隆巴斯啊，我口袋都有一包，還有綠油精，聞一下就醒。", "r": "原來伯伯的法寶是這些，那個味道一聞就很熟悉。要不要聞一下這罐，看是不是你以前用的味道？"}, {"a": "沒有在管它，做就對了，哪有時間痛。", "r": "那時候為了家，痛也要撐下去，真的很辛苦。現在可以好好休息了。"}, {"a": "我太太會幫我捶背，她手很有力，捶完就鬆了。", "r": "太太好體貼，捶背捶得剛剛好。伯伯說起她，聲音都溫柔了。你們那時候常這樣互相照顧嗎？"}], "more": "那時候累了，最想吃什麼東西補一補？"}, {"q": "你睡覺喜歡怎樣比較好睡？開燈還是關燈？有沒有聲音比較好睡？", "kind": "選擇", "ans": [{"a": "要留一盞小燈，全黑我會怕，起來尿尿看不到。", "r": "留小燈比較安心，也比較安全。我會記下來，也跟家人說伯伯喜歡留一盞燈。"}, {"a": "都可以啦。", "r": "伯伯很好睡喔。那睡覺前喜歡聽收音機，還是安安靜靜的？"}, {"a": "要聽收音機，聽人家講古，講著講著就睡著了，以前廣播講古講得好精彩，一天不聽會想。", "r": "聽講古睡覺，好有味道。伯伯最喜歡聽哪一種故事？我們可以找來聽聽看。"}], "more": "伯伯小時候是跟誰一起睡？"}, {"q": "伯伯，你教我，怎麼樣身體才會勇？你都有什麼撇步？", "kind": "請教", "ans": [{"a": "早睡早起，每天走路，吃飯七分飽，不要想太多。", "r": "伯伯這幾個撇步我要記起來。早睡早起我最做不到，你都幾點起床？"}, {"a": "沒有撇步，就是命啦。", "r": "伯伯說得好豁達。能活到現在，一定也有自己的辛苦和堅持。"}, {"a": "要做工，人要動，我種田的時候身體最好，現在坐著就全身不對勁。", "r": "人要動才有精神，伯伯說得真對。那我們等一下站起來，在客廳慢慢走兩圈好不好？"}], "more": "伯伯覺得自己這輩子，身體最勇的時候是幾歲？"}], "care": "只聊感受，不給醫療建議、不推薦藥或偏方，也不說「這沒什麼啦」否定長輩的不舒服。長輩說到疼痛、失眠、想不開、或你觀察到跌倒、發燒、說話不清、嘴歪、一側無力、不吃不喝等異狀，要記錄時間與狀況並立即回報督導與家屬。長輩說「老了沒用、想死」時，不要急著勸，先陪他說出心情，並一定回報。", "next": "一起做溫毛巾敷手、慢慢轉手腕腳踝，或陪長輩在窗邊坐五分鐘深呼吸。"}, {"id": "now-03", "cat": "當下生活與興趣", "title": "花草菜園與小動物", "sub": "陽台盆栽、菜園和家裡養的動物", "lv": 2, "opener": "阿姨，我家陽台種了一盆九層塔，結果被我澆水澆到快爛掉了，好傷心。你以前種東西都怎麼照顧的？", "props": "一小盆九層塔、薄荷或蔥讓長輩摸、聞、捏葉子；一把小澆水壺；雞、狗、鳥、貓的照片；可播雞啼、狗叫、鳥叫聲；一袋洗米水", "know": ["長輩陽台常種九層塔、蔥、辣椒、地瓜葉、蘆薈、黃金葛，蘭花尤其受歡迎，台灣的蝴蝶蘭很有名。", "很多長輩會用洗米水、洗菜水澆花，也會把蛋殼、茶葉渣、果皮埋進土裡當肥料。", "早年鄉下三合院前面的「埕」會養雞鴨，雞蛋拿來補身體或換錢，逢年過節才殺雞拜拜。", "以前養狗多半是看門，名字常叫小黑、小白、來福，吃剩飯拌湯，不像現在吃飼料。", "早年也有人養綠繡眼、白頭翁、畫眉、文鳥，現在很多野鳥受保護不能隨便抓，聊往事就好，不用評論。"], "qs": [{"q": "阿姨，你聞聞看，這是什麼葉子的味道？", "kind": "感受", "ans": [{"a": "九層塔！炒蛋、三杯雞都要放這個。", "r": "阿姨一聞就知道，好厲害。九層塔炒蛋我最愛了，你炒的時候是先放蛋還是先放九層塔？"}, {"a": "不知道，香香的。", "r": "對，香香的。這是九層塔，你捏捏看葉子，手指也會香喔。"}, {"a": "我不喜歡這個味道，太重了。", "r": "這個味道真的比較嗆，不是每個人都喜歡。那阿姨喜歡什麼植物的味道？"}], "more": "阿姨家裡以前有種花或種菜嗎？"}, {"q": "你以前家裡有沒有種菜？種了什麼？", "kind": "回想", "ans": [{"a": "有啊，屋後一大塊，空心菜、地瓜葉、菜頭、蔥，自己種自己吃，吃不完就送鄰居，我每天透早就去拔草澆水，挑水很重。", "r": "自己種自己吃，還分給鄰居，好有人情味。透早挑水一定很辛苦，那時候是用扁擔挑嗎？"}, {"a": "沒有，我們住城裡，都去市場買。", "r": "住城裡去市場買比較方便。那阿姨以前常去哪個市場？最喜歡買什麼菜？"}, {"a": "我們山上種小米、地瓜，還有很多野菜，年輕人去山上採。", "r": "山上的小米和野菜，聽起來好特別。阿姨小時候也跟著去採嗎？採回來怎麼煮？"}], "more": "自己種的菜，跟買的菜吃起來哪裡不一樣？"}, {"q": "種東西有什麼撇步？你教我，我這盆九層塔要怎麼救？", "kind": "請教", "ans": [{"a": "水不要澆太多，看土乾了再澆，還要曬太陽，頂端的花要摘掉，它才會一直長葉子。", "r": "原來花要摘掉，我都不知道。阿姨好專業，我回家馬上試，下次跟你報告。"}, {"a": "我也不會，丟掉再買就好。", "r": "哈哈，阿姨好乾脆。那阿姨覺得種菜比較好玩，還是看人家種比較好玩？"}, {"a": "用洗米水澆啦，蛋殼敲碎放土上面，我以前的花都開得很漂亮，鄰居都來問。", "r": "洗米水和蛋殼，原來這就是阿姨的秘方。鄰居都來問，阿姨那時候一定很得意吧。"}], "more": "阿姨種過最漂亮、最得意的是什麼花或菜？"}, {"q": "以前家裡有沒有養雞、養鴨，或是養狗？", "kind": "是非", "ans": [{"a": "有，養一群雞，每天早上去雞窩摸雞蛋，熱熱的。", "r": "摸到熱熱的雞蛋，一定很開心。那雞蛋都是自己吃，還是拿去換錢？"}, {"a": "沒有，沒養。", "r": "沒養也沒關係。那鄰居或親戚家有沒有養什麼動物，讓你印象很深的？"}, {"a": "有養狗，被車撞死了，我哭好久，後來就不敢再養了。", "r": "好捨不得，牠一定跟你很親。後來不敢再養，是因為太心疼了吧。牠叫什麼名字？"}], "more": "那隻動物，有什麼讓你記得很清楚的樣子或習慣？"}, {"q": "你喜歡狗、貓，還是鳥？", "kind": "選擇", "ans": [{"a": "狗，狗最忠心，主人回來就搖尾巴。", "r": "對，狗看到主人那種開心，誰都擋不住。阿姨以前回家，也有狗在門口等你嗎？"}, {"a": "都不喜歡，很髒。", "r": "阿姨愛乾淨，動物確實會掉毛。那花草呢？阿姨比較喜歡哪一種花？"}, {"a": "鳥，我先生以前養綠繡眼，每天早上提鳥籠去公園，跟一群老朋友比誰的鳥叫得好聽。", "r": "提鳥籠去公園，好有畫面。那時候伯伯一定很疼那隻鳥。阿姨有沒有跟去看過？"}], "more": "我們來聽聽看這個鳥叫聲，阿姨覺得像不像以前聽到的？"}, {"q": "現在如果可以再養一盆花或一隻小動物，你想要什麼？", "kind": "開放", "ans": [{"a": "種一盆蘭花，放在窗口，每天看它開花。", "r": "窗口一盆蘭花，每天看著好療癒。阿姨喜歡白色、紫色，還是黃色的？我可以問問家人一起準備。"}, {"a": "不要了，我顧不來了。", "r": "照顧東西真的要花力氣，阿姨很清楚自己的體力。那我們一起照顧這盆九層塔，你負責看，我負責澆水，好不好？"}, {"a": "想養一隻貓陪我，晚上比較不孤單，現在家裡都沒人說話。", "r": "晚上家裡安靜，會覺得孤單吧。謝謝阿姨說出來。我來的時候，我們就多說說話，我也會跟家人說你想有個伴。"}], "more": "阿姨覺得種花或養動物，最讓人開心的是什麼？"}], "care": "寵物死亡、被迫送走、或因搬家生病無法再照顧植物，都可能帶來失落感；長輩難過時先接住情緒、問寵物的名字和可愛的地方，不要說「再養一隻就好」。說到孤單時要記下並回報，可與家屬討論是否有適合的陪伴方式。", "next": "一起幫盆栽澆水、摘葉子聞味道，或請長輩教你怎麼分蔥、插枝。"}, {"id": "now-04", "cat": "當下生活與興趣", "title": "一雙巧手做什麼", "sub": "縫衣、毛線、竹編、木工和修東西", "lv": 2, "opener": "阿嬤，你看我這件外套的扣子快掉了，我自己縫都縫得歪歪的。你以前是不是很會縫衣服？", "props": "一件掉扣子的衣服、針線包（注意針的安全）；一團毛線和一支棒針；一個竹籃或竹編畚箕；鐵鎚、螺絲起子照片；可播收音機老歌當背景", "know": ["1950 到 70 年代很多家庭有腳踩式縫紉機，媽媽自己做衣服、改衣服，衣服破了就補丁，大的穿完給小的穿。", "1960、70 年代流行手打毛線背心、毛衣和圍巾，女孩子會互相交換花樣，也有人接打毛線的代工。", "1970 年代政府推動「客廳即工廠」，很多家庭在家做代工，例如縫成衣、組裝聖誕燈、做雨傘、塑膠花，大人小孩一起做。", "竹編是台灣常見手藝，南投竹山一帶很有名，做竹籃、竹簍、畚箕、竹椅、蒸籠；以前也有挑擔沿街修傘、補鍋子的師傅。", "客家婦女傳統穿藍衫，原住民族如泰雅族有精細的織布手藝，布上的花紋有家族與身分的意義。"], "qs": [{"q": "阿嬤，你摸摸看這團毛線，軟不軟？", "kind": "感受", "ans": [{"a": "軟啊，這種很好打，我以前打很多件背心給孩子穿。", "r": "阿嬤打過好多件背心，孩子穿著一定很暖。你都打什麼顏色給他們？"}, {"a": "不知道。", "r": "沒關係，我們用手摸摸就好。你看這個顏色，紅紅的，像不像過年的顏色？"}, {"a": "我不會這個，我只會種田。", "r": "種田也是一雙巧手，插秧要插得整齊很不容易。阿嬤那時候是誰教你插秧的？"}], "more": "阿嬤以前穿的衣服，大部分是買的還是自己做的？"}, {"q": "以前衣服破了，你們家是誰在補？", "kind": "回想", "ans": [{"a": "我啊，晚上孩子睡了，我就點燈補衣服，褲子膝蓋破了就補一塊，一件褲子補到三四塊都有。", "r": "晚上點燈幫孩子補衣服，阿嬤好辛苦也好用心。孩子長大了，知道你這樣為他們做嗎？"}, {"a": "我媽媽，我在旁邊幫她穿針。", "r": "幫媽媽穿針，阿嬤那時候眼睛一定很利。媽媽縫衣服的時候，都會跟你說些什麼？"}, {"a": "忘記了，好久以前了。", "r": "真的很久了，忘了也很正常。那我們看看這件，扣子快掉了，阿嬤覺得要用白線還是黑線？"}], "more": "那時候家裡有縫紉機嗎？用腳踩的那種？"}, {"q": "你教我，扣子要怎麼縫才不會一下就掉？", "kind": "請教", "ans": [{"a": "線要雙股，十字縫，最後在下面繞幾圈再打結，這樣就牢。", "r": "雙股、十字、繞幾圈，我記起來了。阿嬤講得好清楚，比網路影片還好懂。"}, {"a": "眼睛看不到了，不會了。", "r": "眼睛看不清楚，那我來縫，阿嬤幫我看歪不歪，你當我的師父好不好？"}, {"a": "這種小事你要學起來啦，現在的年輕人什麼都不會，衣服破了就丟。", "r": "阿嬤說得對，我們這代真的比較不會。所以要趁現在跟你學，你在旁邊幫我看著。"}], "more": "阿嬤這一輩子做過最得意的一件衣服或作品是什麼？"}, {"q": "你們家以前有沒有人會做竹籃、做木工，或是修東西？", "kind": "回想", "ans": [{"a": "我阿爸會編竹籃，一個晚上就一個，拿去市場賣，我在旁邊削竹篾，手常常被割到。", "r": "阿爸好厲害，阿嬤也是小幫手。被竹篾割到一定很痛，那時候怎麼處理傷口？"}, {"a": "我是做木工的，桌子椅子都做過，這間房子的櫃子也是我做的。", "r": "這個櫃子是伯伯做的？我每天看都沒發現，做得好紮實。可以跟我說說這個櫃子怎麼做的嗎？"}, {"a": "沒有，壞了就請人修。", "r": "請專業的人修最放心。以前有沒有修雨傘、補鍋子的師傅，挑著擔子到巷子裡喊？"}], "more": "那時候常用的工具，阿嬤（伯伯）還記得叫什麼名字嗎？"}, {"q": "以前有沒有在家裡做過家庭代工？做什麼？", "kind": "回想", "ans": [{"a": "有，做聖誕燈，一串一串插燈泡，全家坐在客廳做到半夜，一串才幾毛錢。", "r": "全家一起做到半夜，一串幾毛錢慢慢累積，真的很不容易。那時候賺的錢都拿去做什麼？"}, {"a": "不記得了。", "r": "沒關係。那我問簡單的，你以前比較常用手做事，還是用腳踩、用力氣做事？"}, {"a": "沒有，我在工廠上班，紡織廠，三班制，機器很吵。", "r": "在紡織廠三班輪，很辛苦也很了不起，台灣那時候就是靠你們撐起來的。上大夜班的時候會不會很想睡？"}], "more": "做手工的時候，大家會一邊聊天、一邊聽收音機嗎？"}, {"q": "如果現在給你一團毛線，或一塊布，你想做什麼？", "kind": "開放", "ans": [{"a": "做一條圍巾給我孫子，他冬天騎車很冷。", "r": "做給孫子的圍巾，一定是全世界最暖的。我們可以慢慢做，一天打幾排就好。"}, {"a": "什麼都不想做，手不靈活了。", "r": "手沒以前靈活，心裡會不甘願吧。我們不用做大東西，像捲毛線球這種，你願意幫我嗎？"}, {"a": "做一個沙包，以前小時候都自己縫沙包，裡面放綠豆或米，丟來丟去玩。", "r": "縫沙包，好懷念。裡面放綠豆，丟起來沙沙響。那我們下次一起縫一個，阿嬤教我怎麼收口。"}], "more": "阿嬤覺得自己的手，這一輩子做最多的事是什麼？"}], "care": "手部退化、眼睛看不清楚的長輩，可能因為做不到以前的事而沮喪，不要硬要他示範，改成請他指導、你動手。家庭代工和工廠話題可能牽出貧窮、童工、職災的回憶，先肯定辛苦與貢獻。使用針、剪刀時居服員要全程看著，結束後收好。", "next": "一起捲毛線球、摺衣服、整理針線盒，或請長輩看著你把扣子縫好當他的徒弟。"}, {"id": "now-05", "cat": "當下生活與興趣", "title": "你的拿手好戲", "sub": "下棋、牌、唱歌、跳舞、釣魚和報紙", "lv": 2, "opener": "伯伯，我最近在學下象棋，每次都被我兒子吃到只剩一個帥，好丟臉。你會下象棋嗎？", "props": "一副象棋或幾顆棋子讓長輩摸；一副四色牌或撲克牌；一份今天的報紙（字大的版面）；播〈綠島小夜曲〉、〈思慕的人〉或長輩喜歡的歌；一張釣竿或公園打太極的照片", "know": ["象棋中間有「楚河漢界」，紅方是帥、仕、相、車、馬、炮、兵，黑方是將、士、象、車、馬、包、卒，廟口、公園常有人下棋，旁邊圍一圈看的人。", "四色牌有紅、黃、綠、白四種顏色，牌面是象棋的字，閩南和客家長輩很多人會玩，常在過年或親友聚會時玩。", "台灣麻將是 16 張的打法，跟日本、香港的 13 張不同；過年打麻將是很多家庭的傳統。", "1950、60 年代報紙有中央日報、聯合報、徵信新聞（後來的中國時報）等，以前很多人家裡訂一份報，從頭看到尾。", "1980 年代卡拉 OK 開始流行，更早有那卡西走唱；早上公園打太極拳、跳土風舞、練外丹功的長輩很多。"], "qs": [{"q": "伯伯，你比較喜歡下棋、打牌，還是唱歌？", "kind": "選擇", "ans": [{"a": "下棋啦，我年輕時在廟口下，沒人下得贏我。", "r": "哇，廟口棋王。那時候是不是很多人圍著看你下？"}, {"a": "都不喜歡，沒興趣。", "r": "好，那伯伯平常有空的時候，最喜歡做什麼事打發時間？"}, {"a": "唱歌，我很愛唱，以前參加過歌唱比賽，還得過獎，唱〈綠島小夜曲〉，台下拍手拍很久。", "r": "還得過獎，好厲害。〈綠島小夜曲〉好好聽，伯伯可以哼兩句給我聽嗎？"}], "more": "那時候是跟誰一起玩、一起唱？"}, {"q": "你摸摸看這顆棋子，是什麼字？", "kind": "感受", "ans": [{"a": "炮，這個要隔一個才能吃。", "r": "對，隔山打牛。伯伯一摸就知道規則，好厲害。你最喜歡用哪一顆棋子？"}, {"a": "看不清楚。", "r": "字小小的真的不好看，我拿近一點，這是紅色的炮。你摸摸看，木頭圓圓的。"}, {"a": "這是象棋啦，四色牌也是這些字，我們客家人過年都在玩四色牌，一玩就一整個晚上。", "r": "原來四色牌跟象棋是同樣的字，我第一次知道。伯伯可以教我四色牌怎麼玩嗎？"}], "more": "伯伯最常跟誰下棋或打牌？"}, {"q": "你以前早上會不會去公園運動？打太極、跳舞還是走路？", "kind": "回想", "ans": [{"a": "打太極，每天五點半就去，一群人跟著老師打，打完去吃豆漿燒餅。", "r": "打完太極去吃豆漿燒餅，聽起來好幸福。伯伯打太極打了幾年？"}, {"a": "沒有，我要上班，哪有時間。", "r": "以前為了工作很忙，真的沒時間。那放假的時候，伯伯喜歡做什麼？"}, {"a": "我太太愛跳土風舞，我在旁邊看，她跳得很漂亮。", "r": "伯伯在旁邊看太太跳舞，好甜蜜。她最喜歡跳哪一首？"}], "more": "伯伯可以比一個太極的動作給我看嗎？我跟著學。"}, {"q": "你有沒有去釣過魚？在哪裡釣？", "kind": "回想", "ans": [{"a": "有啊，假日騎腳踏車去溪邊釣，釣到吳郭魚就回家煮湯，有時候坐一整天都沒釣到。", "r": "坐一整天沒釣到也開心，釣魚好像是在享受等待。釣到大魚的時候是什麼心情？"}, {"a": "沒有，我怕水。", "r": "怕水就不要去，安全最重要。那伯伯喜歡吃魚嗎？最愛哪一種魚？"}, {"a": "釣魚很無聊，我不要。", "r": "要坐很久，對有些人真的很無聊。伯伯比較喜歡動來動去的活動嗎？"}], "more": "釣到的魚，家裡都怎麼煮？"}, {"q": "伯伯，你以前每天都看報紙嗎？看哪一份？最愛看哪一版？", "kind": "回想", "ans": [{"a": "每天早上一定要看，先看頭版，再看社會新聞，最後看副刊。", "r": "伯伯看報紙有一套順序，好有習慣。我們今天也來看一下，伯伯先看哪一版？"}, {"a": "我不識字。", "r": "沒關係，以前很多人沒機會讀書，是時代的關係。那我念給你聽，你想聽新聞還是聽天氣？"}, {"a": "看什麼報紙，現在都看電視，報紙字太小了。", "r": "對，字太小眼睛會累。那伯伯現在最喜歡看什麼節目？"}], "more": "伯伯印象中，報紙上哪一件大新聞讓你記得最清楚？"}, {"q": "你教我，下象棋要怎麼樣才不會一下就輸？", "kind": "請教", "ans": [{"a": "不要一直衝，要先顧好自己的帥，馬要早點跳出來，車不要隨便送人家吃。", "r": "先顧好自己，再慢慢出擊，我這次聽懂了。伯伯好會教，我下次回去試試看，再跟你報告。"}, {"a": "輸就輸，玩開心就好。", "r": "伯伯說得好，玩開心最重要。那我們等一下擺一盤，伯伯讓我幾顆好不好？"}, {"a": "我忘記怎麼下了，以前會，現在想不起來。", "r": "以前會，現在想不起來，心裡一定有點可惜吧。沒關係，我們不下整盤，一顆一顆摸、一顆一顆認，慢慢來就好。"}], "more": "伯伯覺得下棋跟做人有沒有什麼相像的地方？"}], "care": "長輩可能因為體力、視力或記憶退化，不能再做以前的嗜好而失落，不要說「你以前不是很厲害嗎」，改用一起摸、一起聽的方式重溫。麻將、四色牌可能牽涉到家人對賭博的爭執，聊玩法和熱鬧就好，不評價。不識字的長輩要特別保護自尊，自然地改成念給他聽。", "next": "一起擺一盤簡單的象棋、打一輪撿紅點，或播一首長輩愛的歌一起打拍子。"}, {"id": "now-06", "cat": "當下生活與興趣", "title": "老厝邊老朋友", "sub": "以前的鄰居、廟口和好朋友", "lv": 2, "opener": "阿姨，我今天出門遇到隔壁的阿婆，她塞了兩顆芭樂給我，說她兒子種的。你以前的鄰居也會這樣互相送東西嗎？", "props": "長輩家中的老照片（合照、畢業照）；一張廟口大榕樹或巷弄的照片；兩顆芭樂或柑仔；播〈四季紅〉、〈港都夜雨〉或〈月亮代表我的心〉", "know": ["以前鄉下常是同姓聚落住在三合院，一整個庄頭都是親戚；城市則是巷弄平房、長條街屋，門一開就是鄰居。", "1949 年前後來台的軍人與眷屬，很多住在眷村，眷村裡鄰居來自大陸各省，伯伯阿姨們互稱張媽媽、李伯伯，常一起包餃子、做饅頭。", "廟口和大榕樹下是以前的聊天中心，大人下棋泡茶、小孩玩耍，廟會、謝平安、辦桌時全庄的人都會來幫忙。", "早年家裡有電話的不多，1970 年代以後才慢慢普及，以前有事要寫信、託人帶話，或去有電話的人家借打。", "台灣有「遠親不如近鄰」的說法，以前跟鄰居借醬油、借米、幫忙看小孩都很平常。"], "qs": [{"q": "阿姨，你以前住的地方，鄰居多不多？", "kind": "是非", "ans": [{"a": "多啊，一條巷子十幾戶，門都不用關，誰家煮什麼都聞得到。", "r": "門都不用關，好有人情味。誰家煮什麼都聞得到，那阿姨最想念哪一家的味道？"}, {"a": "不記得了。", "r": "沒關係。那我們想想看，以前家門口出去，看到的是田、是馬路，還是別人家的房子？"}, {"a": "很少，我們住山上，最近的鄰居要走二十分鐘。", "r": "要走二十分鐘才有鄰居，那小時候都跟誰玩？兄弟姊妹嗎？"}], "more": "那時候鄰居之間，都會互相幫忙什麼事？"}, {"q": "以前你們會跟鄰居借東西嗎？借什麼？", "kind": "回想", "ans": [{"a": "借醬油、借米、借雞蛋，煮到一半沒了就叫孩子去隔壁借，下次再還，有時候還多還一點。", "r": "煮到一半叫孩子去隔壁借，好溫暖的畫面。多還一點，是那時候做人的禮數吧。"}, {"a": "沒有，我們不喜歡麻煩別人。", "r": "阿姨很有骨氣，不想麻煩別人。那如果鄰居來跟你借，你會借嗎？"}, {"a": "我們眷村裡誰家包餃子，整排都分到，張媽媽的麵食最好吃，我到現在都還記得那個味道。", "r": "整排都分到餃子，好像一個大家庭。張媽媽的麵食那麼好吃，她是哪裡人？"}], "more": "印象最深的一個鄰居，是什麼樣的人？"}, {"q": "以前廟口或大樹下，是不是很多人在那邊聊天？", "kind": "回想", "ans": [{"a": "對，傍晚吃飽飯大家都拿板凳出去，男人下棋泡茶，女人講東講西，小孩跑來跑去，很熱鬧。", "r": "吃飽飯拿板凳出去，好熱鬧。阿姨那時候是講東講西的那一群，還是跑來跑去的小孩？"}, {"a": "我沒去，女孩子不能亂跑。", "r": "以前女孩子規矩比較多，不能隨便出去。那阿姨在家裡的時候，都跟誰說話？"}, {"a": "廟會的時候最熱鬧，有布袋戲、歌仔戲，還有辦桌，全庄的人都來。", "r": "有布袋戲、歌仔戲還有辦桌，好熱鬧。阿姨最喜歡看哪一種戲？"}], "more": "那時候大家最常聊什麼話題？"}, {"q": "你這輩子最好的朋友是誰？你們怎麼認識的？", "kind": "回想", "ans": [{"a": "阿春啦，我們一起在工廠做工，下班一起去吃冰，結婚的時候還互相當伴娘。", "r": "一起做工、吃冰，還互相當伴娘，真的是好姊妹。阿春是什麼個性的人？"}, {"a": "沒有什麼好朋友。", "r": "沒有特別的好朋友也很正常，以前忙著做事養家。那有沒有一個人，是你遇到困難會想去找的？"}, {"a": "我最好的朋友已經走了，前幾年走的。", "r": "好朋友走了，一定很捨不得。謝謝你願意跟我說。她是一個怎麼樣的人？你們一起做過什麼開心的事？"}], "more": "如果現在可以跟那位朋友說一句話，阿姨想說什麼？"}, {"q": "以前沒有手機，你們要找朋友都怎麼聯絡？", "kind": "開放", "ans": [{"a": "寫信啊，或是直接走去他家，在門口喊名字。", "r": "在門口喊名字，好直接又好親切。阿姨寫過信嗎？寫給誰？"}, {"a": "不知道，都忘了。", "r": "沒關係。那阿姨猜猜看，是走路去找，還是用電話？兩個選一個。"}, {"a": "我們庄裡只有一戶有電話，要打電話都去他家借，打長途的很貴，要講快一點。", "r": "整庄只有一戶有電話，好珍貴。打長途電話還要講快一點，那時候都打給誰？"}], "more": "收到朋友的信，或接到朋友電話的時候，是什麼心情？"}, {"q": "以前的老朋友、老鄰居，現在還有聯絡嗎？", "kind": "感受", "ans": [{"a": "有啊，阿雪還會打電話來，我們一講就半個鐘頭，兒子都說我們好吵。", "r": "老朋友一講就半個鐘頭，真好。你們都聊些什麼？下次她打來，阿姨要不要跟她說今天聊到她？"}, {"a": "沒有了，搬家以後就斷了。", "r": "搬家以後就斷了聯絡，有點可惜吧。阿姨心裡最想念的是哪一位？"}, {"a": "都死光了，剩我一個，活這麼久做什麼。", "r": "朋友一個一個走了，剩自己一個，那種孤單一定很難受。謝謝你跟我說。我在這裡陪你，你想說說他們嗎？"}], "more": "阿姨想不想看看以前的照片？我們一起找找看有沒有老朋友。"}], "care": "老朋友、老鄰居過世或失聯，是長輩很深的失落，常帶出「只剩我一個」的孤單；先接住情緒、讓他說說那個人，不要急著轉移話題或說「你還有孩子啊」。若長輩表達不想活、強烈孤單，要記錄並回報督導與家屬。眷村、遷移、被迫搬家的經驗也可能有傷痛，順著長輩願意說的程度聊。", "next": "一起翻老照片說說照片裡的人，或在家屬同意下幫長輩打一通電話給還有聯絡的老朋友。"}];
const GUIDE = {"skills": [{"t": "先坐下來，再開口", "d": "坐在長輩側邊、眼睛高度一樣，距離一個手臂。站著說話像在問案，坐下來才像聊天。", "eg": "「阿嬤，我坐這邊陪你一下好不好？」"}, {"t": "從眼前的東西開始", "d": "桌上的照片、電視在演的、窗外的天氣、今天的飯菜，都是最好的開頭。看得到、摸得到的東西，失智長輩也接得上。", "eg": "「這張照片是你年輕的時候嗎？穿這件好體面。」"}, {"t": "先分享自己一點點", "d": "直接發問像考試。先說一句自己的經驗，長輩比較願意接話。", "eg": "「我媽媽以前都用灶煮飯，你們家也是嗎？」"}, {"t": "開放題與選擇題交替用", "d": "記憶好的長輩用開放題（怎麼、什麼、為什麼）讓他多說；記憶差或累了就改成二選一或是非題，答得出來才有成就感。", "eg": "開放：「過年你們都怎麼準備？」選擇：「過年是吃雞比較多，還是吃魚？」"}, {"t": "請長輩當老師", "d": "「請你教我」是最好用的一句話。長輩從被照顧的人變成有本事的人，說話會有精神。", "eg": "「阿伯，菜脯要怎麼曬才不會酸？你教我，我回去試。」"}, {"t": "接話三招：重述、肯定、問感受", "d": "重述他說的關鍵字，讓他知道你有在聽；肯定他的努力；再問當時的感受，話題就會往深處走。", "eg": "「十二歲就去工廠做工（重述），你好能吃苦（肯定），那時候會想家嗎？（感受）」"}, {"t": "不考試、不糾正", "d": "長輩記錯年份、人名、把你當成別人，都不用糾正。聊天的目的是心情，不是事實正確。答不出來時說「沒關係，我們聊別的」。", "eg": "長輩：「我兒子昨天才來。」（其實上個月）你：「兒子來看你，你一定很高興。」"}, {"t": "慢一點、短一點、停一下", "d": "一次只問一件事，句子短一點，問完等 5 到 10 秒。沉默不是冷場，是長輩在想。", "eg": "「你小時候住哪裡？」（等）「是在鄉下還是在街上？」"}, {"t": "用長輩的語言", "d": "會說台語、客語就用，不會也可以學幾個詞請長輩教你。稱呼用他習慣的（阿公、伯伯、老師、頭家娘），不要叫「爺爺奶奶」叫到不像他家人。", "eg": "「阿嬤，這個台語要怎麼說？你教我。」"}, {"t": "看臉色換話題", "d": "長輩皺眉、別過頭、話變少、一直重複「沒有啦」，就是該換話題或休息了。轉到當下：「我們來喝口水」「外面出太陽了」。", "eg": "「這個我們下次再聊，先來看看窗外的花。」"}, {"t": "每次聊完記一筆", "d": "記下長輩喜歡聊什麼、哪個話題他眼睛會亮、哪個話題要避開。下次一來就能接上，也可以交接給其他居服員。", "eg": "記錄：「喜歡聊在紡織廠當領班，提到大兒子會難過，避開。」"}, {"t": "聊天也能動身體動腦", "d": "聊包粽子就比一下綁繩的手勢，聊唱歌就一起打拍子，聊算盤就請他算一題。說話加上動作，就是很好的認知與手部活動。", "eg": "「你綁粽子的手勢比給我看，是這樣繞兩圈嗎？」"}], "hard": [{"t": "「活著沒意思」「我想死了算了」", "g": "情緒", "s": "不要說「別亂講」或急著勸。先接住感受，再溫和確認。這是一定要回報的話。", "say": ["「聽起來你最近很辛苦，心裡很累。」", "「你說想死，是有想過要怎麼做嗎？」（溫和直接問不會讓人更想做）", "「我很在意你，這件事我想讓督導和你的家人一起來幫忙。」"], "do": "當天回報督導或個管；有具體計畫、藥物或工具在身邊，立即通知家屬並撥 1925 安心專線或 119。不要答應幫他保密。"}, {"t": "「我兒子（女兒）都不來看我」", "g": "家庭", "s": "不要幫家人解釋，也不要一起罵。先接住想念。", "say": ["「你很想他們齁。」", "「上次他們來的時候，你們聊了什麼？」", "「要不要我們一起想一下，下次打電話想跟他說什麼？」"], "do": "把長輩的想念記錄下來，回報個管，可以作為家庭溝通的參考。"}, {"t": "「我的錢（東西）被偷了」", "g": "失智", "s": "失智長輩常見的被偷妄想。不要否認、不要說「你自己放的」，那會讓他覺得你也站在偷的那邊。", "say": ["「東西不見一定很著急，我陪你一起找。」", "「你平常都會收在哪裡？我們先找那邊。」", "找到後：「找到了，真好，放這邊很安全。」"], "do": "不要自己單獨在房間翻找、不碰錢財；記錄並回報督導，必要時請家屬在場。"}, {"t": "「我要回家」（其實就在家）", "g": "失智", "s": "他要回的常是「心裡那個家」，可能是小時候的家或有媽媽在的地方。順著問，比解釋有用。", "say": ["「你想回家，家裡有誰在等你？」", "「你家是什麼樣子？門口有什麼？」", "「我們先喝杯茶，等一下再一起準備。」"], "do": "黃昏時段最常出現，可以安排開燈、喝茶、看老照片。注意門口安全，避免自行外出。"}, {"t": "同一件事一直重複講", "g": "失智", "s": "每一次都當第一次聽。他重複，表示這件事對他很重要。", "say": ["「這件事你一定很難忘。」", "「那時候你幾歲？」（從同一件事挖新的細節）", "「後來呢？」"], "do": "把他常講的故事記下來，下次可以主動提起，變成你們的固定話題。"}, {"t": "一直問同一個問題（今天幾號、我吃飯了沒）", "g": "失智", "s": "每次都耐心回答，口氣一樣溫和。可以用寫的、看得到的方式幫他。", "say": ["「今天是星期三，我們剛剛吃過午餐，吃的是魚和青菜。」", "「我寫在白板上，你想知道就看這裡。」"], "do": "在明顯位置放大字月曆、白板或餐點紀錄。"}, {"t": "「你是誰？」「你是我女兒嗎？」", "g": "失智", "s": "簡短自我介紹，不用解釋他記錯了。他把你當成親人，往往是因為感覺安心。", "say": ["「我是阿芳，來陪你聊天、幫你洗澡的。」", "「你女兒對你很好齁，她是什麼個性？」"], "do": "每次見面先自我介紹，不要問「你記得我是誰嗎？」。"}, {"t": "抱怨另一位家人或照顧者", "g": "家庭", "s": "只聽不評、不傳話。你是陪伴者，不是法官。", "say": ["「聽起來這件事讓你很不舒服。」", "「你希望他怎麼做會比較好？」"], "do": "有疑似疏忽、虐待、財務剝削的具體描述（沒飯吃、被打、錢被拿走），要記錄原話並回報督導，依法可能需要通報 113。"}, {"t": "說到過世的人就哭了", "g": "情緒", "s": "哭不是壞事，不用急著讓他停。陪著、遞衛生紙，讓他知道可以難過。", "say": ["「你很想他。」（停一下，安靜陪著）", "「他是什麼樣的人？」", "「你們一起最開心的是什麼時候？」"], "do": "聊完可以轉到溫暖的回憶或當下的事。若長期情緒低落、吃不下睡不著，回報個管。"}, {"t": "「說這個做什麼」「沒什麼好聊的」", "g": "拒絕", "s": "不要硬聊。換成做事、看東西或安靜陪伴，聊天自然會出來。", "say": ["「好，那我陪你坐一下。」", "「我幫你按按手好不好？」", "「電視在演什麼？我們一起看。」"], "do": "記下他當天狀況，可能是身體不舒服、睡不好或心情差，下次換時間或話題。"}, {"t": "說的話聽不懂或答非所問", "g": "溝通", "s": "抓他話裡的情緒或關鍵字回應就好，不用逼他說清楚。", "say": ["「你說到媽媽，你很想她嗎？」", "「你看起來很開心，有什麼好事？」"], "do": "中風、失語的長輩可以改用圖卡、是非題、點頭搖頭、比手勢。"}, {"t": "聽力不好，一直說「啊？」", "g": "溝通", "s": "坐在他比較好的那一側，臉對著他，放慢、降低音調，不是大吼。", "say": ["換句話說，不要同一句重複大聲說。", "「你-小時候-住-哪裡？」配合手勢與寫字。"], "do": "確認助聽器有沒有戴、有沒有電；周圍的電視先關小聲。"}, {"t": "談政治、宗教、族群爭議", "g": "敏感", "s": "不爭辯、不表態，回到他個人的經驗。", "say": ["「那個年代你自己是怎麼過的？」", "「你那時候在做什麼工作？」"], "do": "戰爭、二二八、白色恐怖、逃難等經驗可能是創傷，長輩主動說就安靜聽，不追問細節。"}, {"t": "說身體哪裡痛、不舒服", "g": "身體", "s": "聊天中提到疼痛、跌倒、胸悶、吃不下，不能只當話題。", "say": ["「哪裡痛？痛多久了？比給我看。」", "「這個我記下來，跟你家人和督導說。」"], "do": "不給藥、不給醫療建議。胸痛、呼吸喘、突然說話不清楚或單側無力，立即撥 119 並通知家屬。"}, {"t": "一直要你幫忙做服務以外的事", "g": "界線", "s": "溫和說明，並把需求轉成可以做的事。", "say": ["「這個我不能幫你做，不過我可以幫你記下來，跟你女兒說。」", "「我們先把今天的事情做完，再陪你聊。」"], "do": "不收禮、不借錢、不代為處理金錢，依單位規定回報。"}, {"t": "性方面的言語或碰觸", "g": "界線", "s": "失智或額顳葉退化可能讓長輩失去分寸，但你可以清楚拒絕。", "say": ["「伯伯，這樣我不舒服，請你不要。」", "轉移注意：「我們來喝水、看電視。」"], "do": "保持距離、必要時暫停服務離開現場；每次都要回報督導，你不需要自己承受。"}]};
const LV = {1:"中重度也可",2:"輕度失智可",3:"記憶較好"};
const CATS = [...new Set(TOPICS.map(t=>t.cat))];
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let st = {tab:"topics", cat:"全部", lv:0, q:"", open:null};
let favs = store.get("chatdb-fav",[]);

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function setFs(v){document.documentElement.style.setProperty("--fs",v);document.querySelectorAll("[data-fs]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.fs==v));store.set("chatdb-fs",v)}
document.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>setFs(b.dataset.fs));
setFs(store.get("chatdb-fs","1"));

const nQ = TOPICS.reduce((a,t)=>a+t.qs.length,0), nA = TOPICS.reduce((a,t)=>a+t.qs.reduce((b,q)=>b+q.ans.length,0),0);
$("#stats").innerHTML = `<span><b>${TOPICS.length}</b> 個主題</span><span><b>${nQ}</b> 個提問</span><span><b>${nA}</b> 組回答與接話</span><span><b>${GUIDE.skills.length}</b> 個技巧</span><span><b>${GUIDE.hard.length}</b> 種難接的話</span>`;

function textOf(t){return [t.title,t.sub,t.cat,t.opener,t.props,t.care,t.next,...t.know,...t.qs.flatMap(q=>[q.q,q.more,...q.ans.flatMap(a=>[a.a,a.r])])].join(" ")}
TOPICS.forEach(t=>t._txt=textOf(t));
function matchQ(t,q){return t.qs.filter(x=>[x.q,x.more,...x.ans.flatMap(a=>[a.a,a.r])].join(" ").includes(q)).length}

function tabs(){document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab==st.tab))}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;st.open=null;render();window.scrollTo(0,0)});

function card(t){
  const hits = st.q ? matchQ(t,st.q) : 0;
  return `<button class="card" data-open="${t.id}">
    <span class="cat">${esc(t.cat)}</span><h3>${favs.includes(t.id)?'<span class="star" aria-label="已收藏">★</span> ':""}${esc(t.title)}</h3><p>${esc(t.sub)}</p>
    <span class="meta"><span class="lv l${t.lv}">${LV[t.lv]}</span><span>${t.qs.length} 個提問</span>${hits?`<span class="hit">${hits} 題符合</span>`:""}</span></button>`;
}
function topicsView(){
  let list = TOPICS.filter(t=>(st.cat=="全部"||t.cat==st.cat)&&(!st.lv||t.lv<=st.lv)&&(!st.q||t._txt.includes(st.q)));
  const catBtns = ["全部",...CATS].map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${st.cat==c}">${c}<small>${c=="全部"?TOPICS.length:TOPICS.filter(t=>t.cat==c).length}</small></button>`).join("");
  const lvBtns = [[0,"不限"],[1,"中重度失智也能聊"],[2,"輕度失智可聊"]].map(([v,l])=>`<button class="chip" data-lv="${v}" aria-pressed="${st.lv==v}">${l}</button>`).join("");
  return `<div class="tools">
    <div class="searchrow"><input id="q" type="search" placeholder="搜尋：例如 粽子、紡織廠、鄧麗君、不記得" value="${esc(st.q)}" aria-label="搜尋主題與提問"><button class="btn" id="rand">今天聊什麼</button></div>
    <div class="chips">${catBtns}</div>

  </div>
  <div class="grid">${list.map(card).join("")||""}</div>${list.length?"":'<p class="empty">找不到符合的主題，換個關鍵字試試。</p>'}`;
}
function hl(s){s=esc(s);if(!st.q)return s;const q=esc(st.q);return s.split(q).join(`<mark>${q}</mark>`)}
function detailView(t){
  const isFav = favs.includes(t.id);
  const qs = t.qs.map((q,i)=>{
    const open = !!(st.q && [q.q,q.more,...q.ans.flatMap(a=>[a.a,a.r])].join(" ").includes(st.q)) || i==0;
    return `<div class="q" data-open="${open}">
      <button data-q aria-expanded="${open}"><span class="n">${i+1}</span><span class="qt">${hl(q.q)}</span><span class="kind">${esc(q.kind)}</span><span class="chev" aria-hidden="true">▾</span></button>
      <div class="qbody" ${open?"":"hidden"}>
        ${q.ans.map(a=>`<div class="pair"><div class="bub e"><small>長輩可能說</small>${hl(a.a)}</div><div class="bub c"><small>你可以這樣接</small>${hl(a.r)}</div></div>`).join("")}
        ${q.more?`<div class="more"><b>聊得起來再問：</b>${hl(q.more)}</div>`:""}
      </div></div>`}).join("");
  return `<button class="back" id="back">← 回到主題列表</button>
  <div class="dhead"><div><span class="lv l${t.lv}">${LV[t.lv]}</span>　<span style="color:var(--teal);font-size:.9rem">${esc(t.cat)}</span><h2>${esc(t.title)}</h2><p class="sub">${esc(t.sub)}</p></div>
    <div class="dact"><button class="btn ghost" id="fav">${isFav?"★ 已收藏":"☆ 收藏"}</button><button class="btn ghost" id="copy">複製文字版</button></div></div>
  <div class="detail">
    <section>
      <div class="opener"><span class="lab">開場白</span>${hl(t.opener)}</div>
      <div class="expand"><button class="chip" id="all-open">全部展開</button><button class="chip" id="all-close">全部收合</button></div>
      <div class="qlist">${qs}</div>
    </section>
    <aside class="side">
      <div class="box props"><h3>可以準備</h3><p>${hl(t.props)}</p></div>
      <div class="box"><h3>背景小知識</h3><ul>${t.know.map(k=>`<li>${hl(k)}</li>`).join("")}</ul></div>
      <div class="box care"><h3>注意事項</h3><p>${hl(t.care)}</p></div>
      <div class="box"><h3>延伸活動</h3><p>${hl(t.next)}</p></div>
    </aside>
  </div>`;
}
function plainText(t){
  return `【${t.title}】${t.sub}\n開場白：${t.opener}\n可以準備：${t.props}\n\n背景小知識\n${t.know.map(k=>"・"+k).join("\n")}\n\n`+
    t.qs.map((q,i)=>`${i+1}. ${q.q}\n`+q.ans.map(a=>`　長輩：${a.a}\n　接話：${a.r}`).join("\n")+(q.more?`\n　再問：${q.more}`:"")).join("\n\n")+
    `\n\n注意事項：${t.care}\n延伸活動：${t.next}\n（居家陪伴聊天庫）`;
}
function skillsView(){
  return `<h2 class="sec-h">聊天技巧</h2><p class="sec-p">聊天不是問答比賽。目的是讓長輩覺得有人在聽、自己還有本事。這 ${GUIDE.skills.length} 個技巧，每次陪伴都用得到。</p>
  <div class="skills">${GUIDE.skills.map(s=>`<div class="skill"><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p><div class="eg">${esc(s.eg)}</div></div>`).join("")}</div>
  <h2 class="sec-h" style="margin-top:32px">每次聊完記一筆</h2><p class="sec-p">記下來的內容只存在這台裝置的瀏覽器裡，不會上傳。請不要寫長輩的全名、身分證、住址。</p>
  <div class="box recbox"><textarea id="rec" placeholder="例：喜歡聊年輕時在紡織廠當領班，說到女兒會笑；提到過世的先生會難過，先陪著。下次可以帶包粽子的照片。">${esc(store.get("chatdb-rec",""))}</textarea></div>`;
}
function hardView(){
  const gs=[...new Set(GUIDE.hard.map(h=>h.g))];
  return `<h2 class="sec-h">難接的話</h2><p class="sec-p">長輩說出讓人不知道怎麼回的話時，先接住情緒，不爭辯、不否定。紅色框是要記錄或回報的情況。</p>
  <div class="chips" style="margin-bottom:14px">${["全部",...gs].map(g=>`<button class="chip" data-hg="${g}" aria-pressed="${(st.hg||"全部")==g}">${g}</button>`).join("")}</div>
  <div class="hard">${GUIDE.hard.filter(h=>!st.hg||st.hg=="全部"||h.g==st.hg).map(h=>`<div class="hcard"><div class="top"><span class="tag">${esc(h.g)}</span><h3>${esc(h.t)}</h3></div><p style="margin:0">${esc(h.s)}</p>
    <div class="say">${h.say.map(s=>`<div class="bub c"><small>可以這樣說</small>${esc(s)}</div>`).join("")}</div>
    <div class="do"><b>要做的事：</b>${esc(h.do)}</div></div>`).join("")}</div>
  <p class="note">緊急或需要協助：安心專線 1925（24 小時）、保護專線 113、緊急醫療 119。所有疑慮都可以先回報你的督導或個案管理員。</p>`;
}
function mineView(){
  const list=TOPICS.filter(t=>favs.includes(t.id));
  return `<h2 class="sec-h">我的收藏</h2><p class="sec-p">在主題頁按「收藏」，常用的主題就會放在這裡。收藏只存在這台裝置。</p>
  <div class="grid">${list.map(card).join("")}</div>${list.length?"":'<p class="empty">還沒有收藏。到「聊天主題」挑一個長輩會喜歡的主題，按 ☆ 收藏。</p>'}`;
}
function render(){
  tabs();
  const m=$("#main");
  if(st.open){const t=TOPICS.find(x=>x.id==st.open);m.innerHTML=detailView(t);bindDetail(t);return}
  m.innerHTML = st.tab=="topics"?topicsView():st.tab=="skills"?skillsView():st.tab=="hard"?hardView():mineView();
  m.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{st.open=b.dataset.open;render();window.scrollTo(0,0)});
  m.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{st.cat=b.dataset.cat;render()});
  m.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{st.lv=+b.dataset.lv;render()});
  m.querySelectorAll("[data-hg]").forEach(b=>b.onclick=()=>{st.hg=b.dataset.hg;render()});
  const q=$("#q"); if(q){q.oninput=()=>{st.q=q.value.trim();const p=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
  const r=$("#rand"); if(r) r.onclick=()=>{const pool=TOPICS.filter(t=>(st.cat=="全部"||t.cat==st.cat)&&(!st.lv||t.lv<=st.lv));st.open=pool[Math.floor(Math.random()*pool.length)].id;render();window.scrollTo(0,0)};
  const rec=$("#rec"); if(rec) rec.oninput=()=>store.set("chatdb-rec",rec.value);
}
function setQ(el,open){el.dataset.open=open;el.querySelector("[data-q]").setAttribute("aria-expanded",open);el.querySelector(".qbody").hidden=!open}
function bindDetail(t){
  $("#back").onclick=()=>{st.open=null;render()};
  document.querySelectorAll(".q").forEach(el=>el.querySelector("[data-q]").onclick=()=>setQ(el,el.dataset.open!="true"));
  $("#all-open").onclick=()=>document.querySelectorAll(".q").forEach(el=>setQ(el,true));
  $("#all-close").onclick=()=>document.querySelectorAll(".q").forEach(el=>setQ(el,false));
  $("#fav").onclick=()=>{favs=favs.includes(t.id)?favs.filter(x=>x!=t.id):[...favs,t.id];store.set("chatdb-fav",favs);render();toast(favs.includes(t.id)?"已加入收藏":"已取消收藏")};
  $("#copy").onclick=()=>{const s=plainText(t);navigator.clipboard.writeText(s).then(()=>toast("已複製，可以貼到 LINE 或記事本"),()=>{const ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("已複製")}catch(e){toast("請手動選取複製")}ta.remove()})};
}
const h=location.hash.slice(1);
if(TOPICS.some(t=>t.id==h)) st.open=h; else if(["skills","hard","mine"].includes(h)) st.tab=h;
render();
</script>

<script src="https://mattsue1003.github.io/oth-report-button/report.js" data-site="居家陪伴聊天庫" defer></script>
</body></html>
