<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="給居家服務員的聊天教案：36 個主題、216 個提問，附長輩可能的回答與接話方式。">
<title>居家陪伴聊天庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：左側長輩對話泡泡、右側居服員回應泡泡，像一本攤開的聊天手帖；上方分頁＋篩選，下方主題卡格 */
:root{
  --bg:#F2F5F3; --paper:#FFFFFF; --ink:#1E3236; --muted:#5B6E70; --line:#D6E0DD;
  --teal:#027A86; --teal-soft:#DDF0F0; --amber:#C9761A; --amber-soft:#FCEBD3;
  --elder:#F6EFE2; --care:#E2F2EF; --warn:#B4442C; --warn-soft:#FBE4DD;
  --f-display:"LXGW WenKai TC","Kaiti TC","BiauKai",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --fs:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13201F; --paper:#1B2B2A; --ink:#E4EEEC; --muted:#9DB1AF; --line:#2E4341;
  --teal:#4FC3C9; --teal-soft:#16393A; --amber:#F0A957; --amber-soft:#3A2A15;
  --elder:#2C2A22; --care:#18362F; --warn:#F08E76; --warn-soft:#3B201A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13201F; --paper:#1B2B2A; --ink:#E4EEEC; --muted:#9DB1AF; --line:#2E4341;
  --teal:#4FC3C9; --teal-soft:#16393A; --amber:#F0A957; --amber-soft:#3A2A15;
  --elder:#2C2A22; --care:#18362F; --warn:#F08E76; --warn-soft:#3B201A; color-scheme:dark}
html{font-size:calc(16px * var(--fs))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.75}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* header */
header{padding-block:28px 8px}
.brand{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-size:2.3rem;font-weight:700;color:var(--teal)}
.lead{margin:6px 0 0;color:var(--muted);max-width:44em}
.fsbar{display:flex;gap:4px;align-items:center;font-size:.9rem;color:var(--muted)}
.fsbar button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:2px 10px}
.fsbar button[aria-pressed="true"]{background:var(--teal);color:var(--paper);border-color:var(--teal)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:.95rem;color:var(--muted)}
.stats b{font-family:var(--f-display);font-size:1.35rem;color:var(--ink);font-variant-numeric:tabular-nums}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabrow button{border:0;background:none;padding:12px 16px;font-size:1.05rem;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabrow button[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}
main{padding-block:20px 60px}

/* filters */
.tools{display:grid;gap:12px;margin-bottom:18px}
.searchrow{display:flex;gap:10px;flex-wrap:wrap}
.searchrow input{flex:1 1 260px;min-width:0;font:inherit;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.btn{border:1.5px solid var(--teal);background:var(--teal);color:var(--paper);border-radius:12px;padding:9px 16px;font-weight:500}
.btn.ghost{background:var(--paper);color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 13px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:3px;font-variant-numeric:tabular-nums}
.lvlabel{font-size:.9rem;color:var(--muted);align-self:center;margin-right:2px}

/* topic grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:6px;align-content:start;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--teal)}
.card .cat{font-size:.82rem;letter-spacing:.06em;color:var(--teal)}
.card h3{font-size:1.35rem}
.card p{margin:0;color:var(--muted);font-size:.97rem;line-height:1.6}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:.85rem;color:var(--muted)}
.lv{display:inline-flex;gap:2px;align-items:center;border-radius:6px;padding:0 7px;font-size:.82rem;background:var(--teal-soft);color:var(--teal)}
.lv.l2{background:var(--amber-soft);color:var(--amber)}
.lv.l3{background:var(--warn-soft);color:var(--warn)}
.hit{background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:0 7px}
.star{color:var(--amber)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* topic detail */
.back{border:0;background:none;color:var(--teal);font-weight:500;padding:4px 0;margin-bottom:8px}
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h2{font-size:2rem}
.dhead .sub{color:var(--muted);margin:4px 0 0}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:18px;align-items:start}
@media (max-width:860px){.detail{grid-template-columns:minmax(0,1fr)}}
.opener{background:var(--care);border-radius:18px 18px 18px 4px;padding:14px 18px;font-family:var(--f-display);font-size:1.3rem;line-height:1.6}
.opener .lab{display:block;font-family:var(--f-body);font-size:.82rem;letter-spacing:.06em;color:var(--teal);margin-bottom:2px}
.qlist{display:grid;gap:12px;margin-top:18px;counter-reset:q}
.q{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.q>button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:14px 16px}
.q .n{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--teal);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:.95rem;margin-top:2px}
.q .qt{flex:1;min-width:0;font-family:var(--f-display);font-size:1.25rem;line-height:1.55}
.q .kind{flex:none;font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);margin-top:6px}
.q .chev{flex:none;margin-top:6px;transition:transform .2s;color:var(--muted)}
.q[data-open="true"] .chev{transform:rotate(180deg)}
.qbody{padding:0 16px 16px 60px;display:grid;gap:14px}
@media (max-width:520px){.qbody{padding-left:16px}}
.pair{display:grid;gap:6px}
.bub{max-width:88%;padding:10px 14px;line-height:1.65}
.bub small{display:block;font-size:.78rem;letter-spacing:.05em;opacity:.75}
.bub.e{background:var(--elder);border-radius:16px 16px 16px 4px;justify-self:start}
.bub.c{background:var(--care);border-radius:16px 16px 4px 16px;justify-self:end}
.more{font-size:.97rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.more b{color:var(--teal);font-weight:500}
aside.side{display:grid;gap:14px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.box h3{font-size:1.15rem;margin-bottom:6px}
.box ul{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.97rem;line-height:1.65}
.box p{margin:0;font-size:.97rem;line-height:1.7}
.box.care{background:var(--warn-soft);border-color:transparent}
.box.care h3{color:var(--warn)}
.box.props{background:var(--amber-soft);border-color:transparent}
.box.props h3{color:var(--amber)}
.expand{display:flex;gap:8px;margin-top:14px}

/* guide pages */
.sec-h{font-size:1.6rem;margin:4px 0 4px}
.sec-p{color:var(--muted);margin:0 0 18px;max-width:46em}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.skill{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:8px;align-content:start}
.skill h3{font-size:1.25rem;color:var(--teal)}
.skill p{margin:0}
.skill .eg{background:var(--care);border-radius:12px;padding:8px 12px;font-size:.97rem}
.hard{display:grid;gap:12px}
.hcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.hcard .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hcard h3{font-size:1.3rem}
.tag{font-size:.8rem;border-radius:6px;padding:0 7px;background:var(--teal-soft);color:var(--teal)}
.hcard .say{display:grid;gap:6px}
.hcard .do{background:var(--warn-soft);border-radius:12px;padding:8px 12px;font-size:.97rem}
.hcard .do b{color:var(--warn)}
.note{font-size:.92rem;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:.95rem}
.recbox textarea{width:100%;box-sizing:border-box;min-height:7em;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="wrap">
  <div class="brand">
    <div>
      <h1>居家陪伴聊天庫</h1>
      <p class="lead">給居家服務員的聊天教案。每個主題都有開場白、背景小知識、6 個提問，以及長輩可能怎麼回答、你可以怎麼接。</p>
    </div>
    <div class="fsbar" role="group" aria-label="字級"><span>字級</span>
      <button data-fs="1">中</button><button data-fs="1.15">大</button><button data-fs="1.3">特大</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<nav class="tabs"><div class="wrap tabrow" role="tablist">
  <button role="tab" data-tab="topics" aria-selected="true">聊天主題</button>
  <button role="tab" data-tab="skills" aria-selected="false">聊天技巧</button>
  <button role="tab" data-tab="hard" aria-selected="false">難接的話</button>
  <button role="tab" data-tab="mine" aria-selected="false">我的收藏</button>
</div></nav>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>
const TOPICS = [{"id": "kid-01", "cat": "童年與家鄉", "title": "小時候住的老厝", "sub": "聊房子、灶腳、門口埕與眷村", "lv": 1, "opener": "阿嬤，我小時候住在阿公家的三合院，門口有一大片曬穀的空地，我最愛在那邊跑來跑去。您小時候住的房子長什麼樣子？", "props": "一張三合院門口埕曬稻穀的老照片、一張眷村竹籬笆巷弄照片、一支竹掃把或一個竹籃讓長輩摸", "know": ["鄉下常見三合院（客家人多稱伙房），正中間是正身，供奉神明祖先的廳堂，兩邊廂房叫護龍，中間的空地就是門口埕，用來曬稻穀、曬菜脯、小孩玩耍。", "灶腳就是廚房，以前用磚砌的大灶，燒柴、稻草或粗糠（稻殼），上面放大鼎煮飯煮菜，灶旁常貼灶君。小孩常被叫去顧火、添柴。", "眷村是 1949 年前後隨政府來台的軍人與家眷住的村落，早期多是竹子糊泥土的屋子，外圍竹籬笆，房子小、家家相連，各省口味的菜都在一條巷子裡。", "城鎮裡常見街屋（店屋），前面是店面、後面住家，房子窄長，中間有天井透光，樓上住人。", "早期很多家庭沒有自來水和室內廁所，要到井邊或用手壓的抽水機打水，廁所多在屋外，晚上要拿煤油燈或手電筒。"], "qs": [{"q": "阿嬤，您小時候是住在鄉下，還是住在街上？", "kind": "選擇", "ans": [{"a": "鄉下啦，四周都是田，晚上青蛙叫到吵死人。", "r": "哇，青蛙叫一整晚，好有畫面。那時候晚上睡得著嗎？"}, {"a": "我住街仔，家裡在賣雜貨，前面店、後面住。", "r": "原來是街上的店家，您從小就在店裡長大，一定看過很多來來去去的客人。"}, {"a": "忘記了啦，那麼久以前。", "r": "沒關係，那麼久的事本來就不好記。我們先看看這張照片，像不像您以前看過的房子？"}], "more": "那附近有什麼您印象最深的東西？一棵樹、一條溪，還是一間廟？"}, {"q": "以前房子前面有沒有一大片空地，可以曬稻穀、讓小孩跑？", "kind": "是非", "ans": [{"a": "有啊，門口埕很大，收稻子的時候要一直翻穀，下雨就要趕快收，全家都跑出來。", "r": "一下雨全家衝出去收穀，聽起來好緊張又好團結。阿嬤那時候負責做什麼？"}, {"a": "沒有，我們住眷村，門口就是巷子，對面就是鄰居家。", "r": "眷村巷子一家連一家，那鄰居應該都很熟吧？誰家煮什麼都聞得到。"}, {"a": "嗯。", "r": "嗯，有啊。我拿竹掃把給您摸摸看，以前掃門口埕是不是用這種？"}], "more": "下大雨收穀的時候，誰最會指揮？"}, {"q": "以前家裡的灶腳是燒什麼煮飯？柴、稻草，還是粗糠？", "kind": "選擇", "ans": [{"a": "燒粗糠啦，還有撿來的樹枝。我小時候就要顧火，煙燻得眼睛都流眼淚。", "r": "那麼小就要顧火，眼睛被燻得好辛苦。您很會看火候吧，什麼時候要添柴都知道。"}, {"a": "我們家用煤球，一顆一顆有洞的那種，後來才用瓦斯。", "r": "對，蜂窩一樣的煤球，伯伯記得好清楚。那時候是誰去買煤球的？"}, {"a": "我又不用煮飯，是我媽在煮。", "r": "原來是媽媽在掌廚。那您記得媽媽在灶腳最常煮什麼嗎？"}], "more": "灶腳裡最香的味道是什麼？"}, {"q": "以前晚上沒有電燈的時候，家裡用什麼照明？", "kind": "回想", "ans": [{"a": "點番仔油燈（煤油燈）啊，燈罩每天要擦，不然會黑黑的，我常被叫去擦。", "r": "每天擦燈罩，這是很細心的工作耶。那盞燈都放在家裡哪裡？"}, {"a": "我們山上部落很晚才有電，晚上就是火堆，大家圍著聊天唱歌。", "r": "圍著火堆唱歌，好溫暖的畫面。阿姨還記得那時候唱什麼歌嗎？"}, {"a": "哪記得那麼多。", "r": "好，不記得也沒關係。那您比較喜歡現在亮亮的燈，還是以前暗暗的晚上？"}], "more": "晚上暗暗的時候，家裡都在做什麼？"}, {"q": "阿公，您小時候睡覺是睡床，還是睡通鋪、榻榻米？跟誰一起睡？", "kind": "開放", "ans": [{"a": "一張大眠床，兄弟四五個擠在一起，冬天很暖，夏天熱死了，還會被踢下去。", "r": "四五個擠一張床，被踢下去還要爬上來，哈哈。阿公那時候睡哪一邊？"}, {"a": "日本時代留下來的宿舍，睡榻榻米，早上要把棉被收進壁櫥。", "r": "睡榻榻米、收棉被，生活很有規矩。那棟宿舍是爸爸工作的地方配的嗎？"}, {"a": "我在越南的老家是睡吊床，跟這裡不一樣。", "r": "吊床耶，搖來搖去一定很好睡。阿嬤可以跟我說說越南老家的房子長怎樣嗎？"}], "more": "冬天冷的時候，有什麼取暖的辦法？"}, {"q": "如果現在可以回到小時候的家看一眼，您最想去哪個角落？", "kind": "感受", "ans": [{"a": "我想去後面的井邊，我媽都在那裡洗衣服，一邊洗一邊跟我講話。", "r": "井邊有媽媽的聲音，那是很重要的地方。媽媽洗衣服的時候都跟您聊什麼？"}, {"a": "老家在大陸，回不去了，房子早就沒了。", "r": "回不去的家，心裡一定很掛念。伯伯願意的話，跟我說說它以前的樣子，我很想聽。"}, {"a": "沒什麼好看的，以前很窮。", "r": "那時候日子真的很苦，您一路撐過來很不簡單。現在住的地方，您最喜歡哪裡？"}], "more": "那個角落有什麼聲音或味道，您到現在還記得？"}], "care": "老家可能已經拆掉、賣掉，或因為戰亂、遷徙再也回不去，外省、新住民長輩談到時容易想家落淚。遇到時先陪著、說出他的心情（很想念吧），不用急著轉話題，也不要說「現在比較好」來否定他的思念。", "next": "請長輩用手指在桌上比劃老家的格局，您照著畫成一張簡單平面圖，貼在他看得到的地方。"}, {"id": "kid-02", "cat": "童年與家鄉", "title": "小時候玩什麼遊戲", "sub": "尪仔標、跳房子、打陀螺、玩水抓魚", "lv": 1, "opener": "伯伯，我今天帶了一個木頭陀螺來，我自己打了好幾次都轉不起來，聽說您們以前都很會打，可以教我一下嗎？", "props": "一個木頭陀螺和繩子、一疊尪仔標、一條橡皮筋串成的長繩、一顆彈珠，或一張孩子在溪邊玩水的老照片", "know": ["尪仔標是印著人物圖案的圓形厚紙卡，玩法是用自己的卡拍打對方的卡，把它翻過來或打出圈外就贏走。圖案有布袋戲、歷史人物、卡通等。", "打陀螺（打干樂）用木頭陀螺纏繩子甩出去，比誰轉得久，或用自己的陀螺去敲別人的。男孩子會自己削陀螺、換鐵釘當尖頭。", "跳房子是在地上用粉筆或石頭畫格子，丟一塊石頭或瓦片到格子裡，單腳跳過去撿回來；跳橡皮筋是用橡皮筋一條條串成長繩，兩人撐著，一人邊唸口訣邊跳，愈跳愈高。", "鄉下孩子常到溪邊、圳溝、田裡抓魚蝦、摸蜆仔、灌蟋蟀（用水灌洞把蟋蟀趕出來），夏天去溪裡游泳，常被大人罵。", "其他常見的有：打彈珠、跳格子、捉迷藏、老鷹抓小雞、騎馬打仗、玩沙包（布袋裝米或沙）、紙摺的紙飛機與紙船。"], "qs": [{"q": "您小時候最常玩什麼？我這邊有陀螺、尪仔標、橡皮筋，哪個您玩過？", "kind": "選擇", "ans": [{"a": "陀螺啦！我自己用番石榴樹削的，最硬，敲別人的一下就裂開。", "r": "自己削陀螺，還知道用番石榴木最硬，伯伯根本是專家。是誰教您削的？"}, {"a": "女孩子跳橡皮筋，我跳得很高，可以跳到人家舉手那麼高。", "r": "舉手那麼高還跳得過，阿嬤小時候腳好有力。那時候跳的時候有沒有唸什麼口訣？"}, {"a": "沒在玩，要做事啦，哪有時間玩。", "r": "那時候小孩子就要幫忙做事，真辛苦。那做事的空檔，有沒有偷偷玩一下的？"}], "more": "那個東西是自己做的，還是去店裡買的？"}, {"q": "伯伯，這個陀螺的繩子要怎麼纏？您可以教我嗎？", "kind": "請教", "ans": [{"a": "來，要從尖尖這邊開始纏，纏緊一點，手往下用力一甩，再一拉。", "r": "原來要從尖頭開始纏，還要纏緊。我照您說的試一次，您幫我看看對不對。"}, {"a": "手沒力了，打不動了啦。", "r": "沒關係，您動嘴我動手。您幫我看，我哪裡做錯就跟我說。"}, {"a": "這個不是這樣玩的，你這個太小了。", "r": "真的耶，我這個太小了。您們以前的陀螺有多大？比給我看。"}], "more": "以前比賽陀螺，最厲害的人是誰？"}, {"q": "尪仔標以前是怎麼玩的？您贏過很多張嗎？", "kind": "回想", "ans": [{"a": "用拍的，拍到翻面就是你的。我贏一大疊，用橡皮筋綁起來放在褲袋裡，我媽洗衣服都罵。", "r": "贏到一大疊綁起來，好威風。媽媽洗衣服翻到，有沒有被沒收過？"}, {"a": "那是男生在玩的，我們女生不玩那個。", "r": "原來男生女生玩的不一樣。那女生都在玩什麼呢？"}, {"a": "不記得了。", "r": "好，不記得沒關係。我拍一張給您看，您覺得這樣拍得翻嗎？"}], "more": "尪仔標上面的圖案，您最喜歡哪一種？"}, {"q": "以前夏天會不會去溪邊或田裡抓魚、抓蝦、摸蜆仔？", "kind": "是非", "ans": [{"a": "會啊，我們用畚箕去撈，抓到大肚魚、溪哥，帶回家給媽媽煮湯，偷去游泳被打好幾次。", "r": "抓魚回家加菜，還偷游泳被打，好皮的童年。那一頓湯一定特別好喝吧？"}, {"a": "我們部落的男孩子會在溪裡射魚、抓溪蝦，大家分著吃。", "r": "在溪裡射魚，好有本事。抓到的東西大家一起分，這個習慣好溫暖。"}, {"a": "我住城裡，沒去過溪邊。", "r": "原來是城裡長大的。那城裡的小孩下課都在哪裡玩？"}], "more": "水裡抓東西最有成就感的是哪一次？"}, {"q": "小時候玩到天黑，大人都怎麼叫您回家？", "kind": "回想", "ans": [{"a": "我阿母站在門口大聲喊我的名字，整條路都聽得到，再不回去就拿竹枝來了。", "r": "整條路都聽得到，好有媽媽的味道。聽到竹枝兩個字是不是就跑最快？"}, {"a": "我們眷村是吹哨子，或廣播叫，聽到就要回家吃飯。", "r": "吹哨子叫回家，好特別。那時候晚餐最常吃什麼？"}, {"a": "沒人叫我，大家都在忙。", "r": "大人都在忙，您就自己照顧自己，好早就獨立了。那天黑了您都自己知道要回家嗎？"}], "more": "那時候一起玩的朋友，現在還有聯絡嗎？"}, {"q": "您覺得以前小孩子玩的，跟現在小孩玩手機，哪個比較快樂？", "kind": "感受", "ans": [{"a": "當然是以前！以前什麼都自己做，一群人在外面跑，曬得黑黑的也很開心。", "r": "一群人在外面跑、自己動手做，那種開心是手機給不了的。您那群朋友裡誰最會帶頭？"}, {"a": "現在比較好，以前很苦，根本沒有玩具。", "r": "對，以前真的什麼都缺，您是吃過苦的人。那沒有玩具的時候，您都怎麼打發時間？"}, {"a": "我孫子都在玩那個。", "r": "孫子都在玩手機啊。如果讓您教孫子一個以前的遊戲，您想教哪一個？"}], "more": "如果孫子來，您想跟他比賽哪一樣？"}], "care": "有些長輩童年要放牛、顧弟妹、做工，幾乎沒有玩的機會，談到可能覺得失落或自卑。順著接住「那時候真辛苦」，再找他做事時的小樂趣，不要一直追問玩具。動手示範時注意手腕和肩膀，不要勉強用力甩。", "next": "一起用橡皮筋串一條短繩，或在地上貼膠帶畫跳房子格子，請長輩坐著當裁判、丟沙包。"}, {"id": "kid-03", "cat": "童年與家鄉", "title": "打赤腳上學的日子", "sub": "書包、便當、老師與讀不了書的遺憾", "lv": 2, "opener": "阿公，我聽我爸說，他小時候都打赤腳走半個小時去上學，鞋子捨不得穿，要用手拿著。您那時候上學也是這樣嗎？", "props": "一個鋁製便當盒、一個布書包或一張舊的黑白畢業照、播一段〈造飛機〉或〈火車快飛〉的童謠", "know": ["1945 年以前是日本時代，台灣孩子讀「公學校」，1941 年後改稱「國民學校」，上課說日語。約 1938 年以前出生的長輩可能受過日語教育，到現在還會說日語、唱日本童謠。", "1945 年後改說國語，1950、60 年代很多學校規定在校不能說台語、客語等方言，說了會被罰錢、罰站或掛「我要說國語」的狗牌。", "早年鄉下孩子多打赤腳上學，書包用布縫或用包袱巾包書；便當多是鋁盒，帶到學校放進蒸飯箱裡蒸熱，菜常是菜脯蛋、醬瓜、鹹魚。", "1968 年以前義務教育只有國小六年，想讀初中要考聯考，很多孩子小學畢業就去做工、當學徒或幫忙家裡。", "那個年代不少人沒機會讀書，尤其女孩子常被說「女生讀書沒用」，要留在家顧弟妹、做家事，有的長輩到老年才去社區識字班學寫字。"], "qs": [{"q": "您小時候有去上學嗎？是讀日本書，還是讀國語？", "kind": "選擇", "ans": [{"a": "讀日本書，公學校讀到四年級就光復了。我現在還會唱日本歌，老師很兇但教得好。", "r": "讀過日本書，到現在還會唱歌，真不簡單。可以唱一小段給我聽嗎？"}, {"a": "沒讀書，我是查某囡仔，要在家顧弟弟，我爸說女生讀書沒用。", "r": "那麼小就要扛起照顧弟弟的責任，阿嬤真的很能幹。那時候看到別人去上學，心裡怎麼想？"}, {"a": "讀國語啊，在學校講台語還被罰錢。", "r": "講台語被罰錢，那時候真的很嚴。被罰的時候您心裡是什麼感覺？"}], "more": "那時候學校離家多遠？怎麼去的？"}, {"q": "以前上學有穿鞋嗎？還是打赤腳？", "kind": "是非", "ans": [{"a": "打赤腳啦！冬天腳底凍到裂開，石頭路走得很痛，有鞋子也捨不得穿。", "r": "冬天腳都裂開還要走，真的很不容易。那一雙捨不得穿的鞋，是什麼時候才穿的？"}, {"a": "我爸在當兵，我們有穿布鞋，是媽媽自己納鞋底做的。", "r": "媽媽自己納鞋底，一針一針好費工。那雙鞋穿起來舒服嗎？"}, {"a": "嗯……不知道。", "r": "沒關係。您看這張照片，小朋友們都沒穿鞋，您覺得這樣走路腳會不會痛？"}], "more": "上學的路上會經過哪裡？"}, {"q": "中午帶便當嗎？便當裡最常裝什麼？", "kind": "回想", "ans": [{"a": "鋁便當，早上放進學校的蒸飯箱，中午打開整間教室都是菜脯的味道。有蛋就很高興了。", "r": "整間教室菜脯味，好有畫面。便當裡有一顆蛋，那天應該特別開心吧？"}, {"a": "沒便當，中午走回家吃番薯簽，吃完再走回去。", "r": "中午還要來回走，好辛苦。番薯簽飯是誰煮的？"}, {"a": "有時候帶，有時候沒有。沒有就不吃。", "r": "沒有就忍著，那時候孩子真的很能吃苦。肚子餓的時候怎麼撐過去的？"}], "more": "有沒有看過別人便當裡的菜，很羨慕？"}, {"q": "您還記得哪一位老師嗎？是很兇，還是很疼人？", "kind": "選擇", "ans": [{"a": "有一個女老師很疼我，我家裡窮，她把自己的便當分給我吃，我一輩子記得。", "r": "老師分便當給您，這份恩情記一輩子，好感動。那位老師長什麼樣子？"}, {"a": "都很兇，拿藤條打手心，背不起來就打。", "r": "被打手心一定很痛又很怕。那時候您都怎麼努力背書的？"}, {"a": "老師喔……都忘了。", "r": "那麼多年了，忘了很正常。那您記得同學裡誰最調皮嗎？"}], "more": "如果現在見到那位老師，您想跟他說什麼？"}, {"q": "以前在學校學的，有沒有一首歌或一句話，您到現在還記得？", "kind": "開放", "ans": [{"a": "〈火車快飛〉啊，火車快飛，火車快飛，穿過高山，越過小溪……我都還會。", "r": "哇，一下子就唱出來了，記得好清楚。我們一起再唱一次好不好？"}, {"a": "九九乘法表，我現在算錢還是很快。", "r": "九九乘法表學得好，算錢才那麼快，阿公好厲害。那我考您一題，七八多少？"}, {"a": "我沒讀書，什麼都不會。", "r": "沒讀書，但您會的事情很多，持家、做事都是學校教不來的。您最拿手的事情是什麼？"}], "more": "那首歌以前是在什麼時候唱的？"}, {"q": "如果那時候可以讀更多書，您想當什麼？", "kind": "感受", "ans": [{"a": "我想當老師，可是考上初中家裡沒錢，只好去工廠做工，後來就供弟弟妹妹讀。", "r": "您把讀書的機會讓給弟妹，這是很大的犧牲。他們一定很感謝您吧？"}, {"a": "沒想過，那時候能吃飽就好了。", "r": "對，那時候吃飽最重要，您是真的走過那種日子。現在吃飽了，有沒有想學點什麼？"}, {"a": "想當護士，穿白衣服很漂亮。", "r": "穿白衣服的護士，阿姨心很溫柔。您照顧家人這麼多年，其實也很像護士呢。"}], "more": "那時候身邊有誰讀書讀得很好，讓您很佩服？"}], "care": "沒讀書、被迫輟學、因為說母語被處罰，對很多長輩是遺憾或傷痛，尤其女性長輩。不要問「為什麼不讀」，要肯定他在其他地方的能力與付出。受日語教育的長輩可能說起日本時代或戰爭空襲，聽就好，不評論政治對錯。", "next": "一起唱一首童謠（〈火車快飛〉、日本童謠或客家童謠皆可），或請長輩教你寫他的名字。"}, {"id": "kid-04", "cat": "童年與家鄉", "title": "家裡的兄弟姊妹", "sub": "大家庭、排行與照顧弟妹的回憶", "lv": 2, "opener": "阿姨，我家只有我跟我哥兩個，小時候常常吵架，搶電視搶到被罵。您小時候家裡有幾個兄弟姊妹？", "props": "一張大家庭全家福老照片（長輩自己的更好）、一條背巾或揹帶、一碗大鍋飯的照片", "know": ["1950、60 年代台灣一個家庭生五到八個孩子很常見，政府 1960 年代後期才推廣家庭計畫，「兩個恰恰好」的口號是 1970 年代以後才普遍。", "大姊、大哥常要負責照顧弟妹，用背巾把弟妹揹在背上去做事、甚至揹去上學；很多大姊早早出去工作賺錢供弟妹讀書。", "以前也常見「分」出去或送人當養女、童養媳（媳婦仔）的情況，有些長輩其實從小在別人家長大，談到時可能有複雜心情。", "大家庭吃飯常是一張大圓桌或大灶旁，菜要等大人先夾，好吃的留給爸爸或長子；衣服是大的穿完給小的穿。", "外省長輩常有兄弟姊妹留在大陸，1987 年開放探親後才重逢，甚至一輩子沒再見到。"], "qs": [{"q": "您家有幾個兄弟姊妹？您排第幾？", "kind": "開放", "ans": [{"a": "八個！我是老大，下面七個都是我揹大的，我背上都是弟弟妹妹的尿。", "r": "八個裡面的老大，七個都是您揹大的，太了不起了。哪一個最難帶？"}, {"a": "我是老么，上面哥哥姊姊都很疼我。", "r": "老么最受疼，阿嬤小時候一定很可愛。哪個哥哥姊姊最疼您？"}, {"a": "很多個啦，記不清楚了。", "r": "很多個，熱鬧的家。沒關係不用算，您記得誰跟您年紀最近嗎？"}], "more": "那麼多人，家裡吃飯坐得下嗎？"}, {"q": "小時候您有沒有揹過、顧過弟弟妹妹？", "kind": "是非", "ans": [{"a": "有啊，七八歲就揹著弟弟去溪邊洗衣服，他哭我也想哭。", "r": "自己還是小孩，就揹著弟弟去洗衣服，好心疼那時候的您。弟弟後來知道您這麼辛苦嗎？"}, {"a": "沒有，我是被顧的那個。", "r": "原來您是被照顧的那個，有人疼真好。那是誰在照顧您？"}, {"a": "男生不用做這些。", "r": "以前男孩子做的事情不一樣。那您小時候在家都負責什麼工作？"}], "more": "揹弟妹的時候，用什麼揹？"}, {"q": "兄弟姊妹之間，小時候會不會吵架、搶東西？", "kind": "回想", "ans": [{"a": "搶東西吃啊，一顆蛋要切成好幾份，我哥都偷吃比較大塊的，我們打成一團。", "r": "一顆蛋切好幾份，難怪要搶。打成一團之後，誰去告狀？"}, {"a": "不敢吵，我爸很嚴，吵架兩個一起打。", "r": "一起打，所以都不敢吵了。那你們有沒有偷偷互相幫忙？"}, {"a": "沒什麼好講的。", "r": "好，我們不聊那個。您現在跟家人裡面，誰最常來看您？"}], "more": "最後都是誰讓誰？"}, {"q": "家裡的衣服、鞋子，是不是大的穿完給小的穿？", "kind": "是非", "ans": [{"a": "對啊，我都穿姊姊的，補了又補，過年才有一件新衣服，高興得睡不著。", "r": "過年一件新衣服就睡不著，那種開心好純粹。那件新衣服是什麼顏色？"}, {"a": "我是老大，都是我先穿新的，弟弟們穿到破。", "r": "老大先穿新的，弟弟們一定很羨慕。您有沒有偷偷讓給他們？"}, {"a": "嗯，我們那時候都穿麵粉袋做的褲子。", "r": "麵粉袋做的褲子，那是很多人共同的記憶。上面是不是還有字印著？"}], "more": "有沒有一件衣服或一雙鞋，您特別寶貝？"}, {"q": "伯伯，您的兄弟姊妹都在哪裡？有在台灣嗎？", "kind": "開放", "ans": [{"a": "我一個人來台灣，哥哥姊姊都在老家。開放探親回去，姊姊已經走了，只見到哥哥一面。", "r": "隔了幾十年才見到哥哥，姊姊卻等不到，心裡一定很痛。見到哥哥那一刻是什麼感覺？"}, {"a": "都在南部，過年才會聚在一起，大家都老了。", "r": "過年聚在一起，一定很熱鬧。現在大家見面最常聊什麼？"}, {"a": "都走了，剩我一個。", "r": "只剩下您一個，一定很孤單吧。您最想念的是哪一個？"}], "more": "他們跟您長得像嗎？"}, {"q": "兄弟姊妹裡面，您最想念、最感謝的是誰？", "kind": "感受", "ans": [{"a": "我大姊，她十四歲就去紡織廠做工，賺的錢都拿回家給我們讀書。", "r": "大姊十四歲就扛起一家，您一直記著她的好。您有跟她說過謝謝嗎？"}, {"a": "我是被送去當養女的，跟親生的兄弟姊妹不熟。", "r": "從小在別人家長大，這段路一定不簡單。您願意的話，跟我說說養家的人對您好不好。"}, {"a": "都差不多啦。", "r": "都差不多，大家都是一家人。那小時候跟誰最常玩在一起？"}], "more": "如果現在可以跟他說一句話，您想說什麼？"}], "care": "兄弟姊妹可能已過世、失聯、分隔兩岸，或長輩曾被送養、當童養媳，談起來容易勾起喪親、被拋下的感受。他沒主動說就不要追問身世；他難過時先陪伴與反映心情，不要急著安慰「都過去了」。", "next": "請家屬找一張兄弟姊妹的合照，一起指認每個人，或請長輩示範以前揹弟妹的背巾綁法。"}, {"id": "kid-05", "cat": "童年與家鄉", "title": "柑仔店與古早零食", "sub": "枝仔冰、麥芽糖、抽糖仔與零用錢", "lv": 1, "opener": "阿公，我今天買了一根麥芽糖來，黏得我滿手都是，我想起小時候巷口的柑仔店。您小時候家附近有柑仔店嗎？", "props": "一根麥芽糖或一小罐麥芽膏配餅乾、幾顆古早味糖球、一支冰棒、一張柑仔店玻璃罐的照片、幾個一角五角舊硬幣（或照片）", "know": ["柑仔店就是雜貨店，賣油鹽醬醋、米酒、火柴、香菸，也賣小孩子的零食。糖果、餅乾裝在一排有蓋子的玻璃罐裡，一顆一顆秤或用數的賣。", "枝仔冰是冰棒，1950、60 年代常有人騎腳踏車載著保麗龍或木箱沿街叫賣，口味有紅豆、鳳梨、牛奶、花生，早期一支大概一兩角到五角，各地價格不同。", "麥芽糖用竹籤或兩根小棍捲起來吃，也有夾在兩片餅乾中間。以前有挑擔子的人沿街喊「酒矸通賣無」，可以拿空酒瓶、舊報紙、廢鐵去換麥芽糖。", "抽糖仔（抽抽樂）是花一點錢抽一張籤，依籤上的號碼換糖果或小玩具，有時抽中大獎是一大包糖，很多孩子把零用錢都花在這裡。", "那時的零食還有：李仔糖（糖葫蘆）、糖球、酸梅、龍角散味的薄荷糖、爆米香、彈珠汽水（瓶口有玻璃珠）、黑松汽水、烤魷魚、煮花生。"], "qs": [{"q": "小時候家附近有沒有柑仔店？", "kind": "是非", "ans": [{"a": "有啊，就在廟口，老闆娘很胖，都坐在店門口搧扇子，糖果放在玻璃罐裡。", "r": "廟口胖胖的老闆娘搧扇子，好有畫面。您最常跟她買什麼？"}, {"a": "我家就是開柑仔店的！我常常偷吃糖被我爸發現。", "r": "家裡就是柑仔店，太幸福了吧！偷吃糖被發現，爸爸怎麼處罰您？"}, {"a": "沒有，鄉下很遠，要走很久才有一間。", "r": "要走很久才到，那去一次一定很珍惜。去柑仔店是不是很特別的事？"}], "more": "那間店裡最吸引您的東西是什麼？"}, {"q": "阿嬤，您吃過這個嗎？麥芽糖要怎麼捲才不會黏到手？可以教我嗎？", "kind": "請教", "ans": [{"a": "要用兩根竹籤一直捲一直捲，捲到變白就不黏了，而且越捲越好吃。", "r": "原來要捲到變白，我剛剛就是捲太少。我照您說的再捲一次，您看我做得對不對。"}, {"a": "我們都夾餅乾，兩片餅乾夾一點，一口咬下去。", "r": "夾餅乾吃也很香，我們現在就來試試看，您幫我夾好不好？"}, {"a": "這個太黏，我牙齒不好不能吃。", "r": "對，牙齒要顧好，不吃沒關係。您聞聞看這個甜甜的味道，有沒有想起小時候？"}], "more": "以前是跟誰換到麥芽糖的？"}, {"q": "您小時候吃過枝仔冰嗎？最喜歡哪一種口味？紅豆、鳳梨，還是牛奶？", "kind": "選擇", "ans": [{"a": "紅豆的！賣冰的騎腳踏車搖鈴鐺，我們一聽到就衝出去，夏天最期待的就是那個。", "r": "一聽到鈴鐺就衝出去，那是夏天最快樂的聲音。那時候一支多少錢？"}, {"a": "我們家沒錢買，都看別人吃。", "r": "只能看別人吃，心裡一定很想要。後來長大第一次自己買，還記得嗎？"}, {"a": "冰的我不能吃。", "r": "好，我們今天不吃冰的。那您記得以前夏天吃什麼最消暑？"}], "more": "有沒有一次吃冰吃到被大人罵？"}, {"q": "以前有沒有玩過抽糖仔？抽中大獎過嗎？", "kind": "回想", "ans": [{"a": "有啦，一角抽一次，我抽好多次都是銘謝惠顧，只有一次抽到一大包，全班都來分。", "r": "抽中一大包還分全班，您好大方，那天一定是班上的英雄。"}, {"a": "那是騙小孩的錢，我媽不准我們抽。", "r": "媽媽很有原則。那您有沒有偷偷看別人抽，很想試試看？"}, {"a": "我在印尼的時候，也有類似的，抽到小玩具。", "r": "印尼也有啊，原來每個地方的小孩都愛抽獎。阿姨小時候在印尼最喜歡吃什麼零食？"}], "more": "那時候抽獎的獎品有哪些？"}, {"q": "那時候的零用錢是怎麼來的？一次可以拿到多少？", "kind": "開放", "ans": [{"a": "過年才有紅包，平常要幫忙撿酒瓶、廢鐵去賣，賺個幾角錢就很高興。", "r": "自己撿酒瓶賺零用錢，那麼小就懂得賺錢，好能幹。賺來的錢都怎麼花？"}, {"a": "沒有零用錢，那時候哪有那種東西。", "r": "沒有零用錢，日子很省。那家裡有沒有偶爾買零食給你們？"}, {"a": "一角、五角吧，我也不知道。", "r": "一角、五角，那時候可以買好幾樣呢。您看這些舊硬幣，摸起來跟現在的有什麼不一樣？"}], "more": "第一次自己拿錢買東西，買了什麼？"}, {"q": "現在如果可以回到那間柑仔店，您最想買哪一樣？", "kind": "感受", "ans": [{"a": "彈珠汽水，那個玻璃珠要壓下去才喝得到，噗一聲好好玩，我還把珠子留起來。", "r": "噗一聲，還把珠子留起來，好可愛。那些珠子後來都拿來做什麼？"}, {"a": "什麼都不用了，現在什麼都買得到。", "r": "對，現在什麼都買得到。不過以前的味道，有沒有哪一樣是現在吃不到的？"}, {"a": "想買糖給我弟弟，他小時候都吃不到。", "r": "您第一個想到的是弟弟，好疼他。弟弟小時候最喜歡什麼？"}], "more": "那個味道您現在還想得起來嗎？"}], "care": "糖尿病、吞嚥困難、牙口不好的長輩不要真的給他吃麥芽糖、硬糖球或冰品，事先問家屬或改用聞、看、摸。有些長輩小時候窮到買不起零食，回應「只能看別人吃」時，先接住那份委屈，再轉到其他甜蜜的回憶。", "next": "用紙盒和瓶罐一起排一個迷你柑仔店，請長輩當老闆、你當客人，拿舊硬幣來買賣。"}, {"id": "kid-06", "cat": "童年與家鄉", "title": "阿公阿嬤與爸媽", "sub": "家裡長輩、家教與難忘的一句話", "lv": 3, "opener": "阿嬤，我小時候是阿嬤帶大的，她常跟我說「吃飯碗要吃乾淨，不然會嫁麻臉的」，我到現在吃飯都不敢剩。您小時候家裡長輩有沒有常說什麼話？", "props": "長輩爸媽或阿公阿嬤的老照片（請家屬提供）、一根竹枝或藤條的照片、播一段〈天黑黑〉或〈母親您真偉大〉", "know": ["那個年代常是三代同堂，阿公阿嬤是一家之主，吃飯要等長輩先動筷，好菜先夾給長輩，對長輩要叫人、不能頂嘴。", "常見的家教話有：「碗內的飯要吃乾淨，不然會嫁（娶）麻臉的」、「做人要古意（老實）」、「吃人一口，還人一斗」、「囡仔人有耳無嘴」（小孩子聽就好不要插嘴）。", "管教常用竹枝、藤條、雞毛撢子，罰跪、罰站也很普遍，那時候大多數人把嚴格當成疼愛。", "很多爸爸出外做工、跑船、當兵，或在戰爭時被徵調，媽媽一人撐家，長輩對媽媽的辛苦往往印象很深。", "客家家庭重視讀書與勤儉，外省家庭多半是爸媽兩人帶著孩子來台，沒有阿公阿嬤在身邊；原住民家庭常與部落長老、族人一起生活。"], "qs": [{"q": "您小時候，家裡是跟阿公阿嬤一起住嗎？", "kind": "是非", "ans": [{"a": "有啊，三代住一起，阿公最大，他咳一聲大家都不敢講話。", "r": "阿公咳一聲全家安靜，好有威嚴。那阿公有沒有比較疼誰？"}, {"a": "沒有，我爸媽從大陸過來，阿公阿嬤都留在老家，我從來沒見過他們。", "r": "從來沒見過阿公阿嬤，心裡一定有點空空的。爸媽有沒有跟您說過他們的事？"}, {"a": "我不記得了。", "r": "沒關係，不用勉強想。那您記得小時候家裡吃飯，誰坐在最大的位子？"}], "more": "家裡誰說了算？"}, {"q": "您的爸爸是做什麼工作的？媽媽呢？", "kind": "開放", "ans": [{"a": "我爸種田，也去礦坑做工，一身都黑黑的回來。我媽在家顧田、養豬、煮飯，從早忙到晚。", "r": "爸爸進礦坑，媽媽顧田養豬，兩個人都好拚。您那時候最常幫媽媽做什麼？"}, {"a": "我爸是軍人，常常調來調去，我們跟著搬家，我讀了好幾間小學。", "r": "跟著爸爸調來調去，換好多學校，一定交過很多朋友吧？哪一個地方您最喜歡？"}, {"a": "沒什麼好講的，都在做工。", "r": "都在做工，那時候大家都很辛苦。您覺得自己比較像爸爸還是像媽媽？"}], "more": "爸媽工作回家，最常做的一件事是什麼？"}, {"q": "小時候家裡規矩嚴不嚴？做錯事會怎麼樣？", "kind": "回想", "ans": [{"a": "很嚴！吃飯不能出聲，筷子不能插在飯上，做錯事用竹枝打腳，打完還要跪在神明桌前面。", "r": "規矩好多又好嚴，您都記得清清楚楚。那時候被罰，心裡有沒有很委屈？"}, {"a": "我媽很溫柔，從來不打我們，做錯就好好跟我們說。", "r": "有個溫柔的媽媽真好。媽媽最常跟您說的道理是什麼？"}, {"a": "被打很多次啦，不想講。", "r": "好，我們不講那個。那家裡有沒有讓您覺得溫暖、開心的時候？"}], "more": "這些規矩，您後來有教給自己的孩子嗎？"}, {"q": "阿公，您爸爸或媽媽有沒有教過您一樣本事，到現在都還會？可以教我嗎？", "kind": "請教", "ans": [{"a": "我爸教我看天氣，雲往山那邊走就會下雨，種田的人都要會看。", "r": "看雲就知道會不會下雨，這是好厲害的本事。您看今天外面的雲，會下雨嗎？"}, {"a": "我媽教我醃菜脯、做鹹菜，鹽要放多少，手一抓就知道。", "r": "手一抓就知道份量，這是練很久的功夫。您可以告訴我第一步要怎麼做嗎？"}, {"a": "沒教什麼，都是自己學的。", "r": "都是自己學的，那您真的很靠自己。您覺得自己最拿手的是什麼？"}], "more": "那個本事，您有傳給誰嗎？"}, {"q": "爸媽或阿公阿嬤說過的話裡面，有沒有一句您到現在都記得？", "kind": "回想", "ans": [{"a": "我阿嬤說「做人要古意，吃虧就是佔便宜」，我一輩子都這樣做人。", "r": "做人要古意，您一輩子都照著做，阿嬤一定很驕傲。這句話有沒有幫過您？"}, {"a": "我媽臨走前跟我說「你要好好照顧弟弟」，我答應她了。", "r": "這是媽媽最後的託付，您一直放在心上。您做到了，媽媽一定看得到。"}, {"a": "他們很少跟我說話，都在忙。", "r": "爸媽忙到很少說話，那時候家家都這樣。雖然不說，有沒有什麼事讓您覺得他們其實很疼您？"}], "more": "您會把這句話說給孫子聽嗎？"}, {"q": "如果現在可以再見爸爸或媽媽一面，您最想跟他們說什麼？", "kind": "感受", "ans": [{"a": "我想跟我媽說謝謝，她一個人帶我們很辛苦，我那時候不懂事，還常惹她生氣。", "r": "您現在懂了媽媽的辛苦，這份謝謝她一定收得到。媽媽聽到會說什麼呢？"}, {"a": "我想問我爸，為什麼那麼早就走了，留我們母子。", "r": "爸爸很早離開，您心裡一直有個問號，也很捨不得。想念爸爸的時候，您都怎麼做？"}, {"a": "我媽還在啊，她等一下會來接我。", "r": "您很想念媽媽，好想見到她。跟我說說媽媽是個怎樣的人好嗎？"}], "more": "您覺得自己哪一點最像媽媽（或爸爸）？"}], "care": "這個主題容易觸動喪親、被打罵、父母早逝或父親被徵調戰場的傷痛，也可能引出家暴或被送養的經驗。長輩若說爸媽還在、要來接他，不要糾正「早就過世了」，順著情緒聊他想念的人；情緒太激動時放慢節奏、握手陪伴，必要時告知家屬或個管。", "next": "請長輩說一句爸媽或阿公阿嬤常講的話，你寫成大字卡貼在牆上，下次來一起唸。"}, {"id": "food-01", "cat": "飲食與料理", "title": "請您教我一道拿手菜", "sub": "請長輩當老師，教一道家常菜", "lv": 2, "opener": "阿嬤，我昨天晚上想煮菜脯蛋，結果蛋煎到焦黑，菜脯又太鹹，我先生吃一口就笑我。我聽說您以前很會煮，可不可以教我一道您最拿手的菜？", "props": "一把鍋鏟、一個小碗和一雙筷子讓長輩比動作；手機裡菜脯蛋、三杯雞、滷肉、梅干扣肉的照片；可放一段炒菜的滋滋聲", "know": ["1950、60 年代很多人家裡用磚砌的大灶，燒木柴、稻草或粗糠（稻殼），火候要靠人在灶前顧，所以長輩常說「火要顧」。", "大同電鍋 1960 年上市，瓦斯爐在 1970 年代才逐漸普及，在那之前也常見煤球爐。很多阿嬤是從大灶一路煮到瓦斯爐的。", "以前炒菜多用豬油，買肥豬肉或豬板油回家自己炸，剩下的油渣可以拌飯或炒菜，很香。味精（味素）在 1960 年代很流行，被當成好東西。", "不同族群的拿手菜不一樣：閩南常見滷肉、菜脯蛋、三杯雞；客家常見客家小炒、梅干扣肉、薑絲炒大腸；外省家庭常見紅燒肉、獅子頭、蔥油餅、水餃；原住民有小米、醃肉、野菜湯。", "長輩說的份量常是「一把」「一匙」「看差不多」，不是精確公克數，這是經驗，不用糾正。"], "qs": [{"q": "阿嬤，您最會煮的是哪一道菜？", "kind": "開放", "ans": [{"a": "我的滷肉喔，我孫子回來都要吃兩碗飯，鄰居也來討。", "r": "孫子吃兩碗，您一定很有成就感！那滷肉是用三層肉還是用胛心肉？"}, {"a": "沒什麼拿手的啦，就隨便煮煮。", "r": "隨便煮煮就能把一家人餵大，這已經很厲害了。那您家人最常吃的是哪一道？"}, {"a": "我們客家人做梅干扣肉，要蒸很久，肉才會軟。", "r": "梅干扣肉！光聽就流口水了。蒸很久是要蒸多久，一個早上嗎？"}], "more": "這道菜是跟誰學的？媽媽還是婆婆？"}, {"q": "這道菜要準備哪些材料？您教我，我記下來。", "kind": "請教", "ans": [{"a": "三層肉、醬油、冰糖、蒜頭、紅蔥頭，還有滷蛋，要放八角，一點點就好。", "r": "我寫下來了，三層肉、醬油、冰糖、紅蔥頭，八角一點點。冰糖跟砂糖有差嗎？"}, {"a": "忘記了啦，老了記不得。", "r": "沒關係，我們不用背食譜。阿嬤，滷肉是不是要很香的醬油味？您聞過最香的是哪一家的醬油？"}, {"a": "要先去市場挑肉，肉要挑好的，那個老闆跟我很熟。", "r": "原來選肉是第一步，還有熟識的老闆。您都怎麼看肉好不好？"}], "more": "那時候這些材料都去哪裡買？"}, {"q": "火候怎麼顧？要大火還是小火？", "kind": "請教", "ans": [{"a": "先大火炒香，再轉小火燉，以前燒柴要一直看，柴太多會燒焦。", "r": "先大火再小火，以前還要自己顧柴火，真的很不簡單。那時候是誰幫忙顧灶？"}, {"a": "小火啦。", "r": "小火慢慢來，難怪好吃。是要燉到肉用筷子一插就軟嗎？"}, {"a": "我們以前用煤球爐，晚上還要封爐，不然火熄了很麻煩。", "r": "封爐我第一次聽到，好有學問！是怎麼封的，蓋一個蓋子嗎？"}], "more": "有沒有哪次煮失敗的？"}, {"q": "這道菜有沒有什麼秘訣，是別人不知道的？", "kind": "請教", "ans": [{"a": "紅蔥頭要自己用豬油爆，買現成的不夠香，還有醬油不能一次全下。", "r": "原來秘訣在這裡，自己爆紅蔥頭，醬油分次下。這招我一定要學起來。"}, {"a": "沒什麼秘訣，用心煮就好吃。", "r": "用心就是最大的秘訣，難怪家人都愛吃。您煮的時候心裡會想著誰？"}, {"a": "秘訣喔，不能說，說了你就會了。", "r": "哈哈，阿嬤留一手！那我要多來幾次，慢慢跟您學。"}], "more": "這個秘訣有教給女兒或媳婦嗎？"}, {"q": "這道菜通常什麼時候煮？平常還是過節？", "kind": "回想", "ans": [{"a": "拜拜的時候、過年、孩子回來的時候，一煮就是一大鍋。", "r": "孩子回來就煮一大鍋，這是媽媽的心意。那時候家裡有幾個孩子搶著吃？"}, {"a": "不記得了。", "r": "沒關係。我問簡單的，阿嬤那時候比較常煮給家人吃，還是煮去拜拜？"}, {"a": "以前哪有肉可以吃，平常都吃菜，肉要過年才有。", "r": "肉那麼珍貴，所以這道菜更有意義。過年聞到滷肉香，一定很開心吧？"}], "more": "家人吃完都會說什麼？"}, {"q": "家人吃您煮的菜，您心裡是什麼感覺？", "kind": "感受", "ans": [{"a": "很歡喜啊，看他們吃得乾乾淨淨，再累都值得。", "r": "吃得乾乾淨淨，就是對您最好的稱讚。您真的是一家人的大廚。"}, {"a": "現在都沒人吃我煮的了，我也煮不動了。", "r": "以前那麼會煮，現在不能煮，心裡一定有點失落。可是您教我的這些，我會記著，下次煮給您嚐嚐看。"}, {"a": "我先生最愛吃，他走了以後我就很少煮了。", "r": "這道菜裡有很多跟先生的回憶。阿伯吃的時候都說些什麼？"}], "more": "如果現在可以煮一道給一個人吃，您想煮給誰？"}], "care": "長輩可能因為現在不能下廚、或想起過世的家人而失落，先接住情緒，告訴他「您教我的，我會記著」，讓他保有當老師的價值。糖尿病、腎臟病或管灌的長輩聊吃很正常，可以聊香味、做法和回憶，但不要答應帶東西給他吃，也不要說「這個你不能吃」來掃興，飲食問題交給家屬與營養師。有吞嚥困難的長輩若想嚐，一律先問家屬與護理師，不要自行餵食。", "next": "請長輩坐著用鍋鏟、碗比畫炒菜和調味的手勢，或一起洗菜、撿菜，讓他動手當老師。"}, {"id": "food-02", "cat": "飲食與料理", "title": "過年年菜與辦桌", "sub": "圍爐、年菜意義與辦桌的熱鬧", "lv": 2, "opener": "阿公，我小時候最期待吃辦桌，因為可以吃到紅蟳米糕，還有最後的甜湯。您以前過年或吃喜酒，最記得哪一道菜？", "props": "長年菜、全雞、全魚、紅蟳米糕、佛跳牆的照片；辦桌紅色帆布棚的照片；播〈恭喜恭喜〉或〈新年好〉", "know": ["圍爐的年菜多有吉祥意義：長年菜（芥菜，閩南常整株不切斷）代表長壽；雞代表「起家」；魚代表「年年有餘」，常留一點到隔天；菜頭粿是「好彩頭」，發粿代表發財，甜粿代表甜甜蜜蜜。", "早年圍爐真的會在桌下放一個小火爐，一家人圍著吃，所以叫「圍爐」。", "辦桌是請總鋪師帶團隊來家門口或廟埕搭棚、架爐灶，一桌通常坐 10 到 12 人。常見菜色有冷盤（拼盤）、魷魚螺肉蒜、佛跳牆、紅蟳米糕、全雞、全魚，最後上甜湯或水果。", "以前辦桌常有人帶塑膠袋把吃不完的菜打包回家，叫「打包」或「菜尾」，菜尾湯隔天加熱，很多人覺得更好吃。", "外省家庭的年夜飯不同：北方人包餃子，江浙人有八寶飯、獅子頭、蛋餃，四川人做臘肉、香腸；客家人過年做甜粄、發粄、菜包。"], "qs": [{"q": "阿公，過年圍爐，您家桌上一定有哪一道菜？", "kind": "回想", "ans": [{"a": "長年菜啊，一定要有，整根吃不能咬斷，吃了才會長壽。", "r": "整根不能咬斷，這個意思真好。那長年菜是煮湯，還是炒的？"}, {"a": "我們山東人過年就包餃子，大家一起包，包到半夜。", "r": "全家一起包餃子，好熱鬧！伯伯您負責桿皮還是包餡？"}, {"a": "都差不多啦，忘了。", "r": "沒關係。我來猜猜，桌上有沒有一整條魚？還是一隻雞？"}], "more": "年菜是誰在煮的？要準備幾天？"}, {"q": "魚是不是一定要留一點不能吃完？", "kind": "是非", "ans": [{"a": "對啊，年年有餘嘛，我媽媽都會說魚頭魚尾留著，明天再吃。", "r": "年年有餘，留到明天，媽媽好有心。那時候都吃什麼魚？"}, {"a": "我們家沒在管那個，吃完就算了。", "r": "吃得完也是福氣啊！那您家過年最搶手的是哪一道？"}, {"a": "嗯。", "r": "嗯，有留。阿公喜歡吃魚嗎？吃魚肚還是魚頭？"}], "more": "還有什麼過年不能做的事？例如不能掃地、不能說不好聽的話？"}, {"q": "您以前吃過辦桌嗎？都是誰家請客？", "kind": "回想", "ans": [{"a": "很多啊，結婚、做壽、廟裡拜拜，路邊搭棚子，一辦就幾十桌，小孩子跑來跑去。", "r": "幾十桌在路邊，畫面好熱鬧。阿公最記得是誰的喜宴？"}, {"a": "我自己結婚就是辦桌，在三合院前面，請了二十幾桌。", "r": "自己的喜宴，一定很難忘！那天穿什麼衣服，緊不緊張？"}, {"a": "很少去，我們家窮，沒人請。", "r": "那時候日子比較辛苦。那您家附近有辦桌的時候，會不會聞到很香的味道？"}], "more": "辦桌的時候有沒有請人來唱歌或表演？"}, {"q": "辦桌上菜，您最喜歡哪一道：紅蟳米糕、佛跳牆、還是最後的甜湯？", "kind": "選擇", "ans": [{"a": "紅蟳米糕！蟳的膏很香，米糕吸了湯汁，我可以吃兩碗。", "r": "紅蟳米糕配蟳膏，阿公很識貨！那時候一桌一隻蟳，大家都搶嗎？"}, {"a": "甜湯。", "r": "甜湯是最後的完美句點！是紅豆湯，還是有湯圓的？"}, {"a": "我只記得有很多冷盤，烏魚子、香腸，還有鳳梨蝦球。", "r": "冷盤一上來就知道今天是大日子。烏魚子那時候很貴吧？"}], "more": "打包回去的菜尾，您喜歡吃嗎？"}, {"q": "您知道總鋪師嗎？他們是怎麼辦出幾十桌菜的？", "kind": "請教", "ans": [{"a": "總鋪師很厲害，前一天就來殺雞、洗菜，在路邊架大鼎，一個人指揮很多人。", "r": "原來前一天就開始準備，在路邊架大鼎！阿公您有沒有看過他們在炒菜？"}, {"a": "不知道，我只負責吃。", "r": "哈哈，負責吃也很重要。那您覺得菜好不好吃，看什麼最準？"}, {"a": "我們庄頭有一個總鋪師，他是我表哥，我還去幫忙洗碗。", "r": "您還去幫忙，那是內行人了！洗碗洗到幾點？有沒有包紅包給你們？"}], "more": "那時候一桌辦桌大概多少錢，您記得嗎？"}, {"q": "過年一家人圍在一起吃飯，您心裡最懷念的是什麼？", "kind": "感受", "ans": [{"a": "人多啊，兄弟姊妹都回來，熱熱鬧鬧，現在都散了。", "r": "以前人多熱鬧，現在聚少，心裡難免想念。那時候吃完飯大家都在做什麼？"}, {"a": "沒什麼好懷念的，過年就是累。", "r": "過年要準備那麼多，真的很累，辛苦您了。那您覺得哪一件事最累？"}, {"a": "我最懷念我媽媽做的甜粿，現在外面買的都不對味。", "r": "媽媽的味道是外面買不到的。媽媽做甜粿的時候，您會在旁邊幫忙嗎？"}], "more": "今年過年，您最想跟誰一起吃飯？"}], "care": "過年團圓容易讓獨居或喪偶的長輩想起不在身邊的家人，若長輩說「現在都散了」，先陪他一起懷念，不要急著說「孩子很忙」。有糖尿病的長輩聊甜粿、甜湯沒關係，只聊不吃，不要評論他能不能吃；管灌或吞嚥困難的長輩可以多聊香味、熱鬧和人，少強調口感，避免勾起「我再也不能吃」的難過。", "next": "一起看辦桌或年菜照片，請長輩替每道菜說一句吉祥話，或一起寫一張春聯「年年有餘」。"}, {"id": "food-03", "cat": "飲食與料理", "title": "早餐配稀飯的滋味", "sub": "稀飯配菜、燒餅油條與三餐記憶", "lv": 1, "opener": "阿嬤早安！我今天早上吃了一碗稀飯配菜脯蛋，吃得好飽。阿嬤您早上喜歡吃稀飯，還是吃饅頭？", "props": "一罐醬瓜或豆腐乳（讓長輩看、聞，不必打開吃）；稀飯配菜、燒餅油條、饅頭、地瓜的照片；一顆真的地瓜讓長輩摸", "know": ["早年很多台灣家庭早餐吃稀飯，配菜常見醬瓜、菜脯蛋、豆腐乳、花生麵筋、土豆（花生）、肉鬆、鹹蛋，鄉下也有人早上就吃乾飯準備下田。", "白米不夠的年代，會把番薯刨成絲曬乾做成「番薯簽」，摻在米裡煮成地瓜簽飯或地瓜簽粥，常是番薯比米多。", "燒餅油條、豆漿、饅頭、包子是 1949 年前後隨外省移民帶來的北方早餐。1950 年代起在永和中正橋頭一帶出現豆漿店，後來「永和豆漿」成了早餐店的代名詞。", "1970、80 年代起出現西式早餐店，賣漢堡、三明治、蛋餅、奶茶，很多長輩的孩子是吃這個長大的。", "農家一天常吃不只三餐，下田時中間會吃「點心」，例如米粉湯、鹹粥、番薯，送到田邊給大家吃。"], "qs": [{"q": "阿嬤，您早上喜歡吃稀飯，還是饅頭？", "kind": "選擇", "ans": [{"a": "稀飯啦，吃了一輩子，熱熱的配醬瓜最好。", "r": "熱稀飯配醬瓜，暖胃又舒服。阿嬤喜歡稀飯煮稠一點還是水水的？"}, {"a": "我們北方人吃饅頭，還要配豆漿。", "r": "饅頭配豆漿，好有北方味。伯伯喜歡甜豆漿還是鹹豆漿？"}, {"a": "都可以。", "r": "都可以，阿嬤好隨和。那今天早上吃了什麼？好不好吃？"}], "more": "以前早上是誰在煮早餐？"}, {"q": "吃稀飯的時候，您最愛配哪一樣：醬瓜、菜脯蛋、還是豆腐乳？", "kind": "選擇", "ans": [{"a": "菜脯蛋！菜脯要先炒香，再倒蛋，煎到兩面金黃，我一個人可以吃半盤。", "r": "兩面金黃的菜脯蛋，聽了就好香。阿嬤是菜脯切細細的，還是粗粗的？"}, {"a": "豆腐乳，一小塊就可以配一碗。", "r": "豆腐乳很下飯，一小塊就夠。阿嬤喜歡有辣的還是不辣的？"}, {"a": "不知道，都吃。", "r": "什麼都吃，好養。我給您聞聞這罐醬瓜，是不是很熟悉的味道？"}], "more": "這些配菜以前是自己做的，還是買的？"}, {"q": "您以前有吃過地瓜簽飯嗎？", "kind": "是非", "ans": [{"a": "有啊，天天吃，都是番薯簽比米多，吃到怕。", "r": "天天吃到怕，那個年代真的辛苦。番薯簽是自己家裡刨的嗎？"}, {"a": "沒有，我們家在城裡，都吃白米飯。", "r": "那阿嬤家吃白米飯，算是很好命喔。那有沒有聽鄰居說過地瓜簽？"}, {"a": "地瓜很甜。", "r": "對，地瓜很甜。這顆地瓜給您摸摸看，像不像以前吃的？"}], "more": "現在再吃地瓜，您喜歡嗎？"}, {"q": "燒餅油條您吃過嗎？第一次吃是什麼時候？", "kind": "回想", "ans": [{"a": "我們家巷口就有一個老芋仔在賣，燒餅夾油條，配一杯豆漿，那時候覺得好新鮮。", "r": "巷口的燒餅油條，好有畫面。他是怎麼做燒餅的，貼在爐子裡烤嗎？"}, {"a": "我是山東來的，從小就吃，我媽媽會自己炸油條。", "r": "媽媽自己炸油條，真厲害！伯伯小時候在家鄉，早上還吃什麼？"}, {"a": "沒印象。", "r": "沒關係。那阿嬤小時候早上，比較常吃稀飯，還是吃乾飯？"}], "more": "那時候一份燒餅油條多少錢，您記得嗎？"}, {"q": "以前下田或做工，中間有沒有吃點心？都吃什麼？", "kind": "回想", "ans": [{"a": "有啊，割稻的時候，十點多跟下午三點，有人挑鹹粥、米粉湯到田裡，大家坐田埂吃。", "r": "坐在田埂吃鹹粥，一定特別香。那是誰挑過去的？是您嗎？"}, {"a": "我在工廠做，中午就吃便當，鋁的便當盒，拿去蒸飯箱蒸。", "r": "鋁便當盒放蒸飯箱，好多人都有這個回憶！您便當裡最常帶什麼菜？"}, {"a": "哪有點心，做到餓也要做。", "r": "做到餓還要撐，那時候真的很辛苦。您那時候最想吃的是什麼？"}], "more": "一天裡面，您最喜歡哪一餐？"}, {"q": "現在早上吃東西，您覺得什麼味道最舒服？", "kind": "感受", "ans": [{"a": "熱熱的、軟軟的，稀飯最好，牙齒不好了。", "r": "熱熱軟軟的最舒服，對您的胃也好。早上喝到熱熱的，心情會比較好嗎？"}, {"a": "沒有胃口，吃什麼都一樣。", "r": "沒胃口的時候真的很難受。阿嬤以前心情好的時候，早上最想吃什麼？"}, {"a": "我想吃以前我太太煮的鹹粥。", "r": "太太的鹹粥一定很有味道。她都放些什麼料在裡面？"}], "more": "如果明天早上可以吃任何東西，您想吃什麼？"}], "care": "這個主題感官多、回答簡單，適合中重度失智長輩，可用照片和實物讓他選、聞、摸。有糖尿病的長輩聊稀飯、地瓜、甜豆漿沒關係，只聊不評論，也不要順手拿東西給他吃；管灌或吞嚥困難的長輩不要讓他試吃醬瓜等任何食物，實物只看和聞，若他說「好想吃」，先接住想念，飲食調整一律交給家屬、護理師或語言治療師。說到吃番薯簽吃到怕時可能牽出貧窮的辛酸，肯定他撐過來的不容易即可。", "next": "拿一顆地瓜和醬瓜罐讓長輩摸、聞、說出名稱，或一起把早餐照片排出「稀飯配什麼」。"}, {"id": "food-04", "cat": "飲食與料理", "title": "古早味小吃與點心", "sub": "粿、粽子、麵線與各地家鄉味", "lv": 1, "opener": "阿姨，我最近去市場看到有人在賣紅龜粿，紅紅的好漂亮，讓我想起我阿嬤以前也會自己做。您喜歡吃粿嗎？", "props": "紅龜粿、草仔粿、碗粿、肉粽、麵線、客家菜包的照片；一個木頭粿模（龜印）讓長輩摸；播〈燒肉粽〉", "know": ["粿是用米磨成米漿、壓乾成粿粹再做的：紅龜粿用粿模壓出龜殼花紋，代表長壽，拜拜、做壽用；草仔粿加鼠麴草或艾草，清明節常吃；碗粿用在來米漿加料放碗裡蒸。", "粽子南北不同：北部粽是糯米先炒過、包好用蒸的；南部粽是生糯米包好放水裡煮，口感較軟黏。客家人還有粄粽，另外有加鹼的鹼粽，冰過沾糖吃。", "麵線常見於生活大事：做生日吃豬腳麵線，出遠門或遇到不順也會吃豬腳麵線「去霉運」；台北有大腸蚵仔麵線。", "客家點心有菜包（豬籠粄）、新丁粄、粄條、擂茶；外省家鄉味有牛肉麵、蔥油餅、鍋貼、韭菜盒子；原住民有小米粽、阿拜（排灣族的吉拿富，用假酸漿葉包小米）、竹筒飯。", "〈燒肉粽〉是 1949 年張邱東松作詞作曲的台語歌，唱出戰後生活困苦、沿街叫賣肉粽的情景，很多長輩都會唱。"], "qs": [{"q": "阿姨，這張是紅龜粿，您有吃過嗎？", "kind": "是非", "ans": [{"a": "有啊，以前做壽、拜拜都要做，我媽媽用龜印一個一個壓，還要墊一片香蕉葉。", "r": "還要墊香蕉葉，阿姨記得好清楚！這個龜印給您摸摸看，是不是這種花紋？"}, {"a": "有。", "r": "有吃過。紅龜粿裡面是包甜的紅豆，還是鹹的？"}, {"a": "沒有，我們原住民吃小米，做阿拜。", "r": "阿拜！用葉子包小米對不對？您可以教我是包哪一種葉子嗎？"}], "more": "做粿的時候，小孩可以幫忙做什麼？"}, {"q": "粽子您喜歡吃北部粽、南部粽，還是鹼粽？", "kind": "選擇", "ans": [{"a": "南部粽啦，用煮的才軟，裡面要有花生、栗子、香菇、蛋黃，還有三層肉。", "r": "料那麼豐富！阿姨包粽子，一次要包幾串？"}, {"a": "鹼粽，冰冰的沾糖，夏天最好吃。", "r": "冰鹼粽沾糖，好清爽！是沾砂糖還是沾糖漿？"}, {"a": "我不會分。", "r": "不會分沒關係，好吃最重要。那您比較喜歡吃黏黏軟軟的，還是一粒一粒的？"}], "more": "端午節以前除了吃粽子，還會做什麼？"}, {"q": "您會不會包粽子？可以教我那個綁的手勢嗎？", "kind": "請教", "ans": [{"a": "會啊，兩片葉子疊起來，折成三角錐，放米、放料，再蓋米，折過來，繩子繞兩圈拉緊。", "r": "您一邊說一邊比，我好像看懂了！繞兩圈拉緊，是不是要拉很用力？"}, {"a": "手不行了，包不動了。", "r": "以前包那麼多，手辛苦了。那您用說的教我就好，第一步是做什麼？"}, {"a": "都是我婆婆包，我只負責洗粽葉。", "r": "洗粽葉也是重要的工作！粽葉要泡多久才軟？"}], "more": "包粽子那天，家裡是不是很熱鬧？"}, {"q": "您家鄉有什麼小吃，是別的地方吃不到的？", "kind": "開放", "ans": [{"a": "我們美濃的粄條，用在來米做的，切寬寬的，炒韭菜、豆芽，加油蔥，很香。", "r": "美濃粄條很有名！阿姨，粄條是自己家裡做的，還是去店裡吃？"}, {"a": "我湖南人，我們吃辣，臘肉炒青蒜，台灣人吃不慣。", "r": "臘肉炒青蒜，好有家鄉味。伯伯來台灣以後，有沒有自己做臘肉？"}, {"a": "沒什麼，都一樣。", "r": "那我問阿姨，您小時候住的地方，附近有沒有賣麵線或是碗粿？"}], "more": "第一次離開家鄉，最想念哪一個味道？"}, {"q": "以前小時候有零用錢的話，會去買什麼點心？", "kind": "回想", "ans": [{"a": "柑仔店的麥芽膏，用兩根竹籤捲，捲越久越白，還有醃李仔。", "r": "麥芽膏捲越久越白，這個好好玩！一支要多少錢？五角嗎？"}, {"a": "哪有零用錢，有一碗麵線就很高興了。", "r": "一碗麵線就很高興，那碗麵線一定很好吃。是誰帶您去吃的？"}, {"a": "我喜歡愛玉，夏天加檸檬、加冰。", "r": "愛玉加檸檬，夏天最消暑。您有看過人家洗愛玉嗎？"}], "more": "那家柑仔店或小攤子，老闆長什麼樣子？"}, {"q": "吃到古早味的時候，您心裡是什麼感覺？", "kind": "感受", "ans": [{"a": "很懷念，想到以前大家一起做粿，阿母在灶腳忙，現在都買現成的。", "r": "想到阿母在灶腳忙的樣子，那份味道是買不到的。阿母做粿的時候會跟您說什麼？"}, {"a": "沒感覺。", "r": "沒關係。那我們來看這張照片，阿姨覺得這個碗粿看起來好吃嗎？"}, {"a": "會想家，我四十年沒回去了。", "r": "四十年那麼久，一定很想念家鄉。家鄉的味道裡，您最想念哪一樣？"}], "more": "如果能請一個人一起去吃，您想請誰？"}], "care": "外省或新住民長輩聊家鄉味時可能想起回不去的故鄉與親人，先陪他想念，不要急著轉話題。粿、粽子、麻糬、麥芽膏都黏、易噎，有吞嚥困難或管灌的長輩只看照片與聊做法，絕對不要拿實物給他吃；糖尿病長輩聊甜點時不要說教，也不要私下給點心，飲食交給家屬與醫療人員決定。", "next": "拿一個粿模讓長輩摸花紋，或用毛巾、繩子比畫包粽子綁繩的手勢，一起唱〈燒肉粽〉。"}, {"id": "food-05", "cat": "飲食與料理", "title": "醃菜曬菜的好手藝", "sub": "菜脯、梅干菜、醬瓜等醃漬曬物", "lv": 2, "opener": "阿嬤，我家有一罐菜脯，是朋友的媽媽自己曬的，說放越久越黑越香。我想學怎麼做，您以前有自己曬過菜脯嗎？", "props": "一小包菜脯、梅干菜或福菜（讓長輩聞）；玻璃罐、甕的照片；竹篩曬蘿蔔的照片", "know": ["菜脯是冬天蘿蔔盛產時做的：蘿蔔切條，抹鹽壓出水，白天曬、晚上收，反覆好幾天再裝罐。放很多年變黑的叫「老菜脯」，被認為很珍貴，可以燉雞湯。", "客家人把芥菜做成一系列：先用鹽醃成酸菜（鹹菜），再曬到半乾塞進瓶甕倒放，叫福菜（覆菜）；曬到全乾就是梅干菜。梅干扣肉就是用梅干菜做的。", "醬瓜多用花胡瓜或越瓜醃，加醬油、糖，配稀飯。豆腐乳是讓豆腐長黴後加鹽、米酒、豆麴醃成，有的加辣椒或麻油。", "其他常見醃曬物還有破布子、蔭豉、鹹魚、鹹蛋、臘肉、香腸。外省家庭會醃雪裡紅、四川泡菜，做臘肉、香腸。", "以前沒有冰箱，醃漬和曬乾是保存食物的方法，所以鹽巴用得很重，長輩口味偏鹹常跟這有關。"], "qs": [{"q": "阿嬤，您聞聞看這個菜脯，是不是很熟悉的味道？", "kind": "是非", "ans": [{"a": "是啊，就是這個味，我以前每年冬天都曬一大堆，曬到整個院子都是。", "r": "曬滿整個院子，好壯觀！那時候曬幾天才會乾？"}, {"a": "好鹹的味道。", "r": "對，鹹鹹香香的。阿嬤喜歡吃菜脯嗎？炒蛋還是煮湯？"}, {"a": "不要，我不喜歡這個味道。", "r": "好，我收起來。阿嬤不喜歡菜脯，那醬瓜、豆腐乳，您比較喜歡哪一個？"}], "more": "曬菜脯最怕什麼天氣？"}, {"q": "曬菜脯第一步要做什麼？您教我。", "kind": "請教", "ans": [{"a": "蘿蔔洗乾淨，切條，撒鹽搓一搓，用石頭壓一個晚上出水，隔天拿去曬，晚上要收進來。", "r": "要用石頭壓出水，晚上還要收，好多步驟！晚上不收會怎樣？"}, {"a": "很久沒做了，忘了。", "r": "沒關係，那您記得蘿蔔是放在竹篩上曬，還是掛起來曬？"}, {"a": "我們都用買的，沒有自己做。", "r": "用買的也很方便。那阿嬤會挑哪一種，是黃黃的還是黑黑的老菜脯？"}], "more": "蘿蔔是自己種的嗎？"}, {"q": "梅干菜、福菜、酸菜，您知道它們是怎麼做的嗎？", "kind": "請教", "ans": [{"a": "我客家人當然知道，芥菜先醃成鹹菜，再曬，塞進瓶子倒過來放，就是福菜，曬到乾就是梅干菜。", "r": "原來是同一種菜變出三種！塞瓶子是要用筷子用力塞嗎？"}, {"a": "不知道，那是客家人的東西。", "r": "對，客家人很會做。那阿嬤您有吃過梅干扣肉嗎？"}, {"a": "我會做雪裡紅，我們江浙人用來炒肉絲、炒毛豆。", "r": "雪裡紅炒毛豆，好下飯！雪裡紅也是用芥菜做的嗎？"}], "more": "醃好的菜，最常拿來煮哪一道菜？"}, {"q": "以前家裡有自己做豆腐乳或醬瓜嗎？", "kind": "回想", "ans": [{"a": "有，豆腐乳要等它發霉，長白白的毛，再泡米酒、放鹽，放甕裡幾個月才能吃。", "r": "要等它長白毛，好有耐心！放甕裡的時候，怎麼知道好了沒？"}, {"a": "沒有。", "r": "沒有自己做。那家裡吃稀飯，都配什麼？"}, {"a": "我婆婆很會做，她的醬瓜脆脆的，鄰居都來要。", "r": "脆脆的醬瓜，鄰居都來要，婆婆好厲害。您有跟她學嗎？"}], "more": "那些甕和罐子，以前放在家裡哪裡？"}, {"q": "鹹魚、臘肉、香腸，您家以前做過哪一樣？", "kind": "選擇", "ans": [{"a": "香腸啊，過年前灌，掛在竹竿上曬，要顧著不要被貓叼走。", "r": "還要防貓，好好笑！香腸是用什麼灌的，有特別的工具嗎？"}, {"a": "我們討海人，鹹魚曬滿屋頂。", "r": "曬滿屋頂的鹹魚，一定很壯觀。都是曬什麼魚？"}, {"a": "都沒有，買不起肉。", "r": "那時候肉很珍貴。那家裡比較常吃的是菜脯、醬菜這些嗎？"}], "more": "現在還會想吃這些嗎？"}, {"q": "以前沒有冰箱，大家用醃、用曬來保存食物，您覺得那時候的人是不是很有智慧？", "kind": "感受", "ans": [{"a": "當然啊，什麼都不浪費，菜吃不完就醃起來，現在的年輕人都丟掉。", "r": "一點都不浪費，這是生活的智慧。阿嬤還有什麼不浪費的好辦法？"}, {"a": "那是因為窮，不得不。", "r": "是啊，是為了生活，大家才想出辦法。能撐過那段日子，真的不容易。"}, {"a": "我不知道。", "r": "沒關係。我覺得阿嬤們真的很厲害，靠一雙手就能讓食物放很久。"}], "more": "這些手藝，您希望傳給誰？"}], "care": "長輩可能會想把自己醃的東西拿給你、或叫你買來給他吃，醃漬物很鹹，高血壓、腎臟病、糖尿病的長輩要不要吃交給家屬與醫療人員，居服員只聊不供應，也不要當面說「這很不健康」。管灌或吞嚥困難的長輩可以聞味道、聊做法，但不要放進嘴裡試吃。聊到窮苦時多肯定他的手藝和撐過來的能力。", "next": "準備一張紙和蠟筆，請長輩畫出曬菜脯或醃菜的步驟，或一起把衣服、毛巾平鋪「曬太陽」。"}, {"id": "food-06", "cat": "飲食與料理", "title": "艱苦年代吃什麼", "sub": "配給、美援麵粉與一碗白米飯", "lv": 3, "opener": "伯伯，我爸爸常說他小時候能吃一碗豬油拌飯，加一點醬油，就覺得是天下最好吃的東西。您小時候，有沒有覺得哪一樣東西特別珍貴？", "props": "一個印有「中美合作」字樣的麵粉袋照片；地瓜、豬油拌飯的照片；一碗白米讓長輩摸", "know": ["二戰末期（1940 年代）日本政府實施米糧配給，加上戰爭與空襲，很多人吃不飽，番薯簽成了主食。", "1951 到 1965 年美國援助台灣（美援），送來大量麵粉、黃豆、奶粉。麵粉袋上印有中美國旗握手和「中美合作」字樣，很多人家拿來縫成內褲、衣服，是長輩常提的趣事。", "1950、60 年代政府推廣麵食，鼓勵多吃麵，加上美援麵粉，麵食在台灣更普及。眷村家庭憑眷補證每月領配給的米、油、鹽等。", "那時候白米很珍貴，很多農家種的好米要繳出去或賣掉換錢，自己吃番薯簽摻飯；雞蛋和肉多半是生病、坐月子、過年才有。", "豬油拌飯：熱飯上放一匙豬油、淋醬油，有時加一點油蔥，是很多長輩記憶中最香的一餐。"], "qs": [{"q": "伯伯，您小時候三餐都吃得飽嗎？", "kind": "是非", "ans": [{"a": "哪有吃得飽！戰爭的時候米都被拿去配給，我們吃番薯簽，連番薯葉都吃，那原本是餵豬的。", "r": "連餵豬的番薯葉都吃，那時候真的很苦。伯伯是怎麼撐過來的？"}, {"a": "還好，我們家做生意，沒有餓到。", "r": "沒有餓到，那是很好的福氣。那時候家裡做什麼生意？"}, {"a": "不想講那些。", "r": "好，我們不講那些。伯伯現在最喜歡吃的是什麼？"}], "more": "那時候家裡有幾個兄弟姊妹一起分飯？"}, {"q": "以前一碗白米飯，是不是很珍貴？", "kind": "是非", "ans": [{"a": "很珍貴，我們家種稻，好米都賣掉了，自己吃番薯簽飯，過年才吃得到白米飯。", "r": "自己種的米捨不得吃，過年才吃白米，那一碗一定特別香。過年第一口白飯是什麼感覺？"}, {"a": "對。", "r": "對，很珍貴。所以伯伯吃飯是不是都不會剩一粒米？"}, {"a": "我們眷村有配給米，雖然是糙糙的舊米，至少有。", "r": "眷村有配給，至少吃得到米。配給都是每個月去哪裡領？"}], "more": "大人有沒有說過「吃飯不能剩」的話？"}, {"q": "您有沒有聽過美援的麵粉？麵粉袋做成褲子的事？", "kind": "回想", "ans": [{"a": "有啊！上面印兩隻手握在一起，寫中美合作，我媽媽拿來縫內褲，屁股上就有字，同學都笑。", "r": "屁股上印著中美合作，好有畫面！伯伯那時候也穿過嗎？"}, {"a": "沒聽過。", "r": "沒關係，我給您看這張照片，這是以前的麵粉袋，您有看過這種布嗎？"}, {"a": "教會也有發奶粉、麵粉，我們去排隊領。", "r": "去教會排隊領奶粉，好多人都有這段記憶。領到的奶粉是怎麼泡的？"}], "more": "那些麵粉拿回家做成什麼吃？"}, {"q": "那時候覺得最好吃、最奢侈的東西是什麼？", "kind": "開放", "ans": [{"a": "豬油拌飯！熱飯放一匙豬油，淋醬油，香到現在都忘不了。", "r": "熱飯拌豬油醬油，光想就好香。那時候豬油是自己炸的嗎？"}, {"a": "一顆蛋，生病才有，我媽媽打一顆蛋煮在稀飯裡給我。", "r": "生病時媽媽煮的蛋稀飯，裡面都是愛。那一碗您還記得是什麼味道嗎？"}, {"a": "沒有什麼好吃的。", "r": "那時候真的什麼都缺。那伯伯那時候最想吃，但吃不到的是什麼？"}], "more": "現在吃到這個，還是一樣好吃嗎？"}, {"q": "家裡大人是怎麼想辦法，讓一家人吃得飽？", "kind": "請教", "ans": [{"a": "我阿母很厲害，番薯簽摻一點米，野菜去田邊摘，蝸牛、田螺也撿回來煮，一家八口都餵大了。", "r": "野菜、田螺都能變成菜，阿母真的很有本事。她都怎麼煮田螺？"}, {"a": "就省啊，大人自己少吃，給小孩吃。", "r": "大人自己少吃留給孩子，那份心好令人心疼。您後來自己當爸爸，是不是也這樣？"}, {"a": "不知道，小時候不懂。", "r": "小時候不懂很正常。那時候您在家裡最常做什麼事幫忙？"}], "more": "您後來是怎麼讓自己的孩子吃飽的？"}, {"q": "從艱苦年代走到現在，您看到孫子吃東西，心裡是什麼感覺？", "kind": "感受", "ans": [{"a": "現在的孩子太好命了，挑東挑西，我們以前有得吃就很感恩。", "r": "您吃過苦，所以特別知道珍惜。您會跟孫子講以前的故事嗎？"}, {"a": "很高興，至少他們不用像我們那樣餓肚子。", "r": "孩子不用餓肚子，是您們那一代努力換來的。真的辛苦您們了。"}, {"a": "孫子都不來看我。", "r": "孫子不常來，心裡會想念。您上次見到他們是什麼時候？那時候一起吃了什麼？"}], "more": "如果要跟年輕人說一句話，您想說什麼？"}], "care": "這個主題可能觸動戰爭、空襲、貧窮、手足早逝或逃難的記憶，長輩若說「不想講」就立刻轉到現在喜歡的食物，不要追問；若情緒激動，陪他坐一下、肯定他撐過來，必要時告訴家屬或個管師。很多長輩因此特別惜食，有糖尿病或管灌的長輩可能捨不得剩菜或吵著要吃，不要跟他爭，也不要用「你不能吃」來否定，飲食交給家屬與醫療人員；吞嚥困難的長輩不要讓他試吃白飯或任何食物。", "next": "請長輩摸一碗生米，說說「一粒米」的故事，或一起把米倒進小罐子做成沙鈴，配一首老歌搖一搖。"}, {"id": "work-01", "cat": "工作與專長", "title": "種田的好功夫", "sub": "插秧割稻曬穀，看天吃飯的智慧", "lv": 1, "opener": "阿公，我早上騎車經過田邊，看到稻子都黃了，風一吹好香喔。我是都市長大的，連秧苗怎麼插都不會，聽說你以前是種田的高手，可不可以教教我？", "props": "一把稻穗或一小袋白米（讓長輩摸、聞）、斗笠、插秧或割稻的老照片、水牛照片；可以播〈農村酒歌〉或〈天黑黑〉", "know": ["台灣中南部稻米一年兩期：一期稻大約農曆過年後到春天插秧，夏天收割；二期稻夏天插秧，秋末冬初收成。", "插秧以前全靠手工，一排人彎腰倒退著插，用秧繩或秧尺抓直線；1970 年代以後插秧機、耕耘機、割稻機才慢慢普及。", "割稻後要打穀（早期用腳踩的打穀機），再把穀子鋪在曬穀場（稻埕）用木耙翻曬，看到要下雨全家要趕快收穀。", "耕田的多半是水牛，牛是家裡最重要的幫手，很多老農到現在都不吃牛肉，就是感念牛的辛苦。", "老農看節氣做事，例如清明前後育苗、芒種前後忙插秧收割、白露以後天氣轉涼；也看天色、看雲預測下雨。"], "qs": [{"q": "阿公，你以前是不是有種過田？", "kind": "是非", "ans": [{"a": "有啊！我從十歲就跟我阿爸下田了，種了一輩子。", "r": "十歲就下田，那真的是老師傅了。小小年紀就那麼能幹，阿爸一定很倚重你。"}, {"a": "沒有啦，我們家是做小生意的。", "r": "原來是做生意的，那也很厲害。那你小時候有沒有看過別人在種田？"}, {"a": "……我忘記了。", "r": "沒關係，我們不用記得。你摸摸看這把稻穗，感覺刺刺的，還是軟軟的？"}], "more": "那時候家裡的田大不大？種的是稻子還是別的？"}, {"q": "這把稻穗你聞聞看，是不是有田裡的味道？", "kind": "感受", "ans": [{"a": "對對對，就是這個味道，割稻的時候整片田都是這個香味。", "r": "原來割稻是這種香，阿公一聞就認得，好厲害。那時候割完稻，心情是不是很好？"}, {"a": "沒什麼味道啊。", "r": "可能這把放太久了。阿公你印象中田裡是什麼味道？泥巴味還是稻香？"}, {"a": "這個刺刺的，以前割完手都會癢。", "r": "對啊，稻子的毛會讓手癢癢的，你都記得這麼清楚。那時候會怎麼辦，用水沖一沖嗎？"}], "more": "割完稻以後，家裡會不會煮什麼好料的來慶祝？"}, {"q": "插秧的時候，是往前走還是往後退？", "kind": "選擇", "ans": [{"a": "當然是往後退啊！往前走會把剛插好的踩壞，你這都不知道。", "r": "原來是倒退著插，我真的不知道，阿公你是我的老師。那要怎麼插才會一排一排那麼直？"}, {"a": "往前吧？我也不太記得了。", "r": "我也猜往前耶。阿公你是用手一把一把插下去的嗎？做給我看一下手勢好不好？"}, {"a": "插秧最累了，整天彎腰，腰都直不起來。", "r": "整天彎著腰，真的好辛苦。阿公你為了一家人吃飯，吃了好多苦。"}], "more": "一天插下來，大概可以插多少田？"}, {"q": "以前家裡有沒有養牛？那頭牛有沒有名字？", "kind": "回想", "ans": [{"a": "有一頭水牛，我們都叫牠阿黑，很乖，我放學都要去牽牠吃草。", "r": "阿黑聽起來好乖喔，你們感情一定很好。牽牛去吃草的時候，你都在旁邊做什麼？"}, {"a": "我們家沒有牛，都跟人家借的。", "r": "原來是借牛來耕田，那鄰居之間互相幫忙，感情一定不錯。借牛要怎麼回報人家？"}, {"a": "牛後來賣掉了，我很捨不得。", "r": "陪你那麼久的牛要離開，一定很難過。你很疼牠，牠也一定知道。"}], "more": "你們家的人吃不吃牛肉？"}, {"q": "阿公，種田最怕天氣怎樣？你是怎麼看天色知道要下雨的？", "kind": "請教", "ans": [{"a": "最怕颱風和曬穀的時候下西北雨。看到西邊烏雲過來、螞蟻搬家，就要趕快收穀子。", "r": "螞蟻搬家就知道要下雨，這是真本事，氣象台都沒你準。收穀子的時候全家都要衝出去嗎？"}, {"a": "就看天吃飯啊，天公伯決定的，沒辦法。", "r": "真的，種田要看天公伯的臉色，好辛苦。遇到收成不好的年，日子怎麼過？"}, {"a": "我不知道，那都是我先生在管的。", "r": "原來田裡是先生在管，那阿嬤你是不是負責煮飯、送點心到田裡？那也很重要。"}], "more": "有沒有哪一句看天氣的老話，可以教我？"}, {"q": "種了那麼多年田，你覺得自己最拿手的是哪一項？", "kind": "開放", "ans": [{"a": "我割稻最快，人家請工都要請我，一把鐮刀刷刷刷就一片。", "r": "被大家搶著請，表示你的功夫是出了名的好。阿公你養活了好多人吃的米。"}, {"a": "沒什麼拿手的，就是做而已，粗工。", "r": "阿公你太謙虛了，我們每天吃的白米飯，就是靠你們這樣一粒一粒種出來的，一點都不粗。"}, {"a": "我們客家人還種茶，我採茶很快。", "r": "原來還會採茶，好厲害。採茶要摘哪幾片葉子，可以教我嗎？"}], "more": "如果現在叫你再下田，你覺得第一件事要做什麼？"}], "care": "有些長輩因為田地被徵收、賣掉或兒女不接手而感到失落，也可能想起天災歉收、貧窮的日子。遇到時先接住感受，例如「那一定很捨不得」，肯定他養家的辛苦，不要急著轉移或說「現在比較好命」。", "next": "煮一小鍋白飯，請長輩聞新米香、教你怎麼看米好不好；或請他示範插秧、割稻的手勢，一起做幾次當作手部活動。"}, {"id": "work-02", "cat": "工作與專長", "title": "做工撐起一個家", "sub": "工廠、工地、礦坑、碼頭的打拚歲月", "lv": 2, "opener": "阿姨，我看到你的手好巧，針線收得好漂亮。我聽說以前很多人年輕的時候都在工廠做過，像加工出口區、成衣廠，你以前是不是也有出去做工？", "props": "一件成衣或一團毛線、一頂工地安全帽、高雄加工出口區女工下班騎腳踏車的老照片、礦工頭燈或礦坑照片；可以播〈孤女的願望〉", "know": ["高雄加工出口區 1966 年成立，是亞洲第一個加工出口區，之後還有楠梓、台中潭子。下班時成千上萬的女工騎腳踏車湧出大門，是那個年代的經典畫面。", "1960 到 80 年代台灣紡織、成衣、電子、塑膠、雨傘、玩具外銷很興盛，很多鄉下年輕女孩十幾歲就到城市做工、住工廠宿舍，薪水寄回家給弟妹讀書。", "早期基本工資很低，例如 1968 年每月 600 元，1978 年調到 2,400 元；工廠常要加班、論件計酬。", "北部瑞芳、猴硐、平溪、三峽一帶以前有很多煤礦，礦工工作危險；1984 年接連發生土城海山、三峽煤山等多起重大礦災。", "建築工地有綁鋼筋、搭鷹架、泥水、木工等專業，不少原住民長輩年輕時在都市做鷹架、綁鋼筋或跑遠洋漁船；基隆、高雄港的碼頭工人負責扛貨、裝卸。"], "qs": [{"q": "阿姨，你年輕的時候有沒有出去工廠做過工？", "kind": "是非", "ans": [{"a": "有啊，我十五歲就去高雄加工區做衣服，住宿舍，一個房間住八個人。", "r": "十五歲就出門賺錢，好勇敢喔。一個房間住八個，那晚上一定很熱鬧，大家會聊什麼？"}, {"a": "沒有，我都在家裡。", "r": "在家裡顧家也是一份大工作。那你家附近有沒有人去工廠上班？"}, {"a": "做什麼工？我不知道你在說什麼。", "r": "是我問得太突然了。阿姨你看這件衣服，這種扣子是不是要一顆一顆縫？"}], "more": "那時候是怎麼找到這份工作的？誰帶你去的？"}, {"q": "那時候在工廠，是做衣服、做電子，還是做別的？", "kind": "選擇", "ans": [{"a": "我是車縫的，一天要車幾百件，手腳都要很快，領班還會計件。", "r": "一天幾百件，那手腳真的是一流。可以教我車縫的時候手要怎麼推布嗎？"}, {"a": "我是做電子的，焊那個小小的零件，眼睛都看花了。", "r": "那麼小的零件都焊得好，眼力和耐心都要很好。那時候做的是收音機還是電視的零件？"}, {"a": "做什麼都一樣，就是做到很累。", "r": "聽起來真的好累，每天這樣撐下來不容易。那時候累的時候，都靠什麼撐過去？"}], "more": "工廠裡面有沒有很好的姊妹淘？"}, {"q": "伯伯，你以前是做什麼粗重的工作嗎？工地、礦坑還是碼頭？", "kind": "回想", "ans": [{"a": "我在瑞芳挖煤挖了二十年，下去就黑漆漆，上來整張臉都是黑的。", "r": "在礦坑裡做二十年，那是拿命在拚。伯伯你下去的時候都怎麼保護自己？"}, {"a": "我是綁鋼筋的，台北好多大樓都是我們綁起來的。", "r": "哇，原來台北的大樓有你的功勞。哪一棟你最有印象，經過的時候會不會特別驕傲？"}, {"a": "不要講那個啦，很苦。", "r": "好，那段一定很辛苦，我們不講細節。伯伯你辛苦了，一家人都是靠你撐起來的。"}], "more": "那時候中午都吃什麼便當？"}, {"q": "第一次領到工廠薪水的時候，你是怎麼用的？", "kind": "回想", "ans": [{"a": "全部寄回家啊，弟弟妹妹要繳學費，我自己只留一點點買肥皂。", "r": "自己只留一點點，把錢都給家裡，阿姨你好疼弟妹。他們現在一定很感謝你這個大姊。"}, {"a": "我買了一雙皮鞋，那是我第一雙皮鞋。", "r": "第一雙皮鞋，一定捨不得穿吧。那雙鞋是什麼顏色的？"}, {"a": "不記得了，太久了。", "r": "幾十年前的事，不記得很正常。那你記不記得，領薪水是領現金還是裝在信封袋裡？"}], "more": "那時候一個月薪水大概多少，你還記得嗎？"}, {"q": "做了那麼久，有什麼是只有老師傅才知道的訣竅，可以教我嗎？", "kind": "請教", "ans": [{"a": "搭鷹架腳要踩穩，眼睛不要往下看，看你要扣的那個地方就好。", "r": "眼睛看要扣的地方，不往下看，這真的是老師傅才會講的話。我記起來了。"}, {"a": "車線的時候線不能拉太緊，不然布會縮，這是領班教我的。", "r": "線不能太緊，原來有這個學問。你那時候是不是很快就學會，後來還教新來的？"}, {"a": "沒有什麼訣竅，就是吃苦。", "r": "肯吃苦就是最大的本事。阿伯你那時候一天做幾個鐘頭？"}], "more": "你有沒有帶過徒弟或新人？"}, {"q": "回頭看那段做工的日子，你覺得自己最驕傲的是什麼？", "kind": "感受", "ans": [{"a": "靠我做工，把三個孩子都養大，還讓他們讀到大學。", "r": "三個孩子都讀到大學，這就是你最大的成績單。阿姨你真的很了不起。"}, {"a": "有什麼好驕傲的，就是做苦工的。", "r": "伯伯，台灣能夠變好，就是靠你們這些人一天一天做出來的，我真的覺得很了不起。"}, {"a": "我們那一班的女工到現在還有聯絡，每年聚會。", "r": "幾十年的姊妹情，好珍貴。你們聚會的時候都聊什麼？"}], "more": "如果孫子問你年輕時做什麼，你會怎麼跟他說？"}], "care": "礦災、工地意外、職業傷害或被老闆欺負的記憶可能很沉重，也有人因為很小就輟學做工而感到遺憾。長輩說「不要講」就尊重，改成肯定他的付出；身上有舊傷或職業病時，只要表達心疼，不給醫療建議。", "next": "請長輩教你摺衣服、縫一顆扣子或捲毛線，讓他示範當年手腳俐落的功夫；也可以一起唱〈孤女的願望〉。"}, {"id": "work-03", "cat": "工作與專長", "title": "做生意的頭腦", "sub": "柑仔店、市場攤、算盤記帳與老客人", "lv": 2, "opener": "阿嬤，我昨天去市場買菜，老闆一邊秤一邊心算，好快喔，我還在按手機計算機。聽說你以前也有做生意，那時候是怎麼算錢的？可不可以教我兩招？", "props": "一把算盤（讓長輩撥）、老式桿秤或磅秤照片、一本帳簿或筆記本、柑仔店的玻璃罐糖果照片、幾個銅板", "know": ["柑仔店是巷口的雜貨店，賣米、油、鹽、醬油、火柴、肥皂、糖果、汽水，很多東西用玻璃罐裝、論斤秤賣；熟客可以先賒帳，記在簿子上月底再還。", "以前秤東西用台斤，一台斤是 600 公克，十六兩為一斤，所以有「半斤八兩」這句話。", "算盤是做生意和記帳的必備工具，學校也教珠算，還有珠算檢定，很多長輩撥算盤比按計算機還快。", "傳統市場天還沒亮就要去批貨，賣菜、賣魚、賣豬肉、賣布、賣衣服的攤子各有地盤，攤販之間常常彼此照應、交換東西。", "外省長輩可能做過麵食、饅頭、牛肉麵或修鞋、修傘的小生意；客家長輩常見米食、醃菜或雜貨的買賣。"], "qs": [{"q": "阿嬤，你以前是不是有做生意？開店還是擺攤？", "kind": "選擇", "ans": [{"a": "我在菜市場賣菜賣了三十年，三點就要起來去批菜。", "r": "三點起床，三十年都這樣，阿嬤你好拚。那時候是誰幫你顧小孩？"}, {"a": "我們家開柑仔店，什麼都賣。", "r": "開柑仔店，那小孩子最喜歡你們家了吧。店裡賣得最好的是什麼？"}, {"a": "我沒有做生意，我只會買東西。", "r": "會買東西也是一門學問，殺價一定很厲害。阿嬤你買菜都怎麼挑最新鮮的？"}], "more": "店或攤子在哪裡？那條街現在還在嗎？"}, {"q": "這個算盤你還會撥嗎？可不可以算給我看？", "kind": "請教", "ans": [{"a": "會啊，你看，上面一顆是五，下面一顆是一，這樣撥就好了。", "r": "上面一顆是五，下面是一，我懂了。阿嬤你手好快，這是從小練的嗎？"}, {"a": "很久沒撥了，手不靈光了。", "r": "沒關係，我們隨便撥撥看，聽聽這個喀喀的聲音就好。這聲音熟不熟悉？"}, {"a": "我不會算盤，我都心算。", "r": "心算更厲害耶。那我考考自己，三斤菜一斤十五塊是多少，阿嬤你幫我看對不對。"}], "more": "你是跟誰學算盤的？"}, {"q": "以前客人買東西沒帶錢，可以先欠著嗎？", "kind": "是非", "ans": [{"a": "可以啊，都記在簿子上，月底領薪水再來還，大家都是厝邊。", "r": "記在簿子上，靠的是信用和人情。有沒有人一直沒來還的？"}, {"a": "不行，小本生意，欠了我也沒錢進貨。", "r": "對，小本生意每一塊錢都很重要，阿嬤你很有原則，才能把生意做下去。"}, {"a": "嗯……我不知道。", "r": "沒關係，我是好奇隨便問。那阿嬤你記不記得，店裡的糖果是裝在罐子裡嗎？"}], "more": "那本帳簿現在還留著嗎？"}, {"q": "做生意這麼多年，有沒有讓你印象很深的老客人？", "kind": "回想", "ans": [{"a": "有一個老伯每天早上都來買一包菸一瓶米酒，買了十幾年，後來沒來了，我還去他家看他。", "r": "每天見面十幾年，已經像家人一樣了。你去看他，他一定很感動。"}, {"a": "客人很多，記不起來。", "r": "客人那麼多，記不住很正常，表示阿嬤生意很好。那你最喜歡哪一種客人？"}, {"a": "有些客人很難纏，一直殺價。", "r": "遇到難纏的客人真的很累。阿嬤你都怎麼應付？說來教教我。"}], "more": "有沒有小孩子拿著零錢來買糖果的？"}, {"q": "阿嬤，做生意要怎麼招呼客人，客人才會一直回來？", "kind": "請教", "ans": [{"a": "要誠實，秤要給足，有時候多抓一把蔥送他，他就記得你。", "r": "多送一把蔥，客人就記得你，這就是做生意的人情味。我記起來了。"}, {"a": "嘴巴要甜，看到人就叫。", "r": "嘴巴甜、會叫人，難怪客人喜歡你。阿嬤你都怎麼叫客人？叫一次給我聽。"}, {"a": "我不會講話，客人來就賣，賣完就收。", "r": "不多話、老老實實做生意，客人反而放心。你們家的東西一定很實在。"}], "more": "有沒有什麼做生意的忌諱或老規矩？"}, {"q": "回想做生意的日子，你覺得最開心的是什麼時候？", "kind": "感受", "ans": [{"a": "過年前最好賣，一天賣好幾天的量，晚上數錢數到手軟。", "r": "數錢數到手軟，聽起來好有成就感。那年過年是不是特別豐盛？"}, {"a": "沒什麼開心的，就是賺錢養家。", "r": "為了養家一直撐著，阿嬤你真的辛苦了。家裡的孩子都是靠你這個攤子養大的吧。"}, {"a": "收攤以後跟隔壁攤的姊妹一起吃麵，最開心。", "r": "收攤後一起吃碗麵，好溫暖的畫面。那時候常吃哪一家？"}], "more": "如果現在讓你再開一間店，你想賣什麼？"}], "care": "有些長輩生意曾經失敗、被倒帳、被倒會或因為都市更新收攤，可能會有怨氣或失落。不要追問損失細節，先肯定他撐過來的韌性；講到錢的事情不評論對錯。", "next": "拿幾個銅板和小東西玩「開店」遊戲，請長輩當老闆幫你算錢找零；或請他教你撥算盤做一題加法。"}, {"id": "work-04", "cat": "工作與專長", "title": "持家的大功夫", "sub": "洗衣縫補帶小孩，精打細算的主婦學", "lv": 1, "opener": "阿嬤，我家的襪子破了一個洞，我縫了半天還是醜醜的。你以前一個人管一整個家，洗衣煮飯帶小孩，一定有很多撇步，可不可以教教我？", "props": "一件破洞襪子和針線、洗衣板或洗衣板照片、一塊肥皂、一塊尿布布或手帕、大同電鍋照片；可以播〈搖嬰仔歌〉", "know": ["早期沒有洗衣機，主婦用洗衣板、肥皂手洗，或到河邊、井邊、公共洗衣場洗；洗衣機大約 1960 年代後期才開始進到家庭，一開始很多是單槽要手動脫水。", "以前衣服是補了又補，襪子破洞用燈泡或木頭撐著來縫，大孩子的衣服改給小的穿；很多婦女會用縫紉機幫全家做衣服。", "嬰兒用布尿布，用舊衣服或布裁的，洗了再曬、曬了再用；家裡孩子多，大的背小的很常見。", "大同電鍋 1960 年推出，是很多家庭的第一台電器；在那之前用灶燒柴、燒煤球煮飯。", "主婦精打細算：買便宜的菜、醃菜曬菜脯存糧、存零錢、跟會；客家婦女以勤儉持家出名，外省媽媽常自己做麵食、包餃子。"], "qs": [{"q": "阿嬤，你以前洗衣服是用手洗的嗎？", "kind": "是非", "ans": [{"a": "對啊，一大家子十幾個人的衣服，蹲在河邊洗一整個早上，冬天手都凍裂。", "r": "十幾個人的衣服，還要在冷水裡洗，阿嬤你的手好辛苦。那時候大家都在河邊一起洗嗎？"}, {"a": "後來就有洗衣機了。", "r": "有洗衣機一定輕鬆很多。阿嬤你記不記得家裡第一台洗衣機是什麼樣子？"}, {"a": "我不記得。", "r": "沒關係。你摸摸看這塊肥皂，聞起來香不香？以前是不是用這種洗衣服？"}], "more": "洗衣服有沒有什麼把衣服洗得特別白的祕訣？"}, {"q": "這隻襪子破了一個洞，你可以教我怎麼縫比較好看嗎？", "kind": "請教", "ans": [{"a": "你這樣不行，要先在裡面撐一個東西，然後一針一針來回織過去，像織網一樣。", "r": "原來要撐住再像織網一樣縫，阿嬤你是專家耶。我拿著，你看我這樣對不對？"}, {"a": "我眼睛看不到了，沒辦法穿針。", "r": "針我來穿，阿嬤你在旁邊指揮我就好，你說怎麼縫我就怎麼縫。"}, {"a": "破了就丟掉，現在誰在補襪子。", "r": "哈哈，現在的人真的比較少補了。那以前的人是不是什麼都捨不得丟？"}], "more": "以前有沒有幫孩子做過衣服？"}, {"q": "你帶過幾個孩子？那時候是怎麼帶的？", "kind": "回想", "ans": [{"a": "我生了六個，大的背小的，我一邊揹一個一邊煮飯。", "r": "六個孩子，一邊揹一邊煮飯，阿嬤你真的是女超人。那時候最累的是哪個時期？"}, {"a": "我沒有孩子。", "r": "謝謝阿嬤跟我說。那你有沒有幫忙帶過姪子、外甥或鄰居的孩子？"}, {"a": "孩子都大了，現在都不在身邊。", "r": "孩子們長大各自忙，阿嬤會想念他們吧。你最常想起哪一個孩子小時候的樣子？"}], "more": "以前孩子哭鬧，你都怎麼哄？會唱什麼歌？"}, {"q": "以前錢不多，你是怎麼把一個家打理好的？", "kind": "請教", "ans": [{"a": "買菜都買收攤前的便宜菜，自己醃菜脯、曬鹹菜，一個月的錢分成幾包，每包用在哪都分好。", "r": "把錢分成幾包，每一包有用途，這就是最早的理財法。阿嬤你比銀行還會管錢。"}, {"a": "錢都是先生在管，我不知道。", "r": "原來是先生管錢，那阿嬤你負責的是什麼？煮飯和照顧大家，一樣很重要。"}, {"a": "有時候真的沒錢，只能跟人家借。", "r": "那時候日子真的很緊，阿嬤你還是撐下來了，很了不起。那時候是誰幫你最多？"}], "more": "有沒有一道菜是便宜又好吃，可以餵飽全家的？"}, {"q": "家裡第一台電器是什麼？電鍋、電視還是電扇？", "kind": "選擇", "ans": [{"a": "是大同電鍋！以前要燒柴煮飯，有電鍋以後按下去就好了，好方便。", "r": "從燒柴到按一下就有飯，這是很大的改變。那台電鍋是什麼顏色？用了多久？"}, {"a": "是電視，全村的人都來我們家看。", "r": "全村都來你家看電視，那時候你們家很熱鬧喔。大家都看什麼節目？"}, {"a": "我們家很晚才有電，什麼都沒有。", "r": "沒有電的時候，晚上都點什麼照明？油燈還是蠟燭？"}], "more": "有了電器以後，你多出來的時間都做什麼？"}, {"q": "管了一輩子的家，你覺得自己最厲害的地方是什麼？", "kind": "感受", "ans": [{"a": "我把每個孩子都養得白白胖胖的，沒有一個走歪路。", "r": "每一個孩子都教得那麼好，這是阿嬤一生最大的功勞。"}, {"a": "沒什麼厲害的，女人本來就是做這些。", "r": "阿嬤，持家是一份全年無休的工作，一點都不簡單。我做一天就累壞了，你做了一輩子。"}, {"a": "我很會煮，過年的菜都是我一個人包辦。", "r": "一個人包辦過年的菜，太厲害了。你最拿手的年菜是哪一道？"}], "more": "如果要教年輕媳婦一件持家的事，你會教什麼？"}], "care": "家務工作常被認為「沒什麼」，有些長輩會自我貶低，要明確肯定這是一份專業。也可能觸動婆媳委屈、喪子或孩子不常回來的思念；聽到時先接住情緒，不評論家人。", "next": "一起摺衣服、配襪子，或請長輩教你縫一顆扣子，你穿針、他指導；也可以一起唱一段搖嬰仔歌。"}, {"id": "work-05", "cat": "工作與專長", "title": "軍公教的光榮歲月", "sub": "當兵、教書、公務員、警察與軍旅", "lv": 2, "opener": "伯伯，我看你坐得好挺，一看就是當過兵、受過訓練的人。我兒子明年要去當兵，緊張得要命，你以前當兵是在哪裡？可以跟我說說當時的樣子嗎？", "props": "一頂軍帽或老軍裝照片、哨子、教室黑板和粉筆、舊公文或印章、〈軍中情歌〉或〈我現在要出征〉的歌曲、外省伯伯的家鄉地圖", "know": ["以前台灣男生滿 20 歲要服義務役，1950 到 1990 年代陸軍大約兩年、海軍空軍大約三年，入伍前要抽籤，抽到金門、馬祖等外島俗稱「金馬獎」。", "1949 年前後大批國軍隨政府來台，很多外省伯伯十幾歲就離家從軍，住在眷村，退伍後成為榮民，有的到退輔會的農場、工程處或公路局工作。", "1987 年政府開放赴大陸探親，許多外省伯伯分離四十年才第一次回老家，有的父母已經不在了。", "早期老師多由師範學校培養，1968 年實施九年國民教育，國中大量增班，很多老師一個班要教五、六十個學生；當時也有代課老師、校長、工友等職位。", "公務員、警察、郵差、鐵路局、公路局、台電、台糖等公家單位工作被稱為「鐵飯碗」，穩定但薪水不高，常要輪調到偏遠地方。"], "qs": [{"q": "伯伯，你以前是當兵、教書，還是在公家機關做事？", "kind": "選擇", "ans": [{"a": "我是職業軍人，從山東跟部隊過來，當了二十幾年兵。", "r": "二十幾年的軍旅，伯伯你是老長官了。從山東過來，那時候你才幾歲？"}, {"a": "我是國小老師，教了三十五年。", "r": "教了三十五年，教過的學生一定好幾千個，老師好。你最喜歡教哪一科？"}, {"a": "我沒有，我是做生意的。", "r": "做生意也很厲害。那伯伯有沒有當過兵？當兵是在哪裡？"}], "more": "那時候為什麼會選這個工作？"}, {"q": "當兵的時候，有沒有抽到外島？", "kind": "是非", "ans": [{"a": "有啊，我抽到金門，坐船坐到吐，在碉堡裡待了兩年。", "r": "抽到金馬獎，坐船還暈到吐，真的辛苦。在金門那兩年，最難忘的是什麼？"}, {"a": "沒有，我在台灣本島，新訓在成功嶺。", "r": "成功嶺新訓，很多人都說那裡很操。伯伯你那時候受得了嗎？"}, {"a": "我沒當過兵，女生不用當。", "r": "對，阿嬤是女生不用當。那家裡的先生或兄弟有人去當兵嗎？你有寫信給他嗎？"}], "more": "那時候放假都怎麼回家？"}, {"q": "我兒子要去當兵，你可以教他幾招怎麼在部隊過得好嗎？", "kind": "請教", "ans": [{"a": "跟他說動作要快，棉被要摺成豆腐乾，長官講話不要頂嘴，跟同梯的打好關係。", "r": "棉被摺成豆腐乾，跟同梯打好關係，這個我回去一定跟他說。伯伯你那時候摺得很漂亮吧？"}, {"a": "現在當兵很輕鬆啦，跟我們那時候不能比。", "r": "你們那時候真的辛苦多了。伯伯，你們那時候一天的操練是怎樣？"}, {"a": "我不記得了。", "r": "幾十年前了，不記得沒關係。伯伯，你聽到起床號的聲音還會不會反射性跳起來？"}], "more": "部隊裡有沒有到現在還有聯絡的朋友？"}, {"q": "老師，你教過的學生裡，有沒有讓你印象最深的？", "kind": "回想", "ans": [{"a": "有一個很皮的孩子，後來當醫生，現在每年過年都還打電話給我。", "r": "最皮的孩子當了醫生，每年還記得打電話給你，這就是當老師最大的回報吧。"}, {"a": "太多了，名字都忘記了。", "r": "教了那麼多學生，記不住很正常。老師，你記不記得那時候一班有幾個人？"}, {"a": "有一個學生家裡很窮，後來沒來讀了，我一直很掛心。", "r": "你到現在還掛心那個學生，可見你是很疼學生的老師。那時候你有去他家看過嗎？"}], "more": "那時候學生最怕你什麼？"}, {"q": "伯伯，你老家在哪裡？那裡有什麼好吃的？", "kind": "開放", "ans": [{"a": "在湖南，我們那裡吃辣，臘肉最香，我娘做的臘肉天下第一。", "r": "媽媽做的臘肉天下第一，聽了我都餓了。伯伯你自己會做嗎？教我好不好？"}, {"a": "回不去了，爹娘都不在了。", "r": "離開家那麼久，爹娘都不在了，伯伯心裡一定很想念。你想到他們的時候，最常想起什麼樣子？"}, {"a": "我是本地人，就在這附近。", "r": "原來伯伯是在地人，那這附近以前的樣子你最清楚了。以前這裡是田還是房子？"}], "more": "開放探親以後，你有回去過嗎？"}, {"q": "你為國家、為大家做了那麼多年，你覺得最光榮的一件事是什麼？", "kind": "感受", "ans": [{"a": "我當警察抓過一個搶匪，報紙還有登，局長頒獎給我。", "r": "上過報紙還被局長頒獎，伯伯你是英雄耶。那時候抓搶匪怕不怕？"}, {"a": "沒什麼光榮，就是領死薪水。", "r": "伯伯，你這麼多年守著崗位，就是很多人能安心過日子的原因，我覺得很光榮。"}, {"a": "我把一輩子都給了部隊，問我光榮，我也說不上來。", "r": "把一輩子都給了部隊，這份付出本身就很重。伯伯你辛苦了，謝謝你。"}], "more": "有沒有留下獎狀、勳章或老照片，可以給我看看？"}], "care": "外省伯伯可能觸動戰爭、逃難、和家人分離四十年的傷痛，也可能有政治立場或歷史事件的情緒；不要討論政治、不評論對錯，只陪伴他的思鄉與失落。退休後覺得自己「沒用了」的長輩，要多肯定他過去的貢獻。", "next": "請伯伯教你軍中的立正、敬禮或摺棉被；請老師在白板寫幾個字教你，或一起唱一首軍歌、老校歌。"}, {"id": "work-06", "cat": "工作與專長", "title": "第一份薪水的記憶", "sub": "月薪多少、交給家裡、存錢與跟會", "lv": 3, "opener": "阿公，我第一份薪水才兩萬多，領到的時候高興得請全家吃飯。你還記不記得，你人生第一份薪水是多少？那時候一碗麵多少錢？", "props": "幾張舊鈔或硬幣照片（例如五角、一元、十元）、紅色薪水袋或信封、撲滿、存摺、老物價對照表", "know": ["1949 年台灣幣制改革，舊台幣四萬元換新台幣一元；長輩小時候可能還記得用過舊台幣、物價很亂的時期。", "早期薪水多半領現金，裝在薪水袋裡，很多年輕人領到原封不動交給父母，再拿一點零用錢。", "基本工資的參考：1968 年每月 600 元、1978 年 2,400 元，到 1990 年代才超過一萬元；不同行業薪水差很多，只當參考。", "「跟會」是民間互助儲蓄：會頭找一群人每月出錢，想先用錢的人出利息「標會」，已經標過的叫「死會」，還沒標的叫「活會」；會頭捲款就是「倒會」，以前常聽說。", "以前小孩子會用竹筒或陶土撲滿存零錢，郵局存摺也很普遍；物價記憶因地區和年代差很多，長輩說的數字不用糾正。"], "qs": [{"q": "阿公，你還記不記得人生第一份薪水是多少錢？", "kind": "回想", "ans": [{"a": "我第一份在台北當學徒，一個月一百多塊，包吃包住啦。", "r": "一百多塊還包吃包住，阿公那時候很年輕就出來打拚了。是做哪一行的學徒？"}, {"a": "那麼久誰記得。", "r": "對啊，幾十年前的事。那阿公記不記得，那時候拿到錢是裝在紅紙袋還是信封裡？"}, {"a": "我沒有領過薪水，都在家裡幫忙沒有錢。", "r": "在家裡幫忙做得那麼多，雖然沒有領薪水，這份功勞一樣很大。那時候家裡誰給你零用錢？"}], "more": "那時候覺得這筆錢多不多？"}, {"q": "第一份薪水，是交給家裡，還是自己留著？", "kind": "選擇", "ans": [{"a": "整包交給我媽，連拆都沒拆，她再給我十塊錢零用。", "r": "整包交給媽媽，連拆都沒拆，阿公你好孝順。媽媽拿到的時候說了什麼？"}, {"a": "我自己留一點，偷偷買了一支手錶。", "r": "第一支手錶，那一定很寶貝。那支手錶是什麼牌子？戴到什麼時候？"}, {"a": "家裡欠債，薪水一下就沒了。", "r": "那時候家裡的擔子很重，阿嬤你一定很辛苦。你很年輕就幫忙扛起一個家。"}], "more": "那時候的零用錢，你都拿去買什麼？"}, {"q": "那時候一碗陽春麵、一張電影票，大概多少錢？", "kind": "開放", "ans": [{"a": "一碗麵兩三塊吧，看電影好像五塊，看一場要存好久。", "r": "看一場電影要存好久，所以每一次都特別珍惜吧。你最記得看過哪一部片？"}, {"a": "我不知道，我都沒在外面吃。", "r": "捨不得在外面吃，都回家吃，那時候大家都很省。家裡最常煮什麼？"}, {"a": "錢跟現在不能比啦，那時候一塊錢很大。", "r": "真的，那時候一塊錢可以買不少東西。阿嬤你說一塊錢可以買什麼？"}], "more": "有沒有什麼東西，你覺得以前比現在還貴？"}, {"q": "阿嬤，你以前有沒有跟過會？可以教我跟會是怎麼算的嗎？", "kind": "請教", "ans": [{"a": "有啊，十個人一個月各出一千，要用錢的就出利息去標，標最高的拿走，我還當過會頭。", "r": "還當過會頭，那是大家很信任你才能做的。標會的時候是寫在紙上偷偷比嗎？"}, {"a": "我被倒過會，幾萬塊就這樣沒了。", "r": "辛苦存的錢一下就沒了，那時候一定很難過、很氣。阿嬤你後來是怎麼走過來的？"}, {"a": "什麼是跟會？我沒聽過。", "r": "就是一群人每個月一起存錢、輪流用。沒跟過也沒關係，那阿嬤以前都怎麼存錢？放撲滿還是存郵局？"}], "more": "那時候跟會的錢，最後拿去做什麼用？"}, {"q": "你這輩子靠自己存錢，買過最大、最有成就感的東西是什麼？", "kind": "回想", "ans": [{"a": "買了一間房子，雖然很小，但是是自己的，搬進去那天我哭了。", "r": "搬進自己的房子那天哭了，那是多少年的辛苦換來的。阿公你真的很了不起。"}, {"a": "買了一台機車，載老婆去兜風。", "r": "用自己的錢買機車載太太去兜風，好浪漫喔。第一次載她是去哪裡？"}, {"a": "沒有存到什麼錢，賺的都花在孩子身上了。", "r": "錢都花在孩子身上，孩子就是你最大的財產。他們現在過得好，就是你存下來的。"}], "more": "那時候為了存這筆錢，省了些什麼？"}, {"q": "如果要給現在的年輕人一句關於錢的建議，你會說什麼？", "kind": "感受", "ans": [{"a": "賺一塊要存五毛，不要借錢給別人，也不要跟人家借。", "r": "賺一塊存五毛，這句我要寫下來。阿公這是一輩子的經驗換來的。"}, {"a": "錢夠用就好，身體和家人比較重要。", "r": "錢夠用就好，家人比較重要，阿嬤這句話很有智慧。你覺得自己這輩子最珍貴的是什麼？"}, {"a": "年輕人不會聽啦，講了也沒用。", "r": "哈哈，年輕人有時候真的聽不進去。不過我很想聽，阿伯你就當作教我一個人。"}], "more": "這句話，你以前有沒有跟自己的孩子說過？"}], "care": "談錢容易觸動貧窮、欠債、被倒會、家人爭財產或擔心現在沒錢的焦慮。不要追問存款、財產或金額細節，也不給理財建議；長輩說的物價數字和事實不符時不用糾正，重點是聽他的努力和心情。", "next": "拿幾種新舊硬幣請長輩分辨、排排看大小，或一起用撲滿投幾個銅板，聊聊小時候存錢買過的第一樣東西。"}, {"id": "life-01", "cat": "家庭與人生", "title": "當年怎麼結婚的", "sub": "媒人、相親、聘金嫁妝和婚禮那天", "lv": 2, "opener": "阿嬤，我昨天翻到我爸媽的結婚照，黑白的，我媽穿一件白紗，頭上插好多花，我看了一直笑。您那時候結婚，是媒人介紹的，還是自己看對眼的？", "props": "一張早年黑白結婚照（可請家屬提供長輩自己的）、一把扇子、一包喜餅或冬瓜糖、一顆紅湯圓的照片、播〈素蘭小姐要出嫁〉或〈媽媽請你也保重〉", "know": ["1950到70年代台灣多數婚姻靠媒人牽線，先「相親」見面，男方家長常會到女方家看環境，女方端茶出來給大家看，叫「看新娘」或「端茶相親」。", "閩南訂婚常講「六禮」或「十二禮」，送的有聘金、喜餅、豬肉、糖果、布料、金飾等，女方會退回一部分聘金表示不是賣女兒；聘金多少依家境差很多。", "嫁妝隨年代變：早年是棉被、衣櫃、腳踏車，1960到70年代流行縫紉機、電鍋、電視、電冰箱，大件嫁妝會用車子載著遊街讓人看。", "迎娶時新娘出門要撐黑傘或米篩遮頭，上車後從窗口丟扇子，意思是「放性地」，把壞脾氣留在娘家；早年鄉下用花轎或三輪車、牛車，後來改成租轎車。", "外省長輩常是來台後才成家，早期現役軍人結婚受到法規限制，很多老兵年紀較大才娶妻，也有娶本省或原住民太太的，婚禮可能只在部隊或眷村簡單請幾桌。"], "qs": [{"q": "阿嬤，您結婚那天，是穿白紗，還是穿紅色的衣服？", "kind": "選擇", "ans": [{"a": "穿白紗啦，跟照相館租的，裙子很長，走路要人家幫我拉，那時候覺得自己好漂亮。", "r": "租白紗還要人幫忙拉裙擺，那天阿嬤一定是全村最亮眼的。照相館是在哪裡啊？"}, {"a": "紅色的啦，我們那時候哪有什麼白紗，穿一件紅衫就嫁了。", "r": "紅衫多喜氣啊，簡單也很好看。那件紅衫是自己做的，還是人家送的？"}, {"a": "不記得了，那麼久了誰記得。", "r": "對啊，六七十年前的事了，記不清很正常。阿嬤您現在看喜歡哪一個顏色，紅的還是白的？"}], "more": "那天頭髮是誰幫您梳的？"}, {"q": "伯伯，您跟阿姨當初是怎麼認識的？媒人介紹，還是自己認識的？", "kind": "回想", "ans": [{"a": "媒人介紹的啦，我去她家相親，她端茶出來，手都在抖，我一看就喜歡，回去就跟我媽說要這個。", "r": "哇，端個茶就被您看上了，伯伯眼光很準耶。那阿姨那時候有偷偷看您嗎？"}, {"a": "我們是在工廠認識的，她在隔壁那條線，下班常常一起走路回宿舍。", "r": "原來是同事走出來的感情，天天一起走路回家，很浪漫耶。是什麼工廠啊？"}, {"a": "沒什麼好講的，就家裡安排的，也沒問我要不要。", "r": "那個年代很多都是家裡做主，自己沒什麼選擇，聽起來不太容易。那您第一次看到她，是什麼時候？"}], "more": "第一次見面，您記得對方穿什麼嗎？"}, {"q": "以前訂婚要送聘金、喜餅，您家那時候有收到哪些東西？", "kind": "回想", "ans": [{"a": "有啊，喜餅送了好幾擔，還有豬腳、冬瓜糖、金戒指，我媽把喜餅分給全村的人，大家都知道我要嫁了。", "r": "喜餅分全村，那時候真的是大事一件。阿嬤記得那個喜餅是什麼口味嗎？"}, {"a": "我們家窮，哪有什麼聘金，我是嫁過去才知道他們家也很窮。", "r": "兩家都不容易，還是一起把日子過起來，這很了不起。剛嫁過去那時候住哪裡？"}, {"a": "我們原住民不是這樣啦，是男生來我們家做工，做得好才可以。", "r": "原來是要先來做工表現給家裡看，這個習俗好特別。阿姨可以教我，男生來要做什麼工嗎？"}], "more": "那時候的嫁妝，您最寶貝的是哪一樣？"}, {"q": "阿公，您結婚那天，新娘是怎麼接過來的？坐花轎、三輪車，還是汽車？", "kind": "選擇", "ans": [{"a": "坐三輪車啦，前面還有人吹鼓吹，一路吹到我家，小孩子在後面一直追。", "r": "有吹鼓吹又有小孩追著跑，好熱鬧喔。阿公那時候是坐在前面帶路，還是在家裡等？"}, {"a": "走路的啦，她家就在隔壁庄，走一走就到了。", "r": "走路娶新娘，好有人情味，一路上大家都看得到。那天天氣好不好？"}, {"a": "嗯？什麼車？", "r": "沒關係，我是說阿公結婚那天。您看這張照片，這個是三輪車，阿公以前有坐過嗎？"}], "more": "新娘上車的時候，有沒有丟扇子？"}, {"q": "婚禮那天有辦桌嗎？您還記得吃了什麼好料？", "kind": "感受", "ans": [{"a": "有啊，在三合院埕前面搭棚子，請了二三十桌，有魷魚螺肉蒜、紅蟳米糕，那時候一年吃不到幾次這麼好的。", "r": "紅蟳米糕耶，光聽就流口水。那天阿嬤當新娘，自己有吃到嗎，還是忙著敬酒？"}, {"a": "我們在眷村，就請部隊的弟兄喝喝酒，吃幾個菜，很簡單。", "r": "跟弟兄們一起熱鬧，也很有味道。伯伯那時候有被灌酒嗎？"}, {"a": "我都沒吃到，當新娘一直站著，累死了。", "r": "對耶，新娘最辛苦，整天站著還要陪笑。那天結束的時候，您第一件想做的事是什麼？"}], "more": "那天有誰幫您很多忙，您到現在還記得？"}, {"q": "阿嬤，回想起來，您覺得那時候嫁過去，是開心多，還是擔心多？", "kind": "感受", "ans": [{"a": "擔心啊，嫁去那麼遠，什麼人都不認識，第一天晚上偷偷哭。後來婆婆對我不錯，才慢慢習慣。", "r": "一個人去陌生的地方，第一晚會哭真的很能理解。後來是什麼事讓您覺得婆婆對您好？"}, {"a": "開心啦，終於不用在家裡被我哥哥管。", "r": "哈哈，等於是自己當家了。那嫁過去以後，您最喜歡做的事是什麼？"}, {"a": "我不想講這個，嫁錯人了。", "r": "嗯，聽起來那段日子吃了不少苦。阿嬤不想講沒關係，我們聊您自己喜歡的事就好，您年輕時最喜歡做什麼？"}], "more": "如果現在可以跟年輕時的自己說一句話，您會說什麼？"}], "care": "婚姻是長輩不一定自己選的，可能帶出包辦婚姻的委屈、婆媳衝突、家暴、離婚或童養媳、養女的身世；長輩說「嫁錯人」「不想講」時，不追問細節、不評論對方家人，簡單反映「那時候很辛苦」後轉到長輩自己身上的事。若伴侶已過世，提到婚禮可能突然想念落淚，就陪著、遞衛生紙，允許他說；外省老兵可能沒結婚或家人在對岸，不要預設每個人都有婚禮。若長輩透露現在仍受配偶或家人打罵、限制，或情緒持續低落，當天記錄並回報督導或個管員。", "next": "請長輩教你摺一把紙扇，或一起看他的結婚照，請他指出照片裡每一個人是誰。"}, {"id": "life-02", "cat": "家庭與人生", "title": "把孩子拉拔長大", "sub": "生幾個、怎麼帶大、最辛苦的那幾年", "lv": 2, "opener": "阿姨，我家老二昨天又半夜發燒，我抱著他整晚沒睡，今天眼睛都睜不開。我就想，您以前孩子那麼多，到底是怎麼帶的啊？", "props": "一條布尿布或紗布巾、一個搖籃或背巾的照片、一罐老式奶粉罐照片、孩子小時候的照片（請家屬提供）、哼〈搖嬰仔歌〉", "know": ["1950到60年代台灣家庭常生五六個以上的孩子；政府1960年代開始推家庭計畫，1971年前後喊出「兩個孩子恰恰好，男孩女孩一樣好」，所以長輩的孩子數差別很大。", "早年鄉下多在家裡生，請「產婆」來接生；坐月子要吃麻油雞、喝米酒燉的補湯，不能洗頭、不能吹風。", "那時候用布尿布，一天要洗好多條，曬在竹竿上；嬰兒用背巾背在背上，媽媽照樣下田、煮飯、做手工。", "1968年開始實施九年國民義務教育，在那之前很多孩子小學畢業就去做工或當學徒，家裡常是大的帶小的、大的出去賺錢供弟妹讀書。", "1970年代「客廳即工廠」很普遍，媽媽在家一邊帶孩子一邊做塑膠花、成衣、電子零件等代工，算件計酬。"], "qs": [{"q": "阿嬤，您生了幾個孩子？男生多還是女生多？", "kind": "選擇", "ans": [{"a": "生了六個，四個查某、兩個查埔，最小的跟最大的差了十幾歲，大的都在幫我背小的。", "r": "六個耶，阿嬤真的好厲害。大姊背弟弟妹妹，那她小時候也很辛苦喔？"}, {"a": "三個吧，還是四個？我想不起來。", "r": "沒關係，孩子多了數一下也會亂。我們先說最大的那個，是男生還是女生？"}, {"a": "我沒有生，我是幫我先生帶他前妻的孩子。", "r": "原來是這樣，沒有生卻把孩子帶大，這份心意更不容易。那時候孩子幾歲到您身邊的？"}], "more": "取名字是誰取的？有什麼意思嗎？"}, {"q": "以前沒有紙尿布，也沒有很多奶粉，您是怎麼把孩子養大的？", "kind": "請教", "ans": [{"a": "布尿布啊，用舊衣服剪的，一天洗二三十條，冬天手都凍到裂開。沒奶就煮米湯，米湯上面那層最營養。", "r": "米湯上面那層，這個我真的第一次聽到。阿嬤教我，那個米湯要怎麼煮才會有那層？"}, {"a": "孩子都是我婆婆在帶，我要去工廠上班。", "r": "所以白天是婆婆顧，您在外面賺錢，兩個人分工撐起這個家。下班回來看到孩子，是什麼心情？"}, {"a": "就這樣養啊，有什麼好講的。", "r": "對阿嬤來說是理所當然，可是我聽起來真的很不簡單。您覺得那時候最麻煩的是洗衣服，還是孩子生病？"}], "more": "孩子小時候最愛吃什麼？"}, {"q": "伯伯，孩子小時候，您最常帶他們去哪裡玩？", "kind": "回想", "ans": [{"a": "去溪邊抓魚啊，我騎腳踏車，前面坐一個後面坐兩個，玩到天黑才回來，回家被他媽罵。", "r": "一台腳踏車載三個，伯伯技術真好。抓到的魚，晚上有煮來吃嗎？"}, {"a": "哪有時間玩，我一年到頭都在跑船，回來孩子都不認得我。", "r": "跑船那麼久不在家，回來孩子不認得，心裡一定很不是滋味。那您每次回來，會帶什麼東西給他們？"}, {"a": "沒有，我們山上的孩子自己會玩。", "r": "山上的孩子自己找樂子，一定很會爬樹、找果子。他們最常玩什麼？"}], "more": "有沒有哪一次出去玩，您到現在還記得很清楚？"}, {"q": "帶孩子這麼多年，哪一段時間您覺得最辛苦？", "kind": "感受", "ans": [{"a": "老三出生那年，我先生生病不能做，我白天去挑磚，晚上做家庭代工到半夜，有時候累到抱著孩子就睡著了。", "r": "白天挑磚晚上做代工，阿姨是用自己的身體把這個家撐住的。那時候是什麼讓您撐下去？"}, {"a": "都很辛苦，哪有哪一段不辛苦。", "r": "嗯，每一天都在拚，真的不容易。那有沒有哪一刻，您覺得辛苦有值得？"}, {"a": "我有一個孩子很小就走了，那是最苦的。", "r": "阿嬤，這一定是很深的痛。您願意的話，可以跟我說說這個孩子，他叫什麼名字？"}], "more": "那時候有誰幫過您，您一直記在心裡？"}, {"q": "孩子小時候有沒有做過什麼事，讓您又好氣又好笑？", "kind": "回想", "ans": [{"a": "有啦，老二偷拿錢去柑仔店買糖，被老闆娘跑來跟我講，我拿竹子要打，他躲到床底下不出來。", "r": "躲床底下，太可愛了。後來阿嬤有打下去嗎，還是看到就心軟了？"}, {"a": "不記得了，太久了。", "r": "對，孩子都長那麼大了，小時候的事很難記得。阿嬤記得他們小時候是比較皮，還是比較乖？"}, {"a": "我女兒很乖，從小就會幫我煮飯，不用我煩惱。", "r": "這麼小就會煮飯，阿嬤教得好。她第一次煮的是什麼？"}], "more": "現在孩子長大了，個性跟小時候像不像？"}, {"q": "阿姨，現在孩子都大了，他們常回來看您嗎？", "kind": "開放", "ans": [{"a": "大的每個禮拜都回來，帶水果、帶孫子，小女兒住國外，每天晚上打視訊給我。", "r": "有每週回來的，也有每天視訊的，阿姨好幸福。視訊的時候你們都聊什麼？"}, {"a": "我兒子都不來看我，生這麼多有什麼用。", "r": "阿姨很想他們，等不到人，心裡一定很空。您最想念的是哪一個？想跟他說什麼？"}, {"a": "他們很忙啦，我不想吵他們。", "r": "阿嬤很體貼孩子，可是自己也會想他們吧。如果他們今天有空回來，您最想一起做什麼？"}], "more": "如果可以跟孩子說一句心裡話，您想說什麼？"}], "care": "這個主題最容易碰到孩子早逝、流產、送養、重男輕女的遺憾，以及「孩子都不來看我」的被遺棄感；長輩提到過世的孩子時，不要急著轉話題或安慰「不要想了」，可以問孩子的名字、讓他說，陪著靜默也可以。長輩抱怨子女時，只反映他的思念和失落，不幫子女辯解、不批評子女、不答應幫他打電話叫人回來，也不把家務事傳出去；若長輩長期表達孤單、被忽略，或說出「養他們沒用，我死了算了」這類話，當天記錄原話並回報督導或個管員，由專業人員評估與聯繫家屬。若懷疑有疏忽照顧、經濟剝削或不當對待，依規定通報，不要自己去找家屬理論。", "next": "一起摺一條小方巾當布尿布，請長輩示範以前怎麼包嬰兒、怎麼用背巾背孩子。"}, {"id": "life-03", "cat": "家庭與人生", "title": "阿公阿嬤的金孫", "sub": "帶孫的回憶、孫子近況、兩代差很多", "lv": 1, "opener": "阿嬤，我看您冰箱上貼好多照片，這個戴學士帽的是不是您孫子？好帥喔，跟您的眼睛好像。", "props": "長輩家裡孫子的照片（冰箱、相框、手機裡的）、一個小時候玩的玩具如陀螺或紅包袋、用手機播一段孫子的影片或語音（請家屬提供）", "know": ["台灣很多雙薪家庭把孩子交給阿公阿嬤帶，叫「隔代教養」；也有孫子小時候住阿嬤家，上小學才接回父母身邊的。", "2026年75到95歲的長輩，孫子多半是二三十歲，甚至有曾孫；孫子可能在讀大學、當兵、上班或在外地與國外工作。", "教育部在2010年訂定「祖父母節」，是每年8月的第4個星期日。", "兩代差異常見的話題：手機和網路、晚婚或不婚、少生孩子、吃外食、出國旅行、轉職，很多長輩會覺得「看不懂現在的年輕人」。", "很多長輩會用LINE視訊或聽孫子傳的語音；有些長輩只會接、不會打，需要家人幫忙設定。"], "qs": [{"q": "阿嬤，您有幾個孫子？有曾孫了嗎？", "kind": "是非", "ans": [{"a": "有喔，七個孫，兩個曾孫，上個月剛生一個查某的，好可愛，我抱了好久。", "r": "恭喜阿嬤，四代同堂耶。抱曾孫的時候，有沒有想到以前抱自己孩子的感覺？"}, {"a": "有幾個喔……很多啦。", "r": "很多就是好福氣。我們看照片好了，這個是誰？"}, {"a": "我沒有孫子，孩子都沒結婚。", "r": "現在很多年輕人比較晚結婚，阿嬤會不會有點著急？還是覺得他們開心就好？"}], "more": "哪一個孫子最常黏著您？"}, {"q": "孫子小時候，是不是阿公阿嬤幫忙帶的？", "kind": "是非", "ans": [{"a": "對啊，大孫從滿月就給我帶，帶到上小學，他叫我比叫他媽媽還親，到現在還叫我阿嬤媽。", "r": "阿嬤媽，這個稱呼好暖。您一手帶大的，感情一定特別深。他小時候最愛您煮什麼？"}, {"a": "沒有，他們住台北，一年才回來一兩次。", "r": "住得遠，一年見一兩次，每次回來應該都很期待。他們回來的時候，您都準備什麼給他們？"}, {"a": "帶到很累，腰都閃到，現在講到就想到那個痛。", "r": "帶孫真的是體力活，阿嬤是用身體在幫孩子。那麼累還是帶，是什麼讓您願意？"}], "more": "那時候您都怎麼哄孫子睡覺？"}, {"q": "伯伯，您的孫子現在在做什麼？讀書還是上班了？", "kind": "開放", "ans": [{"a": "大孫在竹科當工程師，很會賺，過年都包大紅包給我，還帶我去吃牛排。", "r": "孫子這麼孝順，伯伯一定很驕傲。吃牛排的時候，您有吃得習慣嗎？"}, {"a": "不知道，他們都不跟我講。", "r": "孫子長大了比較少分享，伯伯心裡會不會有點想知道？下次他回來，您最想問他什麼？"}, {"a": "我孫女嫁去日本了，在那邊開店。", "r": "嫁到日本還自己開店，好能幹。她都怎麼跟您聯絡？"}], "more": "您覺得哪個孫子的個性最像您？"}, {"q": "阿公，您覺得現在的孩子跟你們那時候比，哪裡差最多？", "kind": "請教", "ans": [{"a": "差多了，我們十幾歲就要去做工，現在的孩子三十歲還在讀書，手機不離手，吃飯也在看。", "r": "阿公十幾歲就撐起一份工作，真的很早就扛責任。那您覺得現在孩子有沒有哪裡比你們那時候好？"}, {"a": "都一樣啦，孩子就是孩子。", "r": "阿公看得很開，覺得每一代的孩子都一樣可愛。您覺得孩子最需要大人給他什麼？"}, {"a": "現在的孩子比較敢講，我們以前哪敢跟爸爸頂嘴。", "r": "對，以前爸爸一個眼神就不敢動了。阿公小時候的爸爸，是很兇的那種嗎？"}], "more": "如果您可以教孫子一件以前的本領，您想教什麼？"}, {"q": "孫子有沒有教過您用手機、打視訊？", "kind": "是非", "ans": [{"a": "有啊，孫女教我用LINE，我現在會傳貼圖，早上都傳早安給大家，她說我比她還勤勞。", "r": "阿嬤會傳早安圖，好厲害。您最喜歡傳哪一張？給我看看。"}, {"a": "不會啦，那個太難了，按一按就不見了。", "r": "對，手機有時候真的很難懂，我自己也常按錯。阿嬤想看孫子的話，下次我們可以請家人幫忙接好視訊。"}, {"a": "他們都在滑手機，叫都不理我。", "r": "坐在旁邊卻像沒在一起，阿嬤會覺得被冷落。如果他們放下手機，您最想跟他們聊什麼？"}], "more": "您希望孫子多久回來看您一次？"}, {"q": "阿嬤，如果孫子現在就在這裡，您最想跟他說什麼？", "kind": "感受", "ans": [{"a": "叫他要早點結婚，不要太累，身體要顧好，有空回來吃阿嬤煮的飯。", "r": "句句都是疼他。我聽到最重要的是要他身體顧好，阿嬤最在意的是他平安。"}, {"a": "他都不來，說了也沒用。", "r": "阿嬤等了很久，心裡有點灰了。就算他現在聽不到，您想說什麼我都幫您記著。"}, {"a": "嗯……那個……很乖。", "r": "阿嬤覺得孫子很乖。您摸摸這張照片，他笑得好開心喔。"}], "more": "要不要我們一起錄一段話，請家人傳給他？"}], "care": "長輩可能因孫子長大少回來、家族不和、子女離婚導致見不到孫子，或孫輩早逝而難過；說「他們都不來」時，先反映思念，不要替孫子找理由，也不要答應幫忙聯絡或私下傳話給家屬。若長輩把孫子名字或關係說錯，不要糾正，跟著他的說法走；看照片時讓他主導，認不出來就說「我們一起看看」，不要考他「這是誰」。若長輩持續說沒人要他、被丟在家裡，或帶孫造成身體受傷、經濟被要求負擔過重，記錄下來回報督導或個管員；錄語音傳給家屬要先經過家屬或單位同意。", "next": "請長輩挑一張孫子的照片，一起在背面寫下一句祝福，或錄一段給孫子的話交給家屬。"}, {"id": "life-04", "cat": "家庭與人生", "title": "我家那個老伴", "sub": "怎麼認識、對方個性、怎麼相處", "lv": 2, "opener": "阿嬤，我先生早上出門又忘了帶鑰匙，打電話叫我送去，我一邊念一邊還是送了。您跟阿公在一起那麼久，是不是也常這樣？", "props": "兩人合照或結婚照（請家屬提供）、伴侶生前常用的物品如帽子、茶杯、老花眼鏡（長輩願意才拿）、播〈心事誰人知〉或〈月亮代表我的心〉", "know": ["閩南長輩常稱另一半「牽手」「頭家」「阮尪」「阮某」，外省長輩叫「老伴」「我家那口子」，客家長輩也常用「阿婆」「阿公」稱呼自己伴侶，是跟著孫子叫。", "那個年代常是「先結婚後戀愛」，很多夫妻是婚後才慢慢認識對方，吵吵鬧鬧走了五六十年。", "阿美族傳統是母系社會，男方常住到女方家，家裡大事由女性長輩做主，所以原住民長輩講的夫妻分工可能和閩南家庭不同。", "伴侶過世後，台灣習俗有做七、百日、對年、三年，之後每年做忌日；長輩常在忌日、生日、結婚紀念日前後特別想念。", "也有長輩離婚、分居，或伴侶住在機構，或因為戰亂兩岸分隔多年，不能預設每個人都是白頭偕老。"], "qs": [{"q": "阿嬤，阿公現在還在身邊嗎？", "kind": "是非", "ans": [{"a": "還在啦，在客廳看電視，整天就看新聞，聲音開那麼大，吵死了。", "r": "嘴巴念，可是一直留意他在做什麼，阿嬤還是很關心他。他最愛看哪一台？"}, {"a": "走了，走五年了。", "r": "五年了，阿嬤一定很常想起他。您願意跟我說說阿公是個怎麼樣的人嗎？"}, {"a": "他去上班了，等一下就回來。", "r": "阿嬤在等阿公回來。您等他的時候，最常幫他準備什麼？"}], "more": "您都怎麼叫他？叫名字還是叫別的？"}, {"q": "伯伯，您第一次見到阿姨，對她的印象是什麼？", "kind": "回想", "ans": [{"a": "她很會笑，眼睛笑起來彎彎的，我那時候是阿兵哥，在眷村旁邊的雜貨店看到她在顧店，每天都去買菸，其實是去看她。", "r": "每天買菸是為了看她，伯伯好會追。後來是誰先開口的？"}, {"a": "沒什麼印象，媒人帶來看一下就定了。", "r": "那時候很多都是看一眼就定，沒什麼時間認識。那結婚以後，您是什麼時候發現她的好？"}, {"a": "很兇啦，第一次見面就嫌我太黑。", "r": "第一次見面就被嫌，伯伯還是娶到她了，有本事。後來她還有嫌您黑嗎？"}], "more": "她身上有什麼是您最欣賞的？"}, {"q": "阿公是急性子還是慢性子？", "kind": "選擇", "ans": [{"a": "急啦，什麼都要馬上，出門我還在穿鞋他就在外面按喇叭，可是我生病他比誰都緊張，半夜騎車載我去看醫生。", "r": "平常催得很兇，緊要關頭最先衝出來，這就是阿公疼您的方式吧。那次生病是什麼時候？"}, {"a": "慢，講話慢做事也慢，我做完三件事他一件還沒好。", "r": "一快一慢剛好互補。他慢慢做的時候，阿嬤都怎麼辦？"}, {"a": "忘記了。", "r": "沒關係。阿嬤覺得他是比較會講話的，還是比較安靜的？"}], "more": "他有沒有什麼口頭禪？"}, {"q": "你們在一起這麼多年，有吵架嗎？吵完都怎麼和好？", "kind": "請教", "ans": [{"a": "怎麼可能沒吵，吵到要離婚好幾次，可是吵完他就去買我愛吃的肉粽，放在桌上不講話，我就知道他在道歉。", "r": "一顆肉粽代替對不起，好可愛的和好方法。阿嬤教我，那您收到肉粽，都怎麼回應他？"}, {"a": "沒在吵，他講什麼我都聽，那個年代女人就是要忍。", "r": "阿嬤一路忍過來，背後一定吞了很多委屈。那您自己心裡的話，都跟誰說？"}, {"a": "他會打人，不要講他。", "r": "聽起來您那時候受了很多苦，謝謝您願意說。您現在在家裡，覺得安全嗎？"}], "more": "您覺得夫妻能走這麼久，最重要的是什麼？"}, {"q": "阿姨，您覺得阿伯最讓您放不下的是什麼？", "kind": "感受", "ans": [{"a": "他做了一輩子，都沒享到福，剛退休想帶我去日本玩，就生病了。我到現在還會想，那時候早點去就好了。", "r": "這個遺憾一直放在阿姨心上。你們本來想去日本哪裡？他最想看什麼？"}, {"a": "沒有什麼放不下，他走了我比較輕鬆。", "r": "照顧他那幾年應該很累，阿姨現在有自己的時間了。您現在最喜歡怎麼過一天？"}, {"a": "他每天晚上都回來，坐在那張椅子上。", "r": "阿姨覺得他還在陪著您。他坐在那裡的時候，您會跟他說什麼？"}], "more": "如果可以再跟他說一句話，您想說什麼？"}, {"q": "如果孫子要結婚了，您會教他怎麼跟另一半相處？", "kind": "請教", "ans": [{"a": "要互相啦，一個硬另一個就要軟，錢要一起管，不要在孩子面前吵，睡前一定要和好。", "r": "睡前一定要和好，這句我要記起來。阿嬤這些是吃了多少苦才學來的？"}, {"a": "我又不會，我自己就沒處好。", "r": "阿嬤很誠實。就算沒處好，您一定知道哪些地方不要再重來，這也是很重要的經驗。"}, {"a": "娶老婆要娶會煮飯的。", "r": "哈哈，阿公最實在。那您覺得阿嬤煮的哪一道菜，讓您最想回家？"}], "more": "您覺得另一半最需要聽到的一句話是什麼？"}], "care": "伴侶可能已過世、失智、住機構、離婚、家暴或兩岸分隔多年，開口前先從家屬或個管紀錄了解狀況，用「阿公現在還在身邊嗎」這類問法讓長輩自己說，不要直接問「阿公去哪了」。長輩若忘記伴侶已過世、說「他等一下回來」，不要糾正或重新告知死訊，順著他的情緒聊對方的事；伴侶剛過世一兩年、接近忌日，或長輩說「他走了我也想跟他去」「活著沒意思」時，要溫和問清楚他是否有想傷害自己，不要讓他獨處，當天立即回報督導或個管員，情況緊急撥119或安心專線1925。若長輩透露目前仍有家暴、被控制或不安全，記下原話並依規定通報，不要自己去勸說加害者。", "next": "請長輩拿出兩人合照，一起替照片寫一句標題，或唱一首他們年輕時一起聽的歌。"}, {"id": "life-05", "cat": "家庭與人生", "title": "這輩子最驕傲的事", "sub": "做過的成就、撐過的難關、被人感謝", "lv": 3, "opener": "伯伯，我上禮拜第一次自己幫阿嬤洗澡洗得很順，她跟我說謝謝，我回家高興了一整晚。您這輩子，有沒有哪件事想起來就覺得很驕傲？", "props": "長輩的獎狀、獎牌、工作證、退休紀念品、自己蓋的房子或工作地點的照片、長輩做過的手工作品；播〈愛拚才會贏〉", "know": ["1960到70年代台灣經濟起飛，加工出口區成立（高雄加工出口區1966年開始營運），大批年輕人從鄉下到城市工廠做工、當學徒。", "1970年代十大建設（例如中山高速公路、桃園機場、北迴鐵路、中鋼、核一廠）動員大量工人，很多長輩參與過工地、隧道、造船工作。", "很多長輩最驕傲的不是職位，而是「把孩子都養大、都讀到書」「自己蓋了一間厝」「沒欠人家錢」「照顧公婆到最後」。", "女性長輩常在家做代工、擺攤、幫人洗衣煮飯，賺的錢貼補家用，自己卻常說「我沒做什麼」，需要被看見。", "原住民長輩可能以打獵、遠洋漁業、建築鷹架工作為傲；新住民婆婆可能以學會中文、台語、在台灣把家撐起來為傲。"], "qs": [{"q": "阿公，您年輕時做什麼工作？做了幾年？", "kind": "回想", "ans": [{"a": "做木工啦，做四十幾年，這附近好幾間廟的門窗都是我刻的，你去看就知道，到現在還很漂亮。", "r": "廟裡的門窗是阿公刻的，等於您的作品一直在那裡。哪一間廟？下次我經過要特別去看。"}, {"a": "什麼都做，種田、做工、賣菜，沒有固定的。", "r": "什麼都做過，阿公真的很能扛。在這麼多工作裡，您覺得哪一個做得最順手？"}, {"a": "沒做什麼啦，我就家庭主婦。", "r": "阿嬤，家庭主婦是全年無休的工作耶，煮飯洗衣帶孩子都是您。您一天大概從幾點忙到幾點？"}], "more": "那份工作，您最拿手的一招是什麼？"}, {"q": "這輩子您覺得自己做得最好的一件事是什麼？", "kind": "開放", "ans": [{"a": "把五個孩子都養大，兩個讀到大學，我自己只讀到小學三年級，以前賣菜一塊一塊存下來的。", "r": "自己讀到小三，卻讓孩子讀到大學，阿嬤是用一塊一塊的菜錢鋪出孩子的路。那時候最難存的是哪一筆？"}, {"a": "沒有啦，我這輩子沒什麼好講的。", "r": "阿伯很客氣。那我問小一點的，有沒有一件事是您做完，心裡覺得「還不錯」的？"}, {"a": "我一個越南來的，學會講台語，還會跟菜市場的人殺價，大家都說我比本地人還會。", "r": "從一句都不會到會殺價，阿姨下了好大的功夫。您學的第一句台語是什麼？"}], "more": "那時候有人稱讚過您嗎？說了什麼？"}, {"q": "伯伯，這輩子最難熬的一關是什麼？您是怎麼撐過來的？", "kind": "回想", "ans": [{"a": "八七水災那年房子被沖走，什麼都沒了，我跟我爸用撿來的木頭重新搭，一家人擠在一間，慢慢再站起來。", "r": "房子沒了還能一根一根木頭搭回來，伯伯那時候才幾歲？真的是硬撐出來的。"}, {"a": "一個人從大陸過來，十幾歲就當兵，沒有家人，過年都一個人。", "r": "十幾歲離開家，一個人在這裡過年，那種孤單很難想像。那時候是誰陪著您？"}, {"a": "現在最難熬，什麼都不能做，活著沒意思。", "r": "伯伯，聽起來您現在真的很辛苦，謝謝您跟我說。您說活著沒意思，是不是有時候會想乾脆不要活了？"}], "more": "撐過那一關以後，您對自己有什麼新的認識？"}, {"q": "有沒有人曾經特別感謝您，到現在還記得？", "kind": "回想", "ans": [{"a": "有啊，以前隔壁的小孩爸媽不在，常常來我家吃飯，現在他當老師了，過年都回來拿紅包給我，說是我養他的。", "r": "一碗一碗飯把一個孩子養成老師，阿嬤做了一件很大的善事。他小時候最愛吃您煮的什麼？"}, {"a": "沒有，誰會謝我。", "r": "那我先謝謝您，每次我來您都會叫我喝水、問我吃飽沒，我覺得被照顧到。您以前一定也這樣照顧很多人吧？"}, {"a": "我在部落幫大家蓋房子，不用錢的，大家請我喝酒就好。", "r": "幫部落蓋房子不收錢，大家一定很敬重您。您蓋過幾間啊？"}], "more": "您覺得被人感謝的時候，心裡是什麼感覺？"}, {"q": "阿嬤，您有沒有什麼本領，是別人都比不上的？", "kind": "請教", "ans": [{"a": "我包粽子最快，一個早上可以包三百顆，以前過節整條街都來跟我訂，綁的繩子不會鬆。", "r": "一個早上三百顆，太厲害了。阿嬤可以教我，那個繩子要怎麼綁才不會鬆嗎？"}, {"a": "我哪有什麼本領。", "r": "我覺得有喔，像您摺衣服摺得好整齊，我都摺不出來。您可以教我怎麼摺嗎？"}, {"a": "我會唱山歌，以前採茶的時候大家一邊採一邊對唱。", "r": "採茶對山歌，好有畫面。阿嬤可以唱兩句給我聽嗎？我學您。"}], "more": "這個本領是跟誰學的？"}, {"q": "如果要替自己這一生頒一個獎，您會頒給自己什麼獎？", "kind": "感受", "ans": [{"a": "吃苦耐勞獎啦，我這輩子沒有一天休息，可是沒有欠人家一毛錢，也沒有做對不起別人的事。", "r": "沒有欠人一毛錢、沒做對不起人的事，這個獎阿公拿得很光榮。我幫您鼓掌。"}, {"a": "不知道，什麼獎？", "r": "就像學校發獎狀那樣。我幫您想，您把家顧得這麼好，頒您一個「顧家獎」好不好？"}, {"a": "我不配拿獎，我對不起我的孩子。", "r": "阿姨心裡有一份很深的愧疚。您願意的話，可以跟我說說是什麼事讓您這樣想嗎？我在聽。"}], "more": "這個獎您想請誰來頒給您？"}], "care": "回顧人生可能讓長輩自我肯定，也可能翻出失敗、破產、愧疚、戰亂與天災的創傷，或因為現在失能而覺得「沒用了」；長輩說「沒什麼好講」時，用當下看得到的小事具體肯定他，不要硬誇或說「您很棒啦」帶過。若長輩說「活著沒意思」「拖累孩子」「不如死一死」，不要迴避也不要說教，溫和直接問他是否有想傷害自己或已經有計畫，陪在身邊，當天立即回報督導或個管員；若有計畫或已準備方法，撥119或安心專線1925，並通知家屬，不要答應幫他保密。長輩說出的愧疚與家族祕密，聽就好，不評價、不轉述給其他家人。", "next": "一起替長輩做一張手寫獎狀，寫上他自己選的獎名，請他簽名後貼在牆上或拍照給家人。"}, {"id": "life-06", "cat": "家庭與人生", "title": "想對年輕人說的話", "sub": "人生智慧、做人道理、如果重來一次", "lv": 3, "opener": "阿公，我女兒剛出社會，在公司被主管罵就說不想做了，我都不知道怎麼勸她。您走過這麼多路，如果是您，會跟她說什麼？", "props": "一張空白卡片或便條紙和粗簽字筆、一本舊日曆或農民曆、長輩年輕時的照片；播〈家後〉或〈快樂的出帆〉", "know": ["長輩常用俗語講道理，例如「吃果子拜樹頭」（飲水思源）、「好天著存雨來糧」（好的時候要為壞的時候準備）、「食米毋知米價」（不知道生活艱難）。", "客家長輩常重視「硬頸」精神與「晴耕雨讀」，強調刻苦、節儉、讀書；外省長輩常提「吃苦當吃補」、要孝順、要有骨氣。", "心理學上，老年期常會回顧一生、整理意義，能把經驗傳給下一代，對長輩的自我價值感很有幫助。", "長輩說「如果重來一次」時，常會帶出沒讀書、沒選的路、沒說出口的話，這是正常的人生回顧，不需要急著安慰說「已經很好了」。", "可以把長輩的話寫下來、錄下來，整理成給孫子的一句話卡片，家屬通常很珍惜。"], "qs": [{"q": "阿嬤，您覺得做人最重要的是什麼？", "kind": "請教", "ans": [{"a": "要老實啦，不要騙人，別人對你好要記得，吃果子要拜樹頭，我一輩子就是靠這個。", "r": "吃果子拜樹頭，阿嬤講得好實在。您這一生，有哪一個人是您一直記著要感謝的？"}, {"a": "不知道啦，我不會講道理。", "r": "阿嬤不用講大道理。那您以前最常叮嚀孩子的一句話是什麼？"}, {"a": "要吃苦，我們那時候吃苦當吃補，現在的年輕人太好命了。", "r": "阿伯是苦過來的，所以特別知道吃苦的價值。您覺得吃苦讓您學到最多的是什麼？"}], "more": "這個道理是誰教您的？"}, {"q": "阿公，年輕人說工作很累不想做，您會怎麼勸他？", "kind": "請教", "ans": [{"a": "我會跟他說，我十四歲當學徒，被師傅打頭也要學，學會了就是自己的，誰都拿不走。不要遇到一點事就跑。", "r": "學會了就是自己的，這句好有力量。您當學徒的時候，有沒有想過要逃？"}, {"a": "不想做就不要做啊，現在不像以前，換個工作也好。", "r": "阿公很開明耶，覺得年輕人可以有選擇。那您以前有想換卻沒換的工作嗎？"}, {"a": "嗯，好，你說什麼？", "r": "我是說年輕人工作很累。阿公以前工作累的時候，是喝杯茶，還是睡一覺？"}], "more": "您覺得找工作，最重要是錢多，還是做得開心？"}, {"q": "伯伯，錢要怎麼存、怎麼花，您有什麼祕訣？", "kind": "請教", "ans": [{"a": "好天要存雨來糧啊，賺十塊存三塊，以前我們都標會，存到錢就買一塊地，現在的人都刷卡，太危險了。", "r": "賺十塊存三塊，伯伯這個方法很清楚。標會是怎麼標的？可以教我嗎？"}, {"a": "我被人家倒會倒了好幾十萬，錢不要隨便借人。", "r": "被倒會那麼多錢，那時候一定很難過也很氣。後來您是怎麼重新站起來的？"}, {"a": "錢是孩子在管，我不知道。", "r": "現在交給孩子管，阿伯可以比較輕鬆。那您年輕的時候，第一份薪水是怎麼用的？"}], "more": "您第一次存到一筆錢，買了什麼？"}, {"q": "如果人生可以重來一次，您最想改變什麼？", "kind": "感受", "ans": [{"a": "我想讀書，我那時候成績很好，老師說可以考初中，可是家裡要我去做工，我哭了好幾天。", "r": "成績那麼好卻不能讀，這份遺憾放了好多年。如果那時候讀了，您想當什麼？"}, {"a": "不要改，再來一次也是一樣，就這樣。", "r": "阿公對自己這一生是接受的，這很難得。那如果再來一次，您最想再過一次的是哪一段？"}, {"a": "我想早點回去看我媽，等我可以回大陸的時候，她已經不在了。", "r": "等了那麼多年，回去卻見不到媽媽，伯伯心裡一定很痛。您還記得媽媽的樣子嗎？跟我說說她。"}], "more": "那一段時間，您有沒有一個人很想謝謝？"}, {"q": "阿嬤，您覺得人老了以後，什麼最重要？", "kind": "開放", "ans": [{"a": "身體顧好最重要，還有要有朋友，我每天早上去公園跟大家甩手、聊天，一天就很快樂。", "r": "身體和朋友，阿嬤都顧到了。公園裡跟您最好的是哪一位？"}, {"a": "老了就是等死啦，活著沒意思。", "r": "阿嬤這樣說，聽起來最近心裡很沉。是最近發生什麼事，還是常常有這種感覺？您會不會想要結束自己的生命？"}, {"a": "孩子平安就好，我自己沒關係。", "r": "阿嬤心裡第一個想到的永遠是孩子。那您自己呢？您每天做什麼會讓自己開心一點？"}], "more": "您覺得現在每一天，什麼時候最舒服？"}, {"q": "如果請您寫一句話送給孫子或年輕人，您想寫什麼？", "kind": "開放", "ans": [{"a": "做人要有良心，有能力就幫人，不要怕吃虧，吃虧就是佔便宜。", "r": "不要怕吃虧，這句很有智慧。我幫您寫在卡片上，您要寫給哪一個孫子？"}, {"a": "想不出來，你幫我想。", "r": "好，我們慢慢想。剛剛您說「身體要顧好」，要不要就寫這句？還是寫「阿嬤疼你」？"}, {"a": "跟他說，阿公對不起他，以前太兇了。", "r": "阿公心裡一直有這句話，能說出來很不容易。要不要我幫您寫下來，您決定要不要交給他？"}], "more": "您想親手簽名，還是蓋您的印章？"}], "care": "這個主題容易帶出人生遺憾、沒說出口的道歉、與子女的衝突，以及「老了沒用」「活著沒意思」「等死」的念頭；長輩說遺憾時先陪他停在那個感受，不要急著說「您已經很棒了」或替他找答案。出現想死、交代後事、把東西送人、說「不用再來了」等訊號時，要溫和直接問有沒有想傷害自己，不留他獨處，當天立即回報督導或個管員；若有具體計畫或方法，撥119或安心專線1925並通知家屬，不答應保密。長輩寫給家人的道歉或心裡話，要交給誰、要不要交，由長輩決定，交出前先經單位或個管員知道，避免引發家庭衝突。", "next": "一起做一張「人生一句話」卡片，長輩口述、居服員代寫，請長輩簽名或蓋章後交給他指定的家人。"}, {"id": "era-01", "cat": "節慶與時代記憶", "title": "過年的熱鬧滋味", "sub": "大掃除、圍爐、紅包到回娘家", "lv": 1, "opener": "阿嬤，我昨天在市場看到已經在賣春聯了，紅通通的好喜氣。我小時候最期待過年，因為可以穿新衣服。阿嬤以前過年都在忙什麼？", "props": "一張空白春聯紙或紅紙、一個紅包袋、一顆橘子或年糕、播〈恭喜恭喜〉或〈新年好〉", "know": ["舊曆十二月廿四是「送神」，家家戶戶大掃除（俗稱清屯、筅黗），把灶神送上天，正月初四再接神。", "除夕晚上圍爐，常見長年菜（芥菜，閩南）、雞（起家）、魚（年年有餘）、火鍋；客家人常吃長年菜、粄類，外省家庭常包餃子、做年夜飯。", "年夜飯後長輩發壓歲錢，小孩守歲；早年紅包多是幾角、一兩塊錢，能拿到十塊錢就很了不起。", "大年初一穿新衣、拜年、不掃地不倒垃圾；初二回娘家；初九天公生；正月十五元宵節提燈籠。", "以前新衣服多半是媽媽自己裁、或到布莊剪布給裁縫做，一年可能就過年這一套新衣，很多人捨不得穿。"], "qs": [{"q": "阿嬤，過年是不是很熱鬧？您喜不喜歡過年？", "kind": "是非", "ans": [{"a": "喜歡啊！過年最好了，小孩子都在等，有得吃又有得玩，鞭炮放得霹靂啪啦。", "r": "聽阿嬤這樣講，我好像都聽到鞭炮聲了。小時候阿嬤最愛吃過年的什麼？"}, {"a": "還好啦，過年都在忙，煮那麼多，累死人。", "r": "原來過年對阿嬤來說是最忙的時候，一家大小都靠您。您那時候都要煮幾桌啊？"}, {"a": "不知道，忘記了。", "r": "沒關係，那我們看看這個紅包袋，阿嬤摸摸看，紅紅的，有沒有過年的感覺？"}], "more": "那過年的時候，家裡會貼春聯嗎？"}, {"q": "年前大掃除，阿嬤家都是誰負責？要擦窗戶、洗地板嗎？", "kind": "回想", "ans": [{"a": "我啊，全家都我在弄。窗戶用報紙沾水擦，神明桌要擦得亮亮的，連蜘蛛絲都要用竹竿綁掃把去掃。", "r": "報紙擦窗戶真的會亮！阿嬤這招到現在還有人在用。神明桌是不是要最先擦？"}, {"a": "小孩子都要幫忙，我負責洗碗盤、搬椅子出去曬。", "r": "伯伯小時候就是大幫手呢。椅子搬出去曬太陽，是木頭的還是竹子的？"}, {"a": "掃什麼掃，那時候家裡也沒什麼東西。", "r": "以前東西少，家裡簡簡單單的。那阿嬤住的是什麼樣的房子？"}], "more": "那時候是幾號開始大掃除？送神那天嗎？"}, {"q": "除夕圍爐，桌上一定會有哪一道菜？是雞、魚，還是長年菜、餃子？", "kind": "選擇", "ans": [{"a": "長年菜啊，那個芥菜整葉不能切，要一口氣吃完，吃了才會長壽。還有一隻白斬雞。", "r": "長年菜不能切斷，好有意思的講究。阿嬤的白斬雞是自己養的雞嗎？"}, {"a": "我們是吃餃子，我老家山東的，過年一定要包，裡面還會包一個銅板，吃到的人好運。", "r": "包銅板的餃子！伯伯有吃到過嗎？那餃子是全家一起圍著包嗎？"}, {"a": "沒有啦，那時候窮，過年也是番薯簽配一點菜脯。", "r": "那時候日子真的很辛苦，有一點菜脯就很好了。那過年有沒有比平常多一點好吃的？"}], "more": "年夜飯那桌，誰坐最大位？"}, {"q": "阿公小時候拿過紅包嗎？那時候一個紅包大概多少錢？", "kind": "回想", "ans": [{"a": "有啊，阿公給我一塊錢，我高興得睡不著，拿去柑仔店買糖仔、買尪仔標。", "r": "一塊錢就可以讓阿公睡不著，那時候真的很值錢。尪仔標您贏過很多嗎？"}, {"a": "哪有紅包，大人自己都不夠用了。", "r": "那時候大家都過得很緊。沒有紅包，那過年有沒有什麼讓您開心的事？"}, {"a": "紅包都被媽媽收走了，說要幫我存。", "r": "哈哈，這個好多人都有一樣的經驗！後來有拿回來嗎？"}], "more": "那後來阿公當長輩，發紅包給孫子是什麼心情？"}, {"q": "過年穿新衣服，阿嬤記得是誰幫您做的嗎？", "kind": "感受", "ans": [{"a": "我媽媽自己裁的，用縫衣機一台一台踩，還會留大一點，說明年還能穿。", "r": "做大一點明年還能穿，媽媽好會打算。穿上新衣服那一刻，阿嬤是什麼心情？"}, {"a": "我們姊妹都穿姊姊剩下的，新衣服輪不到我。", "r": "當妹妹的常常這樣，心裡難免有點委屈吧。那後來有沒有一件屬於自己的衣服讓您印象很深？"}, {"a": "衣服喔，忘了。", "r": "好久了，忘了很正常。那阿嬤現在喜歡穿紅色的還是素色的？"}], "more": "那時候有沒有新鞋子可以穿？"}, {"q": "初二回娘家，阿嬤以前都帶什麼伴手禮回去？可以教我回娘家的規矩嗎？", "kind": "請教", "ans": [{"a": "要帶餅、帶雞、帶紅包給爸媽，還要在天黑以前回到婆家，不能在娘家過夜。", "r": "原來還要算時間回婆家，規矩好多。回到娘家見到爸媽，阿嬤最想做什麼？"}, {"a": "我娘家在大陸，那時候回不去，初二就只能在家裡想。", "r": "那一定很想念家裡的人。阿姨願意的話，跟我說說您老家過年是什麼樣子？"}, {"a": "回娘家有什麼好講的，路那麼遠，坐車坐好久。", "r": "路遠真的很累人。那時候是坐公路局，還是走路回去？"}], "more": "那娘家的媽媽會煮什麼給您吃？"}], "care": "過年容易讓人想起已經不在的父母、配偶，或回不去的故鄉（外省長輩、新住民婆婆），也可能想起貧窮的辛酸。如果長輩安靜下來或掉淚，不急著轉話題，先說「您很想他們吧」，陪他坐一下，再問他想不想說說那個人。", "next": "一起在紅紙上寫一個「春」或「福」字，或請長輩教你剪春字貼在門上。"}, {"id": "era-02", "cat": "節慶與時代記憶", "title": "粽子月餅與四季節日", "sub": "端午、中秋、清明、冬至的家常記憶", "lv": 2, "opener": "阿嬤，我上次吃到一顆南部粽，用水煮的，花生好香。我都不會綁粽子，綁了都會散掉。阿嬤以前端午節都包幾串啊？", "props": "一片粽葉或棉繩、一顆湯圓或文旦照片、艾草一小把（有就用）、播〈月亮代表我的心〉", "know": ["端午節（五月初五）：包粽子、划龍舟、門口插艾草和菖蒲避邪、中午取「午時水」、小孩戴香包，還有中午立雞蛋的玩法。", "台灣粽子大致分北部粽（糯米先炒過再蒸）和南部粽（生米包好用水煮）；客家有粄粽、鹼粽（冰粽）沾糖吃。", "中秋節（八月十五）早年是拜土地公、吃月餅、柚子（文旦）、賞月；中秋全家烤肉是 1980 年代以後才慢慢流行起來的。", "清明節掃墓（培墓），會壓墓紙、帶潤餅、草仔粿；客家人叫「掛紙」，時間常從元宵後就開始，不一定在清明當天。", "冬至搓湯圓，紅白兩色，俗話說「吃了湯圓多一歲」，有些人家會把湯圓黏在門上、灶上拜。"], "qs": [{"q": "阿嬤喜歡吃粽子還是月餅？", "kind": "選擇", "ans": [{"a": "粽子啦！我自己包的，裡面要放香菇、蛋黃、花生、三層肉，滷汁要先熬好。", "r": "聽起來就好香！阿嬤的料好豐富。三層肉是不是要先滷過？"}, {"a": "都不喜歡，太油了，吃了胃不舒服。", "r": "那阿嬤以前過節最喜歡吃什麼？還是喜歡清淡一點的？"}, {"a": "月餅，綠豆椪最好吃，一咬會掉滿地。", "r": "綠豆椪那個酥皮真的會掉滿地！阿嬤喜歡有肉的還是素的？"}], "more": "那過節的時候，是自己做還是去買？"}, {"q": "阿嬤可以教我怎麼綁粽子嗎？粽葉要怎麼摺？", "kind": "請教", "ans": [{"a": "兩片葉子疊起來，摺成一個漏斗，米放一半，放料，再蓋米，葉子往下壓，繩子繞兩圈拉緊，打活結。", "r": "哇，阿嬤講得好清楚，我拿這片葉子跟著摺看看，您幫我看對不對？"}, {"a": "我不會，都是我婆婆在包，我只負責洗葉子。", "r": "洗粽葉也是很重要的工作，要洗很多片吧？是用什麼刷？"}, {"a": "手不行了，現在包不動了。", "r": "以前包那麼多，手一定很辛苦。阿嬤不用動手，用嘴巴教我就好，我來當您的手。"}], "more": "那一次都包多少顆？一串掛在哪裡？"}, {"q": "端午節的時候，家門口會不會插艾草、菖蒲？", "kind": "是非", "ans": [{"a": "會啊，還要洗午時水，中午十二點去井邊打水，說那個水放很久都不會壞。", "r": "午時水！好多長輩都講過這個。阿嬤那時候打來的水是拿來做什麼？"}, {"a": "有，還要立蛋，中午把雞蛋立在桌上，我們小孩子比誰立得起來。", "r": "立蛋比賽好好玩！阿公那時候有贏過嗎？"}, {"a": "沒有吧，不記得了。", "r": "沒關係。阿嬤聞聞看這個艾草的味道，有沒有覺得很熟悉？"}], "more": "那時候有沒有看過划龍舟？"}, {"q": "中秋節以前是怎麼過的？是賞月、吃柚子，還是烤肉？", "kind": "回想", "ans": [{"a": "以前哪有烤肉！就拜土地公，吃月餅、剝柚子，柚子皮給小孩戴在頭上當帽子。", "r": "柚子皮帽子，好可愛的畫面！烤肉是後來孫子那一代才流行的對不對？"}, {"a": "後來兒子都在門口烤肉，整條巷子都是煙，我在旁邊幫忙刷醬。", "r": "整條巷子一起烤，好熱鬧。阿嬤那時候刷的醬是買的還是自己調的？"}, {"a": "中秋就是想家，我們從大陸過來，看到月亮就想到老家。", "r": "月亮一圓，特別想念家鄉。伯伯老家那邊中秋節是怎麼過的？"}], "more": "那天晚上的月亮，阿嬤會跟誰一起看？"}, {"q": "清明節去掃墓，阿公都準備什麼？", "kind": "開放", "ans": [{"a": "要帶鋤頭除草、壓墓紙，還要帶潤餅、紅龜粿去拜，拜完在山上吃。", "r": "拜完在山上一起吃，也是一家團聚。潤餅裡面阿公喜歡包什麼？"}, {"a": "我們客家人叫掛紙，元宵過後就去了，不一定等到清明。", "r": "原來客家掛紙比較早，謝謝伯伯教我。那時候全族一起去嗎？"}, {"a": "不想講這個，講到就想到我太太。", "r": "嗯，想到太太心裡會難過。不想講沒關係，我們先喝口水，休息一下。"}], "more": "那時候的墓是在山上嗎？要走很遠的路嗎？"}, {"q": "冬至搓湯圓，阿嬤家是搓紅的還是白的？", "kind": "選擇", "ans": [{"a": "紅白都有，全家圍在一起搓，還會黏幾顆在門上拜，說吃了湯圓多一歲。", "r": "全家圍著搓一定很溫暖。小孩子搓的是不是大大小小都有？"}, {"a": "我們外省人冬至吃餃子比較多，湯圓是元宵才吃。", "r": "原來不同地方習慣不一樣，阿姨家吃餃子。是什麼餡的？"}, {"a": "搓什麼？沒有啦。", "r": "沒關係。那阿嬤喜歡吃甜的湯圓，還是鹹的湯圓？"}], "more": "那湯圓是加紅糖薑湯，還是桂圓湯？"}], "care": "清明節與中元節容易勾起喪親的悲傷，外省長輩想到回不去的故鄉，中秋也可能特別寂寞。長輩不想談時尊重他，先接住情緒（「想到他心裡會難過吧」），不追問，改聊食物或手作的感官話題。", "next": "拿一片粽葉或紙條，請長輩手把手教你摺粽子三角形；或一起搓一小碗湯圓。"}, {"id": "era-03", "cat": "節慶與時代記憶", "title": "拜拜廟會鬧熱滾滾", "sub": "遶境、酬神戲，還有教會與佛堂", "lv": 2, "opener": "阿公，我上個月剛好遇到我們這邊的廟在遶境，鑼鼓好大聲，我站在路邊看了好久。阿公以前也有去看過迎神嗎？", "props": "一段鑼鼓陣或嗩吶的錄音、一張媽祖遶境或廟口照片、一串佛珠或一本聖歌本（依長輩信仰準備）", "know": ["媽祖生日是農曆三月廿三，三月前後全台很多遶境進香，俗稱「三月瘋媽祖」；大甲媽祖遶境九天八夜，1988 年起改往新港奉天宮，之前是去北港。", "廟會常見陣頭：八家將、宋江陣、舞龍舞獅、車鼓陣、北管；神明生日會請布袋戲、歌仔戲在廟口演「酬神戲」，演給神明看，也給村民看。", "初一、十五拜拜，農曆七月中元普渡；客家人有義民節，新竹新埔義民廟在農曆七月二十前後最熱鬧。", "很多長輩信佛教、一貫道、基督教或天主教；1950–60 年代美援時期，教會會發放麵粉、奶粉、舊衣，不少人有排隊領麵粉的記憶。", "原住民部落有自己的祭典，例如阿美族豐年祭（夏天），很多部落後來也有教會。"], "qs": [{"q": "阿公平常有在拜拜，還是去教會、佛堂？", "kind": "選擇", "ans": [{"a": "拜啊，初一十五都拜，我們家神明桌有媽祖跟土地公，每天早上都要點香。", "r": "每天點香，阿公好虔誠。神明桌上的香爐是誰在顧？"}, {"a": "我是信耶穌的，每個禮拜天都去教會，小時候還去領過麵粉。", "r": "阿姨是基督徒呀。領麵粉那時候是排很長的隊嗎？拿回家做什麼吃？"}, {"a": "沒在拜，什麼都不信。", "r": "好，阿公就是靠自己。那以前村子裡有拜拜的時候，您會去湊熱鬧看戲嗎？"}], "more": "那家裡是誰教您這些的？"}, {"q": "阿嬤有沒有跟過媽祖遶境，或是去進香？", "kind": "回想", "ans": [{"a": "有，我年輕時跟大甲媽走過，走好幾天，腳都起水泡，沿路有人給我們吃飯、喝水。", "r": "走好幾天，阿嬤好有毅力！沿路有人奉茶，是不是覺得很溫暖？"}, {"a": "沒有走，都是在路邊拜，轎子過來要跪下來給它鑽轎底。", "r": "鑽轎底！說是可以保平安對不對？阿嬤都帶誰一起去鑽？"}, {"a": "沒去過，那個人很多很擠。", "r": "對啊，人山人海，擠起來很累。阿嬤比較喜歡安靜一點的地方嗎？"}], "more": "那時候是走路還是坐遊覽車去進香？"}, {"q": "廟會的時候，阿公聽到鑼鼓聲是什麼感覺？", "kind": "感受", "ans": [{"a": "心頭就熱起來！我年輕時有在陣頭打鼓，一打就是一整天，手都不會酸。", "r": "原來阿公是打鼓的！難怪一聽就熱起來。您可以拍拍桌子給我聽那個節奏嗎？"}, {"a": "很吵，我都把門關起來。", "r": "鑼鼓真的很大聲，耳朵會受不了。阿公比較喜歡什麼樣的聲音？"}, {"a": "（看著窗外，沒回答）", "r": "我放一段鑼鼓給阿公聽聽看，您聽聽看，熟不熟？"}], "more": "那時候有看過八家將或舞獅嗎？"}, {"q": "以前廟口演布袋戲、歌仔戲，阿嬤會搬椅子去看嗎？", "kind": "是非", "ans": [{"a": "會！晚飯吃完就搬小板凳去佔位子，看到半夜，小孩子都睡在大人腳邊。", "r": "睡在大人腳邊看戲，好有畫面。阿嬤最記得哪一齣？"}, {"a": "大人在看戲，我們小孩在旁邊買零嘴，有烤香腸、麥芽糖。", "r": "戲台下的零嘴最好吃了！阿公那時候最想買哪一樣？"}, {"a": "沒有，我要做事，哪有空看戲。", "r": "阿嬤那時候一定很忙，一家大小都要照顧。那做事的時候，有聽到遠遠的戲聲嗎？"}], "more": "那時候的戲台是搭
